# Publica la carpeta dist en GitHub Pages con cada cambio de main, solo si las pruebas pasan
# y dist está al día (node build.js no cambia nada): hay que reconstruir y versionar dist antes de subir.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pruebas
        run: npm test
      - name: dist al día
        run: node build.js && git diff --exit-code --stat -- dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
