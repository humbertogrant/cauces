.extremo{font:400 14px var(--tit);color:var(--gris2)}
.puesto{background:var(--verde);color:#fff;padding:6px 10px;border-radius:999px;font-size:15px;font-weight:600}
.hueco{color:var(--gris3);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:#fff;border:1.5px solid var(--verde);color:var(--verde);padding:10px 14px;border-radius:999px;font:600 16px var(--cuerpo);cursor:pointer}
.chip.mal{border-color:var(--teja);color:var(--teja);background:var(--teja-fondo);animation:sacudir .4s}
@keyframes sacudir{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.chip.mal{animation:none}}
.pista{margin-bottom:12px}
.pregunta{font-size:22px;font-weight:500;line-height:1.25}
.opciones{display:flex;flex-direction:column;gap:8px;margin:12px 0 14px}
.op{text-align:left;background:#fff;border:1.5px solid var(--verde);color:var(--gris);padding:12px 14px;border-radius:6px;font:400 17px var(--cuerpo);line-height:1.3;cursor:pointer}
.op.bien{background:var(--verde);color:#fff}
.op.bien b{color:var(--verde-claro)}
.op.mal{background:var(--teja-fondo);border-color:var(--teja);color:var(--teja)}
.op.apagada{opacity:.45}
.nota{padding:10px 12px;margin-bottom:12px;border-left:4px solid var(--verde-claro);background:var(--suave);font-size:16px}
.nota.no{border-left-color:var(--teja)}
.resultado h2{font-size:44px}
.pie{font-size:13px;color:var(--gris3);margin-top:32px}
@media (min-width:760px){#mapa{height:46vh}h2{font-size:34px}#cab h1{font-size:28px}}
</style>
</head>
<body>
<div id="arriba">
  <div id="cab"></div>
  <div id="mapa"><button class="plegar" onclick="plegarMapa()" aria-label="Plegar o desplegar el mapa" title="Mapa más chico o más grande">▾</button><button class="mundo" onclick="verZona(null)" hidden>‹ Mundo</button><svg id="svg" viewBox="0 40 1000 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><path id="tierra" fill-rule="evenodd"/><g id="relieve" fill-rule="evenodd"></g><path id="lagos" fill-rule="evenodd"/><path id="fronteras"/><g id="capa"></g></svg><div class="luz" id="luz" aria-hidden="true"></div><div class="clima" id="clima" aria-hidden="true"></div></div>
  <div id="perfil" hidden></div>
</div>
<main id="panel"></main>
