paradas:[
{nombre:'Tenerife',pais:'España',pos:[28.47,-16.25],fecha:'junio de 1799',rumbo:'Por mar, al sur, hasta las islas Canarias',imagen:'Un tenedor (Tene-rife) clavado en la punta de un volcán de 3 715 m, con plantas distintas en cada diente según la altura.',dato:'Primera escala, en junio de 1799. Humboldt subió al Teide, de 3 715 m, y vio desde arriba cómo las plantas cambian por pisos con la altura: la idea que después dibujaría en los Andes.',escena:['volcan','muelle','palmera']},
{nombre:'Cumaná',pais:'Venezuela',pos:[10.46,-64.17],fecha:'julio de 1799',rumbo:'Cruzando el Atlántico, hasta la costa de Venezuela',imagen:'Una cuna (Cuma-ná) colgada en una cueva llena de pájaros que gritan de noche, y encima una lluvia de estrellas.',dato:'Llegaron el 16 de julio de 1799. Desde Cumaná exploraron la costa y la cueva del Guácharo, con sus pájaros nocturnos, y en noviembre vieron una lluvia de estrellas, las Leónidas, que Humboldt describió con cuidado.',escena:['muelle','palmera','aves']},
{nombre:'Casiquiare',pais:'Venezuela',pos:[1.92,-67.06],fecha:'mayo de 1800',rumbo:'Río arriba por el Orinoco, hasta la selva',imagen:'Un casi (Casi-quiare) hecho río: un brazo de agua que casi une dos ríos gigantes, y los une del todo, con mosquitos por millones.',dato:'En 1800 subieron el Orinoco en canoa, pasaron los raudales de Atures y Maipures y llegaron al Casiquiare, un brazo que une el Orinoco con el Amazonas por el río Negro. Humboldt lo midió y confirmó que los dos ríos están conectados, algo de lo que los geógrafos dudaban.',escena:['selva','balsa','cataratas']},
{nombre:'La Habana',pais:'Cuba',pos:[23.13,-82.38],fecha:'diciembre de 1800',rumbo:'Por mar, al norte, a la isla mayor del Caribe',imagen:'Un sabio con habas (Ha-bana) de azúcar mide la ciudad con un sextante y escribe en contra de la esclavitud de las plantaciones.',dato:'Pasaron el invierno de 1800 a 1801 en Cuba. Humboldt fijó la posición de La Habana, estudió las plantaciones de azúcar y escribió después un ensayo sobre la isla que condenaba la esclavitud.',escena:['muelle','castillo','campos']},
{nombre:'Bogotá',pais:'Colombia',pos:[4.71,-74.07],fecha:'julio de 1801',rumbo:'Por mar a Cartagena y río arriba por el Magdalena, hasta la sabana',imagen:'Un botánico con la boca (Bo-gotá) llena de gotas de lluvia sube semanas en canoa un río marrón para ver el herbario más grande del mundo.',dato:'Desembarcaron en Cartagena en marzo de 1801 y subieron el río Magdalena en canoa durante semanas; llegaron a Bogotá en julio para conocer a José Celestino Mutis y su herbario, uno de los más grandes del mundo.',escena:['campos','iglesia','casas']},
{nombre:'Chimborazo',pais:'Ecuador',pos:[-1.47,-78.82],fecha:'junio de 1802',rumbo:'Al sur por los Andes, hasta el volcán más alto que se conocía',imagen:'Un chimpancé con brazos (Chim-brazo) de hielo se detiene ante una grieta a 5 900 m: nadie había subido tan alto con un barómetro.',dato:'El 23 de junio de 1802 Humboldt, Bonpland y Carlos Montúfar subieron el Chimborazo hasta unos 5 900 m, donde una grieta los detuvo; nadie había llegado tan alto midiendo. Entonces se creía que era la montaña más alta del mundo; mide 6 263 m.',escena:['nieve','volcan','garganta']},
{nombre:'Lima',pais:'Perú',pos:[-12.05,-77.04],fecha:'octubre de 1802',rumbo:'Por la sierra y la costa del Pacífico, al sur',imagen:'Una lima (Lima) que tapa el Sol: un puntito, el planeta Mercurio, cruza el disco solar mientras un sabio anota la hora frente a un mar frío.',dato:'Llegaron a Lima en octubre de 1802 por la sierra, pasando por Cajamarca. El 9 de noviembre Humboldt observó desde El Callao el paso de Mercurio delante del Sol, que le sirvió para fijar la longitud de la ciudad, y midió la corriente fría de la costa, que hoy lleva su nombre.',escena:['muelle','iglesia','casas']},
{nombre:'Ciudad de México',pais:'México',pos:[19.43,-99.13],fecha:'abril de 1803',rumbo:'Por mar hasta Acapulco y tierra adentro, a la meseta',imagen:'Un sabio mete la mano en una mina de plata y saca un mapa entero de un país, con volcanes, ciudades y cuentas.',dato:'Desde Acapulco subieron a la capital en abril de 1803. Un año en Nueva España: minas de plata de Guanajuato y Taxco, volcanes, archivos. De ahí salió su «Ensayo político sobre el reino de la Nueva España», con mapas y cifras de todo el país.',escena:['volcan','iglesia','casas']},
{nombre:'Filadelfia',pais:'Estados Unidos',pos:[39.95,-75.17],fecha:'mayo de 1804',rumbo:'Por mar, al norte, hasta el país recién independizado',imagen:'Un presidente (Fila-delfia: en fila, con delfines) hace preguntas sobre México durante días a dos viajeros con baúles de plantas secas.',dato:'En mayo de 1804 llegaron a Filadelfia y de allí fueron a Washington, donde el presidente Jefferson, curioso de ciencia, los recibió durante varios días para preguntarles por México y por sus mapas. En junio zarparon de vuelta a Europa.',escena:['casas','muelle','campos']}],
vehiculo:{nombre:'La expedición de Humboldt y Bonpland',tipo:'canoa',desc:'La corbeta Pizarro para cruzar el Atlántico, canoas en el Orinoco y el Magdalena, mulas en los Andes y barcos de cabotaje por el Pacífico; con ellos, unos cuarenta instrumentos y baúles que se fueron llenando de plantas secas: al final, unas 60 000.',zarpe:'Zarpás de A Coruña con cuarenta instrumentos y un permiso real.',llegada:'Cinco años después, Humboldt vuelve a Europa con baúles de plantas, cuadernos y un mapa nuevo de América.',
puertos:[['En Tenerife subieron al Teide y cargaron vino y agua.','vino y agua'],['En Cumaná bajaron los instrumentos y salieron a medir la costa.','plantas secas y cuadernos'],['En el Casiquiare la canoa iba cargada de plantas, monos y pájaros.','plantas, monos y pájaros'],['En La Habana embalaron colecciones para mandarlas a Europa.','cajas para Europa'],['En Bogotá cambiaron semillas y dibujos con el herbario de Mutis.','semillas y dibujos'],['En el Chimborazo llevaron el barómetro hasta la grieta.','barómetro y sextante'],['En Lima anotaron el paso de Mercurio y guardaron muestras de guano.','guano y cuadernos'],['En México copiaron mapas y cuentas de las minas.','mapas y minerales'],['En Filadelfia cerraron los baúles para volver a Europa.','vendida']]},
companero:{nombre:'Aturia',especie:'la lapa',emoji:'🦜',glifo:'lapa',hola:'¡Soy Aturia, la lapa! Me subí a la canoa en el Orinoco, pero me sé el viaje entero: estos dos anotan hasta el color del cielo.',fin:'Burdeos, cinco años después, con sesenta mil plantas secas en los baúles. Yo vuelvo a la selva; contá vos el viaje.',
paradas:['Un volcán con nieve en una isla con plátanos. Subieron de noche para ver salir el sol. Yo miré desde abajo.','Calor, palmeras y una cueva llena de pájaros gritones. De noche, estrellas que caían a montones.','Mi casa: raudales, selva y mosquitos. Un río que se parte en dos y va a dos mares. Ellos lo midieron.','Una bahía con un castillo y campos de caña hasta el horizonte. Aquí escribieron mucho, y de noche, más.','Semanas río arriba en canoa, y después una sabana fría y alta. Un viejo sabio con miles de plantas secas.','Subieron hasta donde el aire no alcanza. Una grieta los paró. Nadie había subido tan alto. Yo no subí.','Un mar frío y un puntito cruzando el sol. Anotaron la hora exacta. A mí me gustó la niebla.','Minas de plata, volcanes y un año entero de mapas. Contaron hasta las mulas del país.','Un presidente con muchas preguntas y un río ancho. Después, el barco de vuelta. Casi cinco años.']},

eventos:[
{tramo:3,icono:'pez',titulo:'Las anguilas eléctricas',texto:'En los llanos, cerca de Calabozo, en marzo de 1800, Humboldt quiso estudiar las anguilas eléctricas del río. Los pescadores metieron caballos al agua para agotar a las anguilas a fuerza de descargas; Humboldt tocó una y sintió el golpe en todo el cuerpo.',reto:'imagen',bien:'Anotado el experimento, la canoa sigue río arriba.',mal:'La anguila dio otra descarga; repasá la imagen y seguimos.'},
{tramo:6,icono:'piedra',titulo:'La grieta del Chimborazo',texto:'El 23 de junio de 1802, con los pies sangrando y mareados por la altura, Humboldt, Bonpland y Montúfar subieron por la nieve hasta que una grieta de unos veinte metros de ancho les cerró el paso, a unos 5 900 m. Midieron con el barómetro y bajaron.',reto:'ruta',bien:'La grieta queda atrás y la expedición baja a tiempo.',mal:'La niebla tapó el camino; repasá la ruta y bajamos con cuidado.'}]},

vocab:{tuVehiculo:'Tu barco',mercader:'mercader del Endeavour',llegada:r=>`Después de ${r.paradas.length} escalas, ${resumenViaje(r)}, el Endeavour vuelve a Inglaterra.`,vozFin:r=>'Regreso: Inglaterra. Después de nueve escalas y casi tres años, el Endeavour vuelve a Inglaterra.'},
inicio:{nombre:'Plymouth',fecha:'agosto de 1768',nota:'El 26 de agosto de 1768 el Endeavour salió de Plymouth al mando de James Cook, un teniente hijo de campesinos que había aprendido a hacer mapas en las costas de Canadá. La Real Sociedad lo mandaba a Tahití a medir el paso de Venus por delante del Sol; el Almirantazgo, además, a buscar el continente que se creía escondido en el sur.',escena:['faro','muelle','barco']},
fin:{nombre:'Inglaterra, de regreso',en:'Inglaterra',fecha:'julio de 1771',escena:['muelle','casas','barco']},
contexto:[
{clave:'entonces',titulo:'El mar del Sur por dibujar',texto:'En 1768 medio Pacífico era una mancha en blanco. Los astrónomos querían medir desde muchos puntos del mundo el paso de Venus por delante del Sol para calcular la distancia a la estrella; Tahití, recién visitada por un barco inglés, era el punto más lejano. A bordo iban el botánico Joseph Banks con sus ayudantes, el astrónomo Green y, desde Tahití, el navegante Tupaia, que conocía decenas de islas de memoria.',pista:'Un barco pequeño mandado al otro lado del mundo a mirar un planeta pasar por delante del Sol, y de paso a buscar un continente.'},
{clave:'hoy',titulo:'Lo que quedó',texto:'Los mapas de Cook de Nueva Zelanda y de la costa este de Australia eran tan buenos que se usaron más de un siglo. En 1770 tomó posesión de esa costa para el rey de Inglaterra; en 1788 llegaron los primeros colonos y, para los pueblos aborígenes y maoríes, empezó la pérdida de sus tierras. Del paso de Venus salió una distancia al Sol cercana a la de hoy. Los restos del Endeavour estarían, según el museo marítimo de Australia, en el puerto de Newport, en Estados Unidos.',pista:'Mapas que sirvieron un siglo, una toma de posesión que cambió la vida de pueblos enteros y un barco hundido lejos de donde nació.'}],

paradas:[
{nombre:'Madeira',pais:'Portugal',pos:[32.65,-16.91],fecha:'septiembre de 1768',rumbo:'Por mar, al suroeste, hasta una isla de vino',imagen:'Una madera (Madeira) que flota en un mar de vino: barriles y cebollas para tres años, y un capitán que obliga a comer chucrut.',dato:'Primera escala, en septiembre de 1768: cinco días en Funchal para cargar agua, cebollas y miles de litros de vino. Cook obligaba a la tripulación a comer verduras y chucrut contra el escorbuto, la enfermedad que mataba a los marineros en los viajes largos; en tres años casi no perdió a nadie por ella.',escena:['volcan','muelle','barco']},
{nombre:'Río de Janeiro',pais:'Brasil',pos:[-22.91,-43.17],fecha:'noviembre de 1768',rumbo:'Cruzando el Atlántico hacia el sur, hasta Brasil',imagen:'Un río de enero (Río de Janeiro) con un virrey que no cree que ese barco feo sea de la Marina, y un botánico que escapa de noche a recoger flores.',dato:'En noviembre de 1768 el virrey portugués no creyó que un barco tan feo fuera de la Marina inglesa y no dejó bajar a casi nadie; Banks salía a escondidas de noche a recoger plantas. Cargaron comida y agua y siguieron al sur.',escena:['muelle','castillo','palmera']},
{nombre:'Cabo de Hornos',pais:'Chile',pos:[-55.98,-67.27],fecha:'enero de 1769',rumbo:'Al sur, hasta la punta de América, entre tormentas',imagen:'Un cabo hecho de hornos (Hornos) apagados, con nieve en pleno verano y olas que pasan por encima del barco.',dato:'En enero de 1769 rodearon el cabo de Hornos, la punta de América, en pleno verano austral, con tormentas y nieve; en la Tierra del Fuego dos sirvientes de Banks murieron de frío en una noche. Fue una de las vueltas al cabo más rápidas de la época.',escena:['nieve','garganta','barco']},
{nombre:'Tahití',pais:'Polinesia Francesa',pos:[-17.53,-149.57],fecha:'abril de 1769',rumbo:'Al noroeste por el Pacífico, hasta la isla donde se vería pasar Venus',imagen:'Un tahitiano con tambor (Tahi-tí) mira con los ingleses un puntito negro que cruza el Sol, y después se sube al barco como guía.',dato:'Llegaron en abril de 1769 y construyeron un fuerte en la punta que hoy se llama Venus. El 3 de junio midieron el paso del planeta por delante del Sol. Se quedaron tres meses; al partir subió a bordo Tupaia, sacerdote y navegante tahitiano que sabía el rumbo a decenas de islas.',escena:['palmera','casas','barco']},
{nombre:'Nueva Zelanda',pais:'Nueva Zelanda',pos:[-38.66,178.02],fecha:'octubre de 1769',rumbo:'Al suroeste, cruzando el antimeridiano, hasta dos islas grandes',imagen:'Dos islas nuevas (Nueva Zelanda) dibujadas de una sola vuelta, con una piedra verde que corta como cuchillo.',dato:'En octubre de 1769 vieron tierra en la costa de Nueva Zelanda, que ningún europeo había visto desde Tasman en 1642. Cook la rodeó entera en seis meses y dibujó su mapa: dos islas, no un continente. Con los maoríes hubo intercambios y también muertos.',escena:['garganta','selva','casas']},
{nombre:'Botany Bay',pais:'Australia',pos:[-34,151.23],fecha:'abril de 1770',rumbo:'Al oeste, hasta una costa que ningún europeo había dibujado',imagen:'Una bahía botánica (Botany) donde dos sabios llenan sacos de plantas raras mientras los dueños de la playa miran con lanzas.',dato:'El 29 de abril de 1770 desembarcaron en una bahía de la costa este de Australia, que Cook llamó Botany Bay por las plantas que recogieron Banks y Solander. Los gweagal, dueños de la tierra, los recibieron con lanzas; para ellos empezaba una historia muy distinta.',escena:['duna','arbol','aves']},
{nombre:'Río Endeavour',pais:'Australia',pos:[-15.47,145.25],fecha:'junio de 1770',rumbo:'Al norte, por dentro de un arrecife enorme',imagen:'Un barco que se sube a un coral (Endeavour) y lo remienda con una vela: siete semanas en un río, viendo saltar canguros.',dato:'El 11 de junio de 1770 el barco encalló de noche en la Gran Barrera de Coral. Tiraron cañones y lastre al agua, taparon la vía de agua con una vela y llegaron a un río donde lo repararon durante siete semanas; allí vieron por primera vez canguros.',escena:['selva','barco','arbol']},

function ico(k,cls){if(!k)return '';if(k.startsWith('animal:'))return animal({glifo:k.slice(7)},'ico-animal');if(k.startsWith('barca:'))return `<svg class="barca ico-barca" viewBox="-15 -15 30 20" aria-hidden="true">${glifo(k.slice(6))}</svg>`;
return `<svg class="ico${cls?' '+cls:''}" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[k]||''}</svg>`}

case 'canoa':return '<path class="casco" d="M-13.5 -1.6 Q-9 -3.6 0 -3.6 Q9 -3.6 13.5 -1.6 Q9 2 0 2.6 Q-9 2 -13.5 -1.6 Z"/><path class="linea" d="M-11 -0.6 Q0 0.6 11 -0.6" stroke-width=".6"/><circle class="fig" cx="4" cy="-6.6" r="1.7"/><path class="palo" d="M4 -4.9 v1.6" stroke-width="1.2"/><path class="palo" d="M0.8 -9.6 L7.4 0" stroke-width=".9"/><path class="casco" d="M6.4 -1.6 L8.8 0.6 L7 1.4 Z"/>';
case 'caravana':return '<path class="casco" d="M-9 0 Q-10 -6 -4 -7 Q0 -11 4 -7 Q8 -7 8 -2 L8 0 Z"/><path class="casco" d="M8 -2 L10 -10 L13 -11 L14 -9 L11 -8 L10 0 Z"/><path class="palo" d="M-7 0 L-7 4 M-3 0 L-3 4 M2 0 L2 4 M6 0 L6 4" stroke-width="1.2"/><path class="vela" d="M-5.4 -10.4 L1.4 -10.4 L2.4 -7 L-6.4 -7 Z"/><path class="linea" d="M-2 -10.4 L-2 -7" stroke-width=".6"/><path class="palo" d="M-9 -1 L-12 3" stroke-width=".8"/>';
case 'jinete':return '<path class="casco" d="M-10 0 Q-11 -5.4 -5 -6.4 L3 -6.4 Q8.4 -6.4 8.8 -2 L8.8 0 Z"/><path class="casco" d="M7.4 -4 L9.8 -10.6 L13 -11.6 L14.4 -9.6 L11.6 -8 L10.6 -1 Z"/><path class="palo" d="M-7 0 L-8 4 M-4 0 L-3 4 M2 0 L1 4 M6 0 L7 4" stroke-width="1.2"/><path class="palo" d="M-10 -1 L-13 3" stroke-width=".8"/><path class="vela" d="M-3.4 -10 h4.4 v3.8 h-4.4 Z"/><circle class="fig" cx="-1.2" cy="-12.2" r="1.9"/><path class="palo" d="M1 -9.4 L4.4 -7.4" stroke-width="1.2"/><path class="palo" d="M4.4 -15 v9" stroke-width=".9"/>';

let animB=null;
function animarBarca(poly,t0,t1,px,tierra){const g=document.getElementById('barca'),m=document.getElementById('masc');if(!g)return;if(animB)cancelAnimationFrame(animB);
const poner=p=>{let ang=p.ang,sx=1;if(Math.cos(ang*Math.PI/180)<0){ang=ang-180;sx=-1}g.setAttribute('transform',`translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${ang.toFixed(1)}) scale(${sx} 1)`);if(m)m.setAttribute('transform',`rotate(${(-ang*sx).toFixed(1)}) scale(${px.toFixed(4)})`)}/* derecho y mirando hacia adelante: se anula el giro, no el espejo */;
if(poly.length<2){poner({x:poly[0][0],y:poly[0][1],ang:0});return}
const L=[0];for(let i=1;i<poly.length;i++)L[i]=L[i-1]+Math.hypot(poly[i][0]-poly[i-1][0],poly[i][1]-poly[i-1][1]);const tot=L[L.length-1]||1;
const pos=t=>{const s=t*tot;let i=1;while(i<L.length-1&&L[i]<s)i++;const a=poly[i-1],b=poly[i],u=(L[i]-L[i-1])?(s-L[i-1])/(L[i]-L[i-1]):0;return{x:a[0]+(b[0]-a[0])*u,y:a[1]+(b[1]-a[1])*u,ang:Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI,i}};
const estela=document.getElementById('estela'),capa=document.getElementById('capa');
const dibujarEstela=p=>{if(!estela)return;const pts=t1>=t0?poly.slice(0,p.i).concat([[p.x,p.y]]):[[p.x,p.y]].concat(poly.slice(p.i));estela.setAttribute('d','M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L'))};
const salpicar=p=>{if(!capa||!capa.insertAdjacentHTML)return;capa.insertAdjacentHTML('beforeend',`<g class="salpicon${tierra?' polvo':''}" transform="translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) scale(${px.toFixed(4)})"><g class="sal"><circle r="4"/><circle cx="-5" cy="-2" r="1.5"/><circle cx="5" cy="-2" r="1.5"/><circle cy="-5" r="1.2"/></g></g>`);setTimeout(()=>{const s=capa.querySelector('.salpicon');if(s)s.remove()},1000)};
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(t0===t1||reduce){poner(pos(t1));S.olas=false;return}
const T=performance.now(),dur=1400;
const step=now=>{let k=Math.max(0,Math.min(1,(now-T)/dur));k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;const p=pos(t0+(t1-t0)*k);poner(p);dibujarEstela(p);if(k<1)animB=requestAnimationFrame(step);else{animB=null;if(estela)estela.setAttribute('class','estela fin');salpicar(p);if(S.olas){S.olas=false;olear()}}};
animB=requestAnimationFrame(step)}
function olear(){const o=document.getElementById('olas');if(!o||!o.classList)return;o.classList.remove('va');void o.offsetWidth;o.classList.add('va')}
(function init(){cargarPerfiles();if(voz.soporte())window.speechSynthesis.getVoices();render(true)})();
window.addEventListener('resize',()=>{acomodarPie();if(S.foco)renderMapa(S.foco,true);const pf=document.getElementById('perfil');if(pf&&!pf.hidden&&S.pantalla==='rio')pf.innerHTML=perfilSVG(rioPor(S.rio))});
function plegarMapa(){const a=document.getElementById('arriba');a.classList.toggle('compacto');const b=document.querySelector('.plegar');b.textContent=a.classList.contains('compacto')?'▴':'▾';
if(S.foco)renderMapa(S.foco,!a.classList.contains('compacto'))/* al plegar, la caja se anima (el alto del CSS va más rápido y manda); al desplegar salta ya, y el mapa solo destapa */}
