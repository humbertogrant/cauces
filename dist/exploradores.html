<style>

.olas{position:absolute;left:0;right:0;bottom:-70%;height:70%;pointer-events:none;opacity:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='20' viewBox='0 0 40 20'><g fill='%230C3A33' stroke='%23E8B952' stroke-opacity='.9' stroke-width='1'><circle cx='20' cy='0' r='19'/><circle cx='20' cy='0' r='13' fill='none'/><circle cx='20' cy='0' r='7' fill='none'/><circle cx='0' cy='10' r='19'/><circle cx='0' cy='10' r='13' fill='none'/><circle cx='0' cy='10' r='7' fill='none'/><circle cx='40' cy='10' r='19'/><circle cx='40' cy='10' r='13' fill='none'/><circle cx='40' cy='10' r='7' fill='none'/><circle cx='20' cy='20' r='19'/><circle cx='20' cy='20' r='13' fill='none'/><circle cx='20' cy='20' r='7' fill='none'/><circle cx='0' cy='30' r='19'/><circle cx='0' cy='30' r='13' fill='none'/><circle cx='0' cy='30' r='7' fill='none'/><circle cx='40' cy='30' r='19'/><circle cx='40' cy='30' r='13' fill='none'/><circle cx='40' cy='30' r='7' fill='none'/></g></svg>") 0 0/40px 20px;-webkit-mask-image:linear-gradient(0deg,transparent,#000 40%,#000 60%,transparent);mask-image:linear-gradient(0deg,transparent,#000 40%,#000 60%,transparent)}
.olas.va{animation:barrida 2.4s ease-in-out 1}
@keyframes barrida{0%{opacity:0;transform:translateY(0)}20%{opacity:.95}75%{opacity:.95}100%{opacity:0;transform:translateY(-240%)}}
#mapa[data-mar="vivo"]{animation:marea 120s linear infinite,mar 4s ease-in-out infinite}
@keyframes deriva{to{background-position:420px 0}}

@keyframes mar{0%,100%{background-position-y:0}50%{background-position-y:-7px}}

.ajustes summary{font:600 16px var(--cuerpo);color:var(--verde)}

.mundo{position:absolute;left:8px;top:8px;z-index:1;border:1.5px solid var(--verde-claro);background:rgba(12,58,51,.75);color:#fff;font:600 14px var(--cuerpo);padding:6px 12px;border-radius:999px;cursor:pointer}

p{margin:0 0 14px}
.imagen{padding:0 0 8px;font-size:1.06em;line-height:1.4}
.frase{background:var(--ficha);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.fkicker{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris2);margin-bottom:6px}
.ftexto{font-size:22px;font-weight:600;color:var(--verde);line-height:1.25}
.ftexto b,.op b{font-weight:700;color:var(--oro-tinta)}
.fnota{font-size:14px;color:var(--gris2);margin-top:4px}
.flista{font-size:15px;color:var(--gris2);margin-top:6px}
.btn{font:600 17px var(--cuerpo);background:var(--verde);color:#fff;border:1px solid var(--verde);border-radius:10px;padding:12px 18px;min-height:46px;cursor:pointer}
.btn.sec{background:var(--ficha);color:var(--verde);border-color:var(--linea)}
.btn:focus-visible,.son:focus-visible,.op:focus-visible,.chip:focus-visible,.fila:focus-visible,.tabs button:focus-visible,.volver:focus-visible{outline:3px solid var(--verde-claro);outline-offset:2px}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.enlace{background:none;border:0;padding:0;color:var(--verde-medio);font:600 15px var(--cuerpo);text-decoration:underline;cursor:pointer;margin-bottom:8px}
.campo{flex:1;min-width:0;font:400 17px var(--cuerpo);color:var(--gris);padding:10px 12px;border:1px solid var(--linea);border-radius:10px;background:var(--ficha)}
.campo:focus-visible{outline:3px solid var(--verde-claro);outline-offset:2px}
.perfiles{margin-bottom:14px}
.progreso{border-top:1px solid var(--grid);margin-top:8px;padding-top:12px}
.progreso .enlace{margin:-4px 0;padding:8px 0;font-size:14px}
label.enlace{cursor:pointer}
.tabs{display:flex;border:1px solid var(--linea);border-radius:10px;background:var(--ficha);overflow:hidden;margin-bottom:16px}
.tabs button{flex:1;border:0;background:var(--ficha);color:var(--verde);font:600 15px var(--cuerpo);padding:10px 4px;cursor:pointer}
.tabs button.on{background:var(--verde);color:#fff}
.fmeta{display:block;font-size:14px;color:var(--gris2);margin:2px 0 6px}
.barra{display:block;height:4px;background:var(--grid)}
.barra i{display:block;height:100%;background:var(--verde-claro)}
.aviso{background:var(--ficha);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.secuencia{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.extremo{font:600 12px var(--cuerpo);letter-spacing:.06em;text-transform:uppercase;color:var(--gris2)}
.puesto{background:var(--verde);color:#fff;padding:6px 10px;border-radius:999px;font-size:15px;font-weight:600}
.hueco{color:var(--gris3);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--papel);border:1px solid var(--linea);color:var(--verde);padding:10px 16px;min-height:44px;border-radius:22px;font:600 16px var(--cuerpo);cursor:pointer;text-align:left}
.chip.mal{border-color:var(--teja);color:var(--teja);background:var(--teja-fondo);animation:sacudir .4s}
@keyframes sacudir{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.chip.mal{animation:none}}
.pista{margin-bottom:12px}
.pregunta{font-size:22px;font-weight:600;line-height:1.3;color:var(--verde)}
.opciones{display:flex;flex-direction:column;gap:8px;margin:12px 0 14px}
.op{text-align:left;background:var(--papel);border:1px solid var(--linea);color:var(--gris);padding:12px 14px;border-radius:10px;font:400 1em var(--cuerpo);line-height:1.3;cursor:pointer}
.op.bien{background:var(--verde);color:#fff}
.op.bien b{color:var(--verde-claro)}
.op.mal{background:var(--teja-fondo);border-color:var(--teja);color:var(--teja)}
.op.apagada{opacity:.45}
.nota{background:var(--ficha);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;padding:12px 16px;margin-bottom:12px}
.nota.no{border-color:var(--teja)}
.resultado h2{font-size:44px}
#pie{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--ficha);border-top:1px solid var(--linea);box-shadow:0 -8px 24px rgba(15,66,58,.08);padding:6px 16px calc(6px + env(safe-area-inset-bottom))}
#pie .dentro{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.acto{display:flex;flex-direction:column;gap:6px}
.acto .chip{min-height:38px;padding:7px 14px;font-size:15px}
.botones .enlace{padding:12px 8px;margin:0 -8px}
.botones{display:flex;align-items:center;justify-content:space-between;gap:10px}
.botones .fkicker{margin:0}
.botones .btn{padding:9px 16px;min-height:42px;font-size:16px}
.acto .guia,.acto .chips{margin:0}
.riel{display:grid;grid-template-columns:repeat(4,1fr);position:relative;padding-top:6px}
.acto+.riel{border-top:1px solid var(--linea);padding-top:10px}
.riel:before{content:"";position:absolute;left:12.5%;right:12.5%;top:calc(6px + 9px);height:2px;background:var(--linea)}
.acto+.riel:before{top:calc(10px + 9px)}
.paso{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 14px var(--cuerpo);color:var(--gris2);cursor:pointer;min-height:44px}
.paso i{width:20px;height:20px;border-radius:50%;border:2px solid var(--linea);background:var(--ficha);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;line-height:1}
.paso.hecho i{background:var(--verde);border-color:var(--verde)}
.paso.aqui i{background:var(--dorado);border-color:var(--dorado);box-shadow:0 0 0 4px rgba(232,185,82,.28);color:var(--verde)}
.paso.aqui{color:var(--verde)}
.num{font-family:var(--tit);font-weight:500;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kicker .num{font-size:15px}
.bolsa .num,.tesoro .num{font-size:1.1em}
@media (max-width:759px){body.con-pie #arriba:not(.compacto) #mapa{height:28vh;min-height:190px}}
.grupo{margin:0 0 18px}
.grupo h3{margin:18px 0 6px;font-size:20px}
.fkicker .cuenta{margin-left:6px;color:var(--gris3);letter-spacing:0;font-weight:400}
.cuadricula{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
@media (min-width:560px){.cuadricula{grid-template-columns:repeat(4,1fr)}}
@media (min-width:760px){.cuadricula{grid-template-columns:repeat(5,1fr)}}
.tarjeta{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--ficha);border:1px solid var(--linea);border-radius:12px;padding:10px 10px 8px;cursor:pointer;font-family:var(--cuerpo);color:var(--gris);min-width:0}
.tarjeta .emo{width:30px;height:30px;margin-bottom:3px}
.tarjeta .emo svg{width:30px;height:30px;display:block}
.tarjeta .tn{font:500 17px/1.1 var(--tit);color:var(--verde);max-width:100%;overflow-wrap:anywhere}
.tarjeta .tm{font-size:12px;color:var(--gris2)}
.tarjeta .tm .num{font-size:13px}
.tarjeta .listo{color:var(--verde);font-weight:700}
.tarjeta .barra{width:100%;height:3px;margin-top:7px;border-radius:2px;overflow:hidden}
.comparar .cmp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;margin:8px 0 0;padding:0;background:none;border:0;text-align:left;cursor:pointer;font-family:var(--cuerpo)}
.comparar .cn{font:500 17px var(--tit);color:var(--verde)}
.comparar .cm{font-size:13px;color:var(--gris2)}
.comparar .barra{grid-column:1/3;height:3px;border-radius:2px;overflow:hidden}
.comparar .fnota{margin-top:10px}
.quien{padding:12px 16px}
.quien .fkicker{margin-bottom:8px}
.quien .chips{margin-bottom:0}
.quien .acciones{margin:10px 0 0}
@media (min-width:760px){#mapa{height:46vh}h2{font-size:38px}#cab h1{font-size:32px}}
@media (max-width:480px){#mapa{height:34vh}}
@media (max-height:520px){#arriba{position:static}}
</style>

{nombre:'El Cairo',pais:'Egipto',pos:[30.05,31.24],fecha:'1326',rumbo:'Por tierra, a lo largo del norte de África, hasta el Nilo',imagen:'Un caimán con turbante (Cai-ro) dirige el tráfico de camellos frente a las pirámides: en El Cairo se cruzaban todos los caminos del mundo que él conocía.',dato:'Con los sultanes mamelucos, El Cairo era la ciudad más grande del mundo islámico; Ibn Battuta la llama «madre de ciudades». Llegó en 1326, en su primer año de viaje, y desde aquí siguió a Damasco y a La Meca.',escena:['piramide','mezquita','camello']},
{nombre:'La Meca',pais:'Arabia Saudita',pos:[21.42,39.83],fecha:'1326',rumbo:'Al sur, por el desierto de Arabia, en la caravana de peregrinos',imagen:'Una bola de mecate gigante (Meca-te) rueda alrededor de una casa negra cuadrada, y miles de peregrinos vestidos de blanco dan vueltas con ella.',dato:'Aquí hizo su primer hach, la peregrinación, en 1326: era el motivo del viaje. Volvió a La Meca varias veces y vivió en ella cerca de tres años entre viaje y viaje.',escena:['mezquita','duna','camello']},
{nombre:'Bagdad',pais:'Irak',pos:[33.34,44.4],fecha:'1327',rumbo:'Al noreste, hacia los ríos de Irak',imagen:'Un bagre le regala a su papá (Bag-dad) un mapa de una ciudad medio en ruinas: Bagdad ya no era la capital de antes.',dato:'Setenta años antes, en 1258, los mongoles habían arrasado Bagdad. Ibn Battuta la encontró venida a menos, bajo el ilján Abu Said, y viajó un tramo con la corte del propio ilján, que se movía como un campamento.',escena:['mezquita','casas','mercado']},
{nombre:'Kilwa',pais:'Tanzania',pos:[-8.96,39.51],fecha:'1331',rumbo:'Por mar, costa abajo de África oriental',imagen:'En una isla, un pescador pesa un kilo de oro en una balanza de coral (Kil-wa): por aquí salía el oro que llegaba de tierra adentro.',dato:'Ciudad suajili en una isla de la costa de Tanzania, en su tiempo el gran puerto del oro que venía del sur. Ibn Battuta escribió que era una de las ciudades más bellas y mejor construidas del mundo; hoy sus ruinas, con la mezquita de coral, son Patrimonio de la Humanidad.',escena:['barco','mezquita','palmera']},
{nombre:'Constantinopla',pais:'Turquía',pos:[41.01,28.98],fecha:'hacia 1332',rumbo:'Al norte, por Anatolia y el mar Negro, con una princesa',imagen:'Una princesa lo lleva de la mano por una ciudad de cúpulas y murallas, y él va contando campanas: era la primera gran ciudad cristiana que veía.',dato:'Llegó desde la estepa, en la comitiva de Bayalun, una princesa bizantina casada con el kan de la Horda de Oro, que volvía a visitar a su padre. Describe Santa Sofía desde afuera: cuenta que no entró.',escena:['castillo','iglesia','barco']},
{nombre:'Delhi',pais:'India',pos:[28.65,77.23],fecha:'1334',rumbo:'Al este, por Asia Central y las montañas, hasta la India',imagen:'Un sultán que reparte oro con una mano y castigos con la otra le da un trabajo de juez: en Delhi se quedó casi ocho años, más que en ningún otro lugar.',dato:'El sultán Muhammad ibn Tughluq lo nombró cadí, es decir juez, y en 1341 lo mandó como embajador a China. En el relato lo describe como el hombre más generoso y más cruel que conoció.',escena:['mezquita','castillo','mercado']},
{nombre:'Malé',pais:'Maldivas',pos:[4.18,73.51],fecha:'1344',rumbo:'Por mar, a unas islas pequeñas al sur de la India',imagen:'Un juez sentado en una isla tan chiquita que mete los pies en el mar cobra su sueldo en conchitas: en las Maldivas la moneda eran caracoles cauri.',dato:'Fue cadí en las islas cerca de un año, entre 1343 y 1344, y se casó allí. Las conchas cauri de las Maldivas se usaron como moneda hasta África occidental, donde él las volvería a ver.',escena:['palmera','barco','aves']},
{nombre:'Quanzhou',pais:'China',pos:[24.87,118.68],fecha:'hacia 1346',rumbo:'Por mar, con los monzones, hasta China',imagen:'Un puerto donde los barcos son tan grandes que llevan huertas de verduras a bordo; él lo cuenta así, aunque no todos le creen.',dato:'Los árabes la llamaban Zaitún: era el gran puerto de China bajo la dinastía Yuan, y describe sus juncos con cientos de tripulantes. Su viaje por China es el tramo del que más dudan los historiadores; el relato lo cuenta como propio.',escena:['pagoda','barco','muelle']},
{nombre:'Tombuctú',pais:'Malí',pos:[16.77,-3.01],fecha:'1353',rumbo:'A través del Sáhara, en caravana, hasta el Níger',imagen:'Una tumba con un bucle de oro (Tom-buc-tú) en medio de la arena: cruzó el Sahara con una caravana de sal para llegar al imperio del oro.',dato:'Cruzó el desierto desde Siyilmasa pasando por las minas de sal de Tagaza; en Malí lo recibió el mansa Sulaymán, sucesor de Mansa Musa, y siguió por el Níger hasta Tombuctú y Gao. Volvió a Fez en 1354 y en 1355 dictó su relato, la Rihla.',escena:['duna','mezquita','camello']}],
vehiculo:{nombre:'La caravana del hach',tipo:'caravana',desc:'Dromedarios cargados en fila, guías que conocen los pozos y una tropa de peregrinos y mercaderes. Ibn Battuta viajó casi siempre pegado a una caravana; por mar, en dhows árabes y juncos chinos.',zarpe:'Salís con la caravana de peregrinos; el camino a La Meca es de todos.',llegada:'Veintinueve años y unos 120 000 km después, la caravana entra en Fez. Ahí, en 1355, dicta la Rihla.',
puertos:[['En El Cairo se unió a una caravana hacia Damasco y La Meca; llevaba lo que un estudiante de leyes carga: libros y cartas de presentación.','libros y cartas'],
['En La Meca hizo el hach y decidió no volver a casa: seguir viajando por todo el mundo del islam.','incienso y agua de Zamzam'],
['En Bagdad se unió a la caravana del ilján Abu Said, que se movía como una ciudad con tiendas y mercados.','telas y dátiles'],
['En Kilwa vio salir el oro del interior; los sultanes suajilis regalaban ropa y comida a los viajeros letrados.','marfil y ámbar gris'],
['En Constantinopla lo recibieron con honores por venir con la princesa; salió con regalos del emperador.','pieles y monedas de plata'],
['En Delhi cobró sueldo de juez durante años y salió con regalos para el emperador de China, que se hundieron en el mar.','caballos y telas de regalo'],
['En Malé cobraba en cauris, que valían plata en la India y en Malí.','cauris'],
['En Quanzhou vio cargar seda y porcelana en juncos enormes, con huertas a bordo, según cuenta.','seda y porcelana'],
['En Tombuctú cambió lo que traía y volvió a Fez con la caravana de la sal.','vendida']]},
companero:{nombre:'Zahra',especie:'la dromedaria',emoji:'🐪',glifo:'dromedario',hola:'Soy Zahra, la dromedaria. Aguanto días sin beber y me sé todos los pozos. Subite, que el camino es largo.',fin:'Fez. Casi treinta años dando vueltas. Yo me quedo en el establo; vos contá el viaje.',
paradas:['¡Cuánta gente! Aquí las calles huelen a pan y a camello. Cuidado con los carros.','Aquí todos caminan en círculo alrededor de la casa negra. Yo espero afuera, que soy grande.','Esta ciudad tuvo días mejores. Mirá las paredes rotas: los mongoles pasaron hace setenta años.','¡Una isla! Yo no nado, pero el oro que sale de aquí brilla desde lejos.','Campanas y cúpulas. Aquí las mezquitas son iglesias. La princesa nos abre las puertas.','Un sultán que da oro y castigos. Vos portate bien y te da un trabajo de juez.','Islas chiquitas y conchitas que valen como monedas. Yo prefiero los dátiles.','Barcos con huertas adentro. Si no lo cuento yo, no me lo creen.','Arena, sal y oro. Cruzamos el desierto entero: de aquí a casa ya es bajada.']},

eventos:[
{tramo:7,icono:'ola',titulo:'El naufragio',texto:'Cerca de Calicut, en 1341, los barcos que llevaban los regalos del sultán de Delhi para el emperador de China se hunden en una tormenta. Ibn Battuta estaba en tierra, rezando el viernes, y lo pierde todo menos la alfombra de rezo y unos dinares.',reto:'ruta',bien:'Sin barcos y sin regalos, pero con el camino en la cabeza.',mal:'El mar se llevó los regalos; el camino lo recordás la próxima.'},
{tramo:9,icono:'vela',titulo:'La peste negra',texto:'De regreso, en 1348, la peste negra recorre Siria y Egipto. En Damasco y en El Cairo, cuenta el relato, morían miles de personas por día; él siguió su camino hacia La Meca y hacia casa.',reto:'frase',bien:'La frase te saca del pueblo enfermo: seguimos.',mal:'Con la peste no se juega: repasá la frase y seguimos.'}]},

inicio:{nombre:'Venecia',fecha:'1271',nota:'Salió de Venecia en 1271, a los 17 años, con su padre Niccolò y su tío Maffeo, mercaderes que ya habían estado en la corte de Kublai Kan. Tardó 24 años en volver; el libro de sus viajes, dictado en una cárcel de Génova en 1298, fue durante siglos la descripción de Asia más leída en Europa.',escena:['muelle','barco','casas']},
fin:{nombre:'Venecia, de regreso',en:'Venecia',fecha:'1295',escena:['muelle','casas','mercado']},
contexto:[
{clave:'entonces',titulo:'El mundo que vio',texto:'Los mongoles dominaban desde Persia hasta China y mantenían los caminos abiertos y vigilados: por eso tres mercaderes venecianos pudieron cruzar Asia entera. Kublai Kan, nieto de Gengis Kan, gobernaba China desde una capital nueva y recibía extranjeros en su corte; Marco dice que lo tuvo diecisiete años a su servicio.',pista:'Unos caminos vigilados por un solo imperio que iba de Persia a China, y un emperador curioso de extranjeros.'},
{clave:'hoy',titulo:'Lo que queda',texto:'Su libro, el Libro de las maravillas, lo leyó Colón, que lo anotó a mano. Las ruinas de Shangdu, la capital de verano de Kublai, son Patrimonio de la Humanidad desde 2012. Algunos historiadores dudan de que llegara a China, porque no menciona la muralla ni el té; la mayoría cree que sí estuvo.',pista:'Un libro tan famoso que un navegante lo llevó anotado siglos después, y una ciudad de verano en ruinas.'}],

paradas:[
{nombre:'Acre',pais:'Israel',pos:[32.93,35.08],fecha:'1271',rumbo:'Por mar, a Tierra Santa',imagen:'Un acordeón (A-cre) de murallas junto al mar: en Acre, el último puerto de los cruzados, los Polo recogieron cartas del papa nuevo y aceite de la lámpara del Santo Sepulcro para llevarle a Kublai.',dato:'Acre era en 1271 la capital de lo que quedaba de los Estados cruzados; cayó en 1291. De aquí salieron los tres Polo hacia Asia con el encargo del papa Gregorio X, que acababa de ser elegido.',escena:['castillo','muelle','barco']},
{nombre:'Ormuz',pais:'Irán',pos:[27.15,57.08],fecha:'1272',rumbo:'Por tierra, atravesando Persia hasta el golfo',imagen:'Un barco cosido con hilo de coco (Or-muz) que hace agua: al ver esas naves los Polo prefirieron seguir por tierra.',dato:'En Ormuz, el gran puerto del golfo Pérsico, Marco describe barcos cosidos con fibra de coco, sin clavos, y decidió con su padre y su tío no embarcarse: cruzaron Asia por tierra. Volvió a pasar por aquí en 1294, de regreso.',escena:['muelle','barco','palmera']},
{nombre:'Kashgar',pais:'China',pos:[39.47,75.99],fecha:'hacia 1274',rumbo:'Al norte y al este, por las montañas del Pamir',imagen:'Un cachorro (Kash-gar) vende algodón en un oasis entre dos desiertos: Kashgar era la puerta de China para las caravanas.',dato:'Oasis en el extremo oeste de China, donde se juntan los caminos que rodean el desierto de Taklamakán. Marco lo describe con jardines, viñas y mucho algodón; después cruzó el desierto de Lop, donde, cuenta, se oyen voces que llaman a los viajeros.',escena:['duna','mercado','camello']},
{nombre:'Shangdu',pais:'China',pos:[42.36,116.18],fecha:'1275',rumbo:'Por el desierto, hasta el palacio de verano del Gran Kan',imagen:'Un palacio de cañas doradas que se desarma cada verano: en Shangdu, Xanadú, los Polo se arrodillaron por fin delante de Kublai Kan.',dato:'Capital de verano de Kublai, al norte de la Gran Muralla; aquí llegaron en 1275, tres años y medio después de salir de Venecia. Su descripción del palacio inspiró siglos después el poema «Kubla Khan» de Coleridge. Las ruinas son Patrimonio de la Humanidad.',escena:['castillo','campos','vaca']},
{nombre:'Pekín',pais:'China',pos:[39.9,116.4],fecha:'1275',rumbo:'Al sur, a la capital del Gran Kan',imagen:'Un pequinés con corona reparte billetes de papel (Pe-kín): Marco no podía creer que en China el dinero fuera de papel.',dato:'Kublai la llamaba Dadu o Khanbaliq, «la ciudad del kan», y la estaba construyendo cuando Marco llegó. Marco cuenta el papel moneda, el correo de postas con caballos de relevo y las calles rectas; dice que sirvió al kan diecisiete años.',escena:['pagoda','castillo','mercado']},
{nombre:'Hangzhou',pais:'China',pos:[30.25,120.17],fecha:'hacia 1285',rumbo:'Al sur, por la China de los ríos y los canales',imagen:'Una ciudad con tantos puentes que un hongo (Hang-zhou) los cuenta y se cansa: Marco dijo que era la ciudad más espléndida del mundo.',dato:'Marco la llama Quinsai y la describe como «la ciudad más noble y espléndida del mundo», con un lago, canales y miles de puentes; la cifra que da, doce mil, es de las que los historiadores toman con cuidado. Había sido la capital de la dinastía Song hasta 1276.',escena:['puente','lago','pagoda']},
{nombre:'Sumatra',pais:'Indonesia',pos:[5.1,97.2],fecha:'1292',rumbo:'Por mar, rumbo al sur, con una princesa para Persia',imagen:'Un rinoceronte al que llama unicornio, feo y con la cabeza gacha, lo mira mientras espera cinco meses a que cambie el viento.',dato:'De regreso por mar, escoltando a una princesa mongola hacia Persia, la flota esperó cinco meses en el norte de Sumatra a que soplara el monzón. Marco describe rinocerontes, que toma por unicornios, y gente que come sagú.',escena:['selva','palmera','barco']},
{nombre:'Ceilán',pais:'Sri Lanka',pos:[7.0,80.5],fecha:'1293',rumbo:'Por mar, cruzando el golfo de Bengala',imagen:'Un rey que no vende su rubí del tamaño de un puño, ni por una ciudad entera: Marco lo cuenta con envidia.',dato:'Marco describe la isla, el rubí gigante del rey que Kublai quiso comprar y la montaña donde, según unos, está la tumba de Adán y, según otros, la huella de Buda: el pico de Adán, que Ibn Battuta subiría cincuenta años después.',escena:['montaña','palmera','barco']},
{nombre:'Trebisonda',pais:'Turquía',pos:[41.0,39.72],fecha:'1295',rumbo:'Por mar y por tierra, de vuelta hacia el mar Negro',imagen:'Tres bisontes (Tre-bisonda) les roban buena parte de la fortuna en el último puerto antes de casa.',dato:'Puerto griego del mar Negro donde los Polo, ya de vuelta, perdieron buena parte de lo que traían: un documento de la familia habla de la pérdida. De aquí siguieron a Constantinopla y a Venecia, adonde llegaron en 1295 y, cuenta la leyenda, nadie los reconoció.',escena:['muelle','castillo','montaña']}],
vehiculo:{nombre:'La caravana de los Polo',tipo:'caravana',desc:'Caballos y camellos por Persia, camellos de dos jorobas por los desiertos de Asia central, y juncos chinos para la vuelta por mar. Tres mercaderes con sirvientes, unidos a las caravanas que encontraban.',zarpe:'Salís de Venecia con tu padre y tu tío; el kan los espera al otro lado del mundo.',llegada:'Veinticuatro años después, tres hombres con ropa de tártaro tocan a la puerta de su casa en Venecia.',
puertos:[['En Acre recogieron cartas del papa y el aceite santo que Kublai había pedido.','cartas y aceite santo'],['En Ormuz vieron los barcos cosidos y prefirieron el camino de tierra.','perlas del Golfo'],['En Kashgar se unieron a una caravana de algodón hacia el este.','algodón y jade'],['En Shangdu entregaron los regalos y el aceite al gran kan.','regalos del papa'],['En Pekín Marco entró al servicio del kan; cuenta que lo mandaba de misión por todo el imperio.','papel moneda y sal'],['En Hangzhou anotó puentes, mercados y la sal que el kan cobraba.','seda y porcelana'],['En Sumatra esperaron el monzón cinco meses con la princesa Kököchin.','pimienta y alcanfor'],['En Ceilán vio el rubí del rey y compró piedras, según su relato.','rubíes y zafiros'],['En Trebisonda les quitaron parte de lo que traían; siguieron a casa con lo que quedó.','vendida']]},
companero:{nombre:'Tarim',especie:'el camello bactriano',emoji:'🐫',glifo:'camello',hola:'Soy Tarim, camello de dos jorobas. Aguanto el frío del Pamir y la arena de Lop. Subite, que vamos hasta China.',fin:'Venecia. Mucha agua para un camello. Vos contá el viaje; yo me quedo con las dos jorobas llenas de historias.',
paradas:['Murallas y barcos. Aquí el papa manda cartas y aceite para un kan que nunca ha visto.','¿Viste esos barcos cosidos con hilo? Yo no me subo. Seguimos por tierra.','¡Algodón, uvas y sombra! Después viene el desierto, y en el desierto se oyen voces. No las sigás.','Un palacio de cañas doradas y el kan sentado en el medio. Arrodillate, que yo ya me arrodillé.','Dinero de papel. Yo cargo sal, que pesa; ellos cargan papelitos. Qué país.','Puentes, puentes y más puentes. Marco dice que doce mil; yo dejé de contar en cien.','Cinco meses esperando el viento. Yo aprendí a comer sagú. Marco vio un unicornio muy feo.','Un rubí del tamaño de mi pezuña, y el rey no lo vende. Yo tampoco vendería mis jorobas.','Nos robaron en el último puerto. Da rabia, pero ya casi llegamos a casa.']},

{tramo:4,icono:'niebla',titulo:'Las voces del desierto',texto:'Cruzando el desierto de Lop, Marco cuenta que de noche se oyen voces que llaman al viajero por su nombre y lo apartan del camino: hay que atarse a la caravana y no responder.',reto:'frase',bien:'Con la frase en la cabeza nadie te saca del camino.',mal:'Las voces te apartaron; volvé a la frase y seguimos.'},
{tramo:7,icono:'viento',titulo:'El monzón',texto:'La flota que lleva a la princesa Kököchin a Persia tiene que esperar cinco meses en Sumatra a que el viento cambie de dirección: en el océano Índico se navega con el monzón, no contra él.',reto:'pais',bien:'Cambió el viento: zarpamos.',mal:'Todavía no sopla; repasá y esperamos con la flota.'}]},

{clave:'entonces',titulo:'El mundo que vio',texto:'El Imperio persa era el más grande que había existido: de Egipto a la India, con caminos reales, sátrapas y tesoros enormes. Las ciudades griegas de la costa de Asia estaban bajo su mando. Alejandro entró con un ejército chico pero muy entrenado, la falange de su padre Filipo, y en tres batallas grandes se quedó con todo.',pista:'El imperio más grande que había existido, con caminos reales y tesoros, cayó en tres batallas ante un ejército mucho más chico.'},
{clave:'hoy',titulo:'Lo que queda',texto:'Después de él, el griego se habló de Egipto a la India durante siglos, y las ciudades que fundó siguen ahí: Alejandría es la primera. En Pakistán y Afganistán aparecen estatuas de Buda con pliegues griegos. Lo que sabemos de su viaje viene de historiadores que escribieron cientos de años después, así que muchos detalles se discuten.',pista:'Una lengua hablada desde el Nilo hasta el Indo durante siglos y una ciudad fundada por él que todavía lleva su nombre.'}],

paradas:[
{nombre:'Gordio',pais:'Turquía',pos:[39.65,31.99],fecha:'333 a. C.',rumbo:'Cruzando el Helesponto, tierra adentro en Asia Menor',imagen:'Un nudo gordo (Gor-dio) que nadie puede desatar; él saca la espada y lo corta, y todos dicen que así se gana el mundo.',dato:'En Gordio, la vieja capital de Frigia, estaba el carro atado con un nudo que, según la profecía, desataría el señor de Asia. Alejandro lo cortó con la espada, cuenta una versión; otra dice que sacó la clavija. De ahí viene «cortar el nudo gordiano».',escena:['castillo','campos','montaña']},
{nombre:'Issos',pais:'Turquía',pos:[36.83,36.2],fecha:'333 a. C.',rumbo:'Al sureste, bajando a la costa de Cilicia',imagen:'Un rey persa que huye en su carro y deja atrás a su madre, su mujer y sus hijas: en Issos, Darío perdió la batalla y la familia.',dato:'En la llanura de Issos, entre las montañas y el mar, Alejandro venció a Darío III en el 333 a. C. Darío escapó; su familia quedó prisionera y Alejandro la trató con honores. El famoso mosaico de Pompeya muestra este momento.',escena:['montaña','campos','barco']},
{nombre:'Tiro',pais:'Líbano',pos:[33.27,35.2],fecha:'332 a. C.',rumbo:'Al sur, por la costa de Fenicia',imagen:'Una isla que no quiere abrir la puerta y un ejército que construye un camino de piedra por el mar para llegar a ella: siete meses de tira y afloje (Ti-ro).',dato:'Tiro, ciudad fenicia en una isla, resistió siete meses. Alejandro mandó construir un dique de piedra desde la costa hasta la isla; el dique quedó, se llenó de arena y por eso Tiro es hoy una península.',escena:['castillo','barco','muelle']},
{nombre:'Alejandría',pais:'Egipto',pos:[31.2,29.92],fecha:'331 a. C.',rumbo:'Al suroeste, hasta la boca del Nilo',imagen:'Un rey que dibuja una ciudad en la arena con harina, porque no tenía tiza, y las gaviotas se la comen: buena señal, dijeron los adivinos.',dato:'La fundó en el 331 a. C. en la costa de Egipto, donde lo habían recibido como libertador y como faraón. Fue la primera de muchas Alejandrías y llegó a ser la ciudad más grande del Mediterráneo, con su faro y su biblioteca. Antes de fundarla fue al oráculo de Siwa, en el desierto.',escena:['faro','muelle','piramide']},
{nombre:'Gaugamela',pais:'Irak',pos:[36.36,43.25],fecha:'331 a. C.',rumbo:'Al noreste, cruzando el Éufrates y el Tigris',imagen:'Camellos de gala (Gauga-mela) miran una llanura aplanada a propósito para los carros con cuchillas de Darío, y los carros pasan de largo sin cortar a nadie.',dato:'La batalla decisiva, el 1 de octubre del 331 a. C., cerca de Mosul. Darío había aplanado el terreno para sus carros con cuchillas; Alejandro abrió las filas y los dejó pasar. Darío huyó otra vez y fue asesinado por los suyos al año siguiente.',escena:['campos','montaña','vaca']},
{nombre:'Persépolis',pais:'Irán',pos:[29.93,52.89],fecha:'330 a. C.',rumbo:'Al sureste, al corazón de Persia',imagen:'Un palacio de piedra con leones tallados que arde una noche de fiesta: la ciudad del rey de reyes, quemada por sus invitados.',dato:'Capital ceremonial de los persas, con palacios y relieves de todos los pueblos del imperio trayendo regalos. Alejandro la ocupó en el 330 a. C. y, meses después, su palacio ardió tras un banquete; si fue venganza por Atenas o un accidente, todavía se discute. Las ruinas son Patrimonio de la Humanidad.',escena:['castillo','montaña','duna']},
{nombre:'Samarcanda',pais:'Uzbekistán',pos:[39.65,66.97],fecha:'329 a. C.',rumbo:'Al noreste, cruzando el Hindu Kush hasta Asia Central',imagen:'Un samurái (Samar-canda) con manzanas de oro en una ciudad de jardines, muy lejos de casa, donde el ejército empezó a cansarse.',dato:'Maracanda para los griegos, la ciudad principal de Sogdiana. Alejandro pasó dos años combatiendo en estas tierras del Asia central, se casó aquí cerca con Roxana y aquí, en una discusión de borrachos, mató a su amigo Clito.',escena:['castillo','campos','montaña']},
{nombre:'Hidaspes',pais:'Pakistán',pos:[32.93,73.73],fecha:'326 a. C.',rumbo:'Al sureste, a la India, hasta el río de la batalla con Poros',imagen:'Elefantes que cruzan un río crecido bajo la lluvia y un caballo viejo que da su última batalla: Bucéfalo se quedó en la orilla, en una ciudad con su nombre.',dato:'A orillas del río Hidaspes, hoy Jhelum, venció al rey Poros y a sus elefantes en el 326 a. C., en plena lluvia del monzón. Aquí murió Bucéfalo, su caballo desde niño, y fundó Bucefalia en su honor. Poco después, en el Hífasis, el ejército se negó a seguir y volvieron hacia el oeste.',escena:['animal:caballo','cataratas','selva']}],
vehiculo:{nombre:'La falange y los Compañeros',tipo:'jinete',desc:'Unos 40 000 soldados: la falange a pie, con sarisas de seis metros, y la caballería de los Compañeros, con Alejandro al frente. Con ellos iban ingenieros, médicos, escribas y científicos que mandaban plantas y animales a Aristóteles.',zarpe:'Cruzás el Helesponto con el ejército; del otro lado empieza Asia.',llegada:'Once años y más de 30 000 km después, el camino termina en Babilonia, en junio del 323 a. C.',
puertos:[['En Gordio pasó el invierno y cortó el nudo.','provisiones del invierno'],['En Issos tomó el campamento de Darío con su tesoro y su familia.','tesoro de Darío'],['En Tiro dejó guarnición y siguió a Egipto.','púrpura de Tiro'],['En Egipto lo coronaron faraón y fundó la ciudad.','papiro y trigo'],['En Gaugamela ganó el imperio; en Babilonia lo recibieron con flores.','oro de Babilonia'],['En Persépolis cargó el tesoro real: miles de carretas, cuentan.','oro y plata de Persia'],['En Sogdiana se casó con Roxana y reclutó jinetes de la estepa.','caballos y lapislázuli'],['En el Hidaspes, con Poros vencido y convertido en aliado, el ejército pidió volver.','vendida']]},
companero:{nombre:'Bucéfalo',especie:'el caballo',emoji:'🐎',glifo:'caballo',hola:'Soy Bucéfalo. Nadie me podía montar hasta que un niño de doce años vio que me asustaba mi sombra. Ese niño es el rey. Vamos.',fin:'Hasta aquí llego yo: me quedo en la orilla del Hidaspes, en la ciudad que lleva mi nombre. Vos seguí hasta Babilonia y contá el viaje.',
paradas:['Un nudo que nadie desata. Él lo corta. Así es él: si no hay puerta, hace una.','Aquí corrimos hacia el rey persa y el rey persa corrió más rápido. Ganamos.','Siete meses parados frente a una isla. Los caballos nos aburrimos; los ingenieros, no.','Me llevaron al desierto a ver un oráculo. Yo solo vi arena. Después dibujó una ciudad con harina.','La llanura estaba lisa para los carros con cuchillas. Abrimos filas y pasaron de largo. Uf.','Un palacio enorme con leones de piedra. Esa noche hubo fiesta y fuego. No pregunté.','Dos años de montañas y frío. Aquí él se casó. Yo conocí yeguas de la estepa.','Lluvia, un río crecido y elefantes. Esta fue mi última batalla; aquí me quedo.']},

{tramo:3,icono:'ola',titulo:'El dique de Tiro',texto:'Tiro está en una isla y no abre las puertas. Alejandro manda construir un dique de piedra desde la costa; los tirios lo queman con un barco en llamas y los macedonios lo vuelven a levantar, más ancho. Siete meses después la ciudad cae.',reto:'ruta',bien:'El dique aguanta y sabés adónde sigue el camino.',mal:'El dique se quemó; repasá la ruta y lo levantamos otra vez.'},
{tramo:8,icono:'lluvia',titulo:'Los elefantes de Poros',texto:'Es la época de lluvias y el Hidaspes viene crecido. Del otro lado esperan el rey Poros y sus elefantes, que espantan a los caballos. Alejandro cruza de noche, río arriba, por sorpresa.',reto:'pais',bien:'Cruzaste de noche y los elefantes no te vieron.',mal:'Los elefantes asustaron a los caballos; repasá y cruzamos otra vez.'}]},

inicio:{nombre:'Santiago de Cuba',fecha:'1519',nota:'Salió de Cuba en febrero de 1519 con once naves, unos 500 soldados, 16 caballos y unos cañones, contra la orden del gobernador Velázquez, que a última hora quiso quitarle el mando. Dos años y medio después, Tenochtitlan, la ciudad más grande de América, había caído.',escena:['barco','muelle','palmera']},
fin:{nombre:'Tenochtitlan, 1521',en:'Tenochtitlan',fecha:'1521',escena:['castillo','lago','casas']},
contexto:[
{clave:'entonces',titulo:'El mundo que vio',texto:'Los mexicas gobernaban desde Tenochtitlan, una ciudad de más de 150 000 personas construida sobre un lago, y cobraban tributo a decenas de pueblos que no los querían. Cortés ganó juntando a esos pueblos: totonacas y, sobre todo, tlaxcaltecas, que pusieron miles de guerreros. Y la viruela, que llegó con los españoles en 1520, mató a más gente que las batallas.',pista:'Una capital sobre un lago, pueblos que pagaban tributo a la fuerza y una enfermedad que llegó con los barcos.'},
{clave:'hoy',titulo:'Lo que queda',texto:'La Ciudad de México está sobre el lago seco y sobre las ruinas de Tenochtitlan: el Templo Mayor apareció junto a la catedral en 1978. El náhuatl lo hablan hoy más de un millón de personas. En 2021, a los 500 años, México discutió si conmemorar la caída o la resistencia; la palabra «conquista» sigue en debate.',pista:'Una capital moderna sobre un lago que ya no existe y un templo que apareció al lado de una catedral.'}],

{nombre:'Cozumel',pais:'México',pos:[20.51,-86.95],fecha:'1519',rumbo:'Por mar, al oeste, hasta una isla de Yucatán',imagen:'Una cosa que muele (Cozu-mel) tortillas en una isla, y un náufrago español que llevaba ocho años entre mayas aparece hablando su lengua: Jerónimo de Aguilar, el primer traductor.',dato:'Primera escala en tierra maya, en febrero de 1519. Aquí recogieron a Jerónimo de Aguilar, náufrago de 1511 que hablaba maya; con Malintzin, que hablaba maya y náhuatl, formó la cadena de traducción de toda la expedición.',escena:['palmera','barco','templo']},
{nombre:'Tabasco',pais:'México',pos:[18.53,-92.65],fecha:'1519',rumbo:'Por mar, bordeando la costa hacia el oeste',imagen:'Una tabla de surf con sombrero (Tabas-co) donde por primera vez los caballos entran en batalla, y los mayas creen que caballo y jinete son un solo animal.',dato:'En la batalla de Centla, en marzo de 1519, los mayas chontales vieron caballos por primera vez. Después de la batalla los caciques entregaron veinte mujeres, entre ellas Malintzin, la Malinche, que sería la intérprete y consejera de Cortés.',escena:['selva','animal:caballo','campos']},
{nombre:'Veracruz',pais:'México',pos:[19.19,-96.14],fecha:'1519',rumbo:'Por mar, más al norte, hasta la costa del Golfo',imagen:'Un pueblo fundado en la arena solo para tener un ayuntamiento que le dé permiso a su propio jefe: la Villa Rica de la Vera Cruz.',dato:'Cortés desembarcó en abril de 1519 y fundó la Villa Rica de la Vera Cruz; el nuevo cabildo lo nombró capitán, con lo que se libró de la autoridad del gobernador de Cuba. Aquí recibió a los primeros embajadores de Moctezuma con regalos de oro.',escena:['muelle','barco','casas']},
{nombre:'Cempoala',pais:'México',pos:[19.44,-96.4],fecha:'1519',rumbo:'Tierra adentro, a la ciudad de los totonacas',imagen:'Un pueblo de casas tan blancas que los soldados creyeron que eran de plata, y un cacique gordo que se queja de los cobradores de tributo.',dato:'Ciudad totonaca, la primera aliada de Cortés: su cacique se quejó del tributo mexica y Cortés apresó a los recaudadores. Desde aquí, antes de marchar a la sierra, mandó hundir las naves en Villa Rica para que nadie pudiera volver a Cuba.',escena:['casas','templo','campos']},
{nombre:'Tlaxcala',pais:'México',pos:[19.32,-98.24],fecha:'1519',rumbo:'Subiendo la sierra, hasta la meseta',imagen:'Tlaxcala es una taza (Tlax-cala) que primero te tira y después te invita a comer: pelearon dos semanas y luego se hicieron aliados para siempre.',dato:'Los tlaxcaltecas, enemigos de los mexicas, combatieron a los españoles en septiembre de 1519 y después pactaron con ellos. Pusieron miles de guerreros en el sitio de Tenochtitlan y conservaron privilegios durante toda la época colonial.',escena:['montaña','casas','campos']},
{nombre:'Cholula',pais:'México',pos:[19.06,-98.3],fecha:'1519',rumbo:'Al sur, a la ciudad de las pirámides',imagen:'La pirámide más grande del mundo con una iglesia encima y un chorro de lula (Cho-lula): aquí la expedición mató a cientos de personas en la plaza, un día de octubre.',dato:'Ciudad sagrada con la pirámide más grande del mundo por volumen, hoy con una iglesia en la cima. En octubre de 1519, diciendo que preparaban una emboscada, los españoles y sus aliados mataron a cientos de cholultecas en la plaza; las fuentes discuten si la emboscada era real.',escena:['piramide','iglesia','montaña']},
{nombre:'Tenochtitlan',pais:'México',pos:[19.43,-99.13],fecha:'1519',rumbo:'Al oeste, entre los volcanes, hasta el lago',imagen:'Una ciudad flotante con calles de agua y un emperador que baja de su litera para saludar a un extranjero en un puente: el 8 de noviembre, Moctezuma y Cortés se dieron collares.',dato:'El 8 de noviembre de 1519 Moctezuma recibió a Cortés en la calzada de Iztapalapa. Los soldados escribieron que la ciudad parecía cosa de sueños: templos, canales y un mercado, el de Tlatelolco, con decenas de miles de personas. Días después Cortés tomó preso a Moctezuma en su propio palacio.',escena:['castillo','lago','mercado']},
{nombre:'Otumba',pais:'México',pos:[19.7,-98.75],fecha:'1520',rumbo:'Huyendo del lago hacia el noreste, la Noche Triste',imagen:'Un ejército que huye de noche por un puente roto, pierde el oro en el lago y una semana después, en un llano de ocho tumbas (O-tumba), le gana a quien lo perseguía.',dato:'La noche del 30 de junio de 1520, la Noche Triste, los españoles escaparon de Tenochtitlan con cientos de muertos. El 7 de julio, en la llanura de Otumba, vencieron al ejército que los perseguía y llegaron a Tlaxcala a rehacerse.',escena:['campos','montaña','casas']},
{nombre:'Texcoco',pais:'México',pos:[19.51,-98.88],fecha:'1521',rumbo:'De vuelta a la orilla del lago, para el asedio',imagen:'Trece barcos armados en la montaña y llevados a cuestas hasta el lago: desde Texcoco (Tex-coco) los bergantines cortaron la comida y el agua a la ciudad.',dato:'Cortés instaló aquí su base en 1521, en la orilla del lago. Los tlaxcaltecas cargaron por tierra las piezas de trece bergantines, que dominaron el lago durante el sitio. Tenochtitlan cayó el 13 de agosto de 1521, cuando Cuauhtémoc, el último tlatoani, fue capturado.',escena:['barco','lago','montaña']}],
vehiculo:{nombre:'La expedición de Cortés',tipo:'jinete',desc:'Once naves, unos quinientos soldados, dieciséis caballos, unos cañones y, después, miles de guerreros aliados, sobre todo tlaxcaltecas: sin ellos no había conquista. Malintzin y Jerónimo de Aguilar traducían.',zarpe:'Zarpás de Cuba sin permiso; si esto sale mal, no hay adónde volver.',llegada:'Dos años y medio después, Tenochtitlan ha caído y sobre sus ruinas empieza a levantarse la Ciudad de México.',
puertos:[['En Cozumel sumaron a Jerónimo de Aguilar, el náufrago que hablaba maya.','cuentas de vidrio y cascabeles'],['En Tabasco recibieron veinte mujeres, entre ellas Malintzin, y comida.','cacao y maíz'],['En Veracruz llegaron los regalos de Moctezuma: un sol de oro y una luna de plata, según Bernal Díaz.','oro de Moctezuma'],['En Cempoala se juntaron cientos de cargadores totonacas.','vainilla y algodón'],['En Tlaxcala, después de pelear, entraron como aliados y descansaron veinte días.','mantas de algodón'],['En Cholula tomaron la ciudad y siguieron entre los dos volcanes.','jade y plumas'],['En Tenochtitlan los alojaron en el palacio de Axayácatl, donde encontraron el tesoro.','oro y plumas de quetzal'],['En Otumba, sin pólvora y con heridos, salvaron la expedición.','lo que quedó de la huida'],['En Texcoco armaron los bergantines y cercaron la ciudad.','vendida']]},
companero:{nombre:'Rabona',especie:'la yegua',emoji:'🐴',glifo:'caballo',hola:'Soy Rabona, una de las dieciséis. Bernal Díaz nos apuntó a todos por nombre. Aquí nunca habían visto un caballo: mirá las caras.',fin:'La ciudad del lago cayó. Yo vi todo desde la calzada. Contalo entero, con los que ganaron y los que perdieron.',
paradas:['Una isla con templos de piedra y un español que habla maya. Aquí empieza a entenderse todo.','Mi primera batalla. Creen que el jinete y yo somos un solo animal. Qué miedo les dimos.','Fundaron un pueblo en la arena para poder mandarse solos. Los abogados de esa época.','Casas blancas como plata y un cacique enorme. Y las naves, hundidas: ya no hay vuelta.','Dos semanas de pelea y luego amigos. Los tlaxcaltecas serán los que carguen los barcos.','Una pirámide con un cerro encima. Lo que pasó en la plaza no me gusta contarlo, pero pasó.','Una ciudad sobre el agua. Nunca vi nada igual. El emperador nos recibió con collares.','La noche del puente roto perdimos a muchos. Una semana después, en el llano, ganamos.','Trece barcos cargados a cuestas por la montaña. Yo no cabía en ninguno.']},

{tramo:4,icono:'ola',titulo:'Las naves hundidas',texto:'Antes de subir a la sierra, Cortés manda hundir sus naves, con la excusa de que estaban podridas, para que nadie pueda volver a Cuba. Después dirán que las quemó, pero las fuentes de la época dicen que las barrenó.',reto:'frase',bien:'Sin barcos y con la frase en la cabeza: adelante.',mal:'Sin barcos no hay vuelta; repasá la frase y seguimos.'},
{tramo:7,icono:'niebla',titulo:'La calzada sobre el lago',texto:'Amanece con niebla sobre el lago y la expedición avanza por una calzada de piedra tan ancha como ocho caballos, entre canoas que la miran. Al final, bajo un palio de plumas verdes, espera Moctezuma.',reto:'ruta',bien:'Moctezuma te espera al final de la calzada: sabés adónde vas.',mal:'La calzada es larga; repasá el camino y seguimos.'}]},

inicio:{nombre:'Nankín',fecha:'1405',nota:'La flota del tesoro zarpó de Nankín, la capital de los Ming, en 1405, al mando de Zheng He, un eunuco musulmán de Yunnan que había sido capturado de niño. En 28 años hizo siete viajes por el océano Índico; el emperador Yongle quería que todos los reinos del mar conocieran el poder de China.',escena:['muelle','barco','pagoda']},
fin:{nombre:'Nankín, de regreso',en:'Nankín',fecha:'1433',escena:['pagoda','muelle','casas']},
contexto:[
{clave:'entonces',titulo:'El mundo que vio',texto:'El océano Índico era ya un mar de comerciantes: árabes, persas, indios, malayos y chinos se cruzaban en Calicut, Malaca y Adén siguiendo los monzones. La flota Ming llegaba con decenas de barcos enormes, regalaba seda y porcelana, cobraba tributo y llevaba embajadores de vuelta a China. Fue la armada más grande del mundo hasta el siglo XX.',pista:'Un mar lleno de mercaderes de muchos pueblos y una flota enorme que llegaba a regalar y a cobrar tributo.'},
{clave:'hoy',titulo:'Lo que queda',texto:'En 1433, con el último viaje, la corte mandó parar: los barcos se pudrieron en los astilleros y China dejó el mar justo cuando Portugal empezaba a bajar por África. En Malaca, Java y Tailandia hay templos dedicados a Zheng He; en Nankín está su tumba. El tamaño de sus barcos, que las crónicas dan como gigantesco, se discute.',pista:'Una flota que dejó el mar por decisión de una corte, justo cuando otros países empezaban a salir a navegar.'}],

{nombre:'Champa',pais:'Vietnam',pos:[13.78,109.22],fecha:'1405',rumbo:'Por mar, al sur, hasta la costa de Vietnam',imagen:'Un champú (Cham-pa) de madera de aloe que huele a incienso en una costa de torres de ladrillo: la primera escala de todos los viajes.',dato:'Reino de la costa de lo que hoy es Vietnam, con torres de ladrillo de sus templos hindúes. Era la primera escala de la flota, a unos diez días de China, y vendía madera de aloe, incienso y marfil.',escena:['templo','barco','palmera']},
{nombre:'Java',pais:'Indonesia',pos:[-7.25,112.75],fecha:'1406',rumbo:'Por mar, al sur, cruzando el ecuador hasta una isla de volcanes',imagen:'Una taza de café (Java) tan grande que dentro caben 170 marineros: en Java, en una guerra ajena, la flota perdió tripulantes y cobró una indemnización en oro.',dato:'En 1406 la flota llegó a Java en medio de una guerra entre dos reyes; 170 hombres de Zheng He murieron por error y el rey de Majapahit tuvo que pagar una indemnización a China. Java vendía pimienta, arroz y madera.',escena:['volcan','selva','barco']},
{nombre:'Malaca',pais:'Malasia',pos:[2.19,102.25],fecha:'hacia 1406',rumbo:'Al noroeste, al estrecho por donde pasa todo el comercio',imagen:'Un rey nuevo que planta una maleta (Mala-ca) en el estrecho y cobra peaje a todos los barcos del mundo, con la flota china de guardaespaldas.',dato:'Puerto recién fundado en el estrecho por donde pasaba todo el comercio entre India y China. Zheng He instaló aquí un almacén fortificado para la flota y llevó a su rey a Nankín en 1411; con la protección china, Malaca se volvió el gran mercado del Asia del sur.',escena:['muelle','mercado','barco']},
{nombre:'Calicut',pais:'India',pos:[11.25,75.78],fecha:'1407',rumbo:'Por el golfo de Bengala, con el monzón, hasta la costa de la pimienta',imagen:'Un calcetín (Calic-ut) lleno de pimienta que se pesa con las manos: en Calicut los tratos se cerraban con un apretón y sin papel.',dato:'El gran puerto de la pimienta en la costa de Malabar, gobernado por el zamorín. Ma Huan, el cronista de la flota, cuenta que los mercaderes cerraban los tratos con un apretón de manos. Zheng He murió, según muchos, en el viaje de vuelta desde aquí, en 1433.',escena:['muelle','mercado','palmera']},
{nombre:'Palembang',pais:'Indonesia',pos:[-2.99,104.76],fecha:'1407',rumbo:'De vuelta al este, a un puerto de río en Sumatra',imagen:'Una palanca de bambú (Palem-bang) atrapa a un pirata chino con toda su flota en un río de Sumatra.',dato:'Puerto chino en Sumatra, en el río Musi, gobernado por el pirata Chen Zuyi. En 1407, de regreso del primer viaje, Zheng He lo derrotó en batalla, lo llevó preso a Nankín y dejó el puerto en manos de un aliado; fue la primera batalla de la flota.',escena:['selva','barco','casas']},
{nombre:'Adén',pais:'Yemen',pos:[12.8,45.03],fecha:'hacia 1418',rumbo:'Cruzando el mar Arábigo, hasta la puerta del mar Rojo',imagen:'Un puerto de piedra en un volcán apagado donde un sultán recibe a los chinos con perlas, ámbar y una jirafa que no cabe en el barco.',dato:'Puerto del sur de Arabia en un cráter viejo, a la entrada del mar Rojo. La flota llegó en su quinto viaje, hacia 1418, y el sultán mandó regalos al emperador; los chinos compraron piedras preciosas, ámbar gris y animales raros.',escena:['volcan','muelle','barco']},
{nombre:'Mogadiscio',pais:'Somalia',pos:[2.05,45.34],fecha:'hacia 1418',rumbo:'Al suroeste, a la costa de África',imagen:'Casas de piedra de cuatro pisos (Moga-discio) en la arena, y gente que cambia porcelana china por marfil y cebras.',dato:'Ciudad de comerciantes en la costa de Somalia, con casas altas de piedra y mezquitas. Ma Huan la describe seca y con casas de cuatro o cinco pisos; la porcelana china que allí quedó aparece todavía en las excavaciones de toda la costa suajili.',escena:['casas','mezquita','duna']},
{nombre:'Malindi',pais:'Kenia',pos:[-3.22,40.12],fecha:'hacia 1418',rumbo:'Al sur, por la costa suajili, hasta el punto más lejano',imagen:'Un rey que manda a China una jirafa, y en China la toman por un animal de leyenda, el qilin: el mejor regalo de todo el viaje.',dato:'Puerto suajili de Kenia, el punto más lejano de la flota. De aquí salió en 1415 una embajada con una jirafa para el emperador Yongle, que la recibió como un qilin, animal de buen augurio de las leyendas chinas; un pintor de la corte la retrató.',escena:['palmera','muelle','animal:jirafa']}],
vehiculo:{nombre:'La flota del tesoro',tipo:'junco',desc:'Decenas de juncos enormes, los barcos del tesoro, con muchos mástiles y cientos de tripulantes cada uno, más barcos de caballos, de agua y de escolta. Las crónicas cuentan unas 300 naves y 27 000 hombres en el primer viaje; el tamaño exacto de los barcos grandes se discute.',zarpe:'Zarpás de Nankín con la flota más grande que ha visto el mar.',llegada:'Siete viajes en 28 años. En 1433 la corte manda parar y los barcos del tesoro se quedan en el puerto, hasta pudrirse.',
puertos:[['En Champa cargaron madera de aloe y marfil para la corte.','madera de aloe'],['En Java compraron pimienta y cobraron una indemnización en oro.','pimienta y oro'],['En Malaca dejaron el almacén de la flota y siguieron con el monzón.','estaño y resinas'],['En Calicut cambiaron seda y porcelana por pimienta y perlas.','pimienta y perlas'],['En Palembang apresaron al pirata Chen Zuyi y dejaron un aliado.','arroz y estaño'],['En Adén compraron ámbar gris, corales y piedras.','ámbar gris y corales'],['En Mogadiscio dejaron porcelana y cargaron marfil.','marfil'],['En Malindi recibieron la jirafa y dieron la vuelta.','vendida']]},
companero:{nombre:'Qilin',especie:'la jirafa',emoji:'🦒',glifo:'jirafa',hola:'Soy Qilin, la jirafa. Yo subí a bordo en África, pero me sé la ruta de oído: los marineros no hablan de otra cosa. En China creen que soy un animal de leyenda.',fin:'Nankín. El emperador me miró un rato largo y mandó pintarme. Vos contá el viaje; yo me quedo en el jardín del palacio.',
paradas:['Torres de ladrillo y olor a incienso. Primera escala: aquí todos bajan a estirar las patas.','Un volcán, arroz y una guerra que no era nuestra. Perdimos gente y cobramos en oro.','Un puerto nuevo en el estrecho. Aquí dejamos el almacén; todo el mundo pasa por aquí.','¡Pimienta! Sacos y sacos. Los tratos se cierran con un apretón de manos. Sin papel.','Un pirata con flota propia en un río. Lo atrapamos entero. Yo miraba desde arriba.','Un puerto dentro de un volcán apagado. Perlas, ámbar y, dicen, una prima mía.','Casas de piedra de cuatro pisos y arena por todos lados. Cambiaron porcelana por marfil.','Mi casa. De aquí me llevaron a China como regalo. Un jardín entero para mí sola.']},

eventos:[
{tramo:5,icono:'ola',titulo:'El pirata de Palembang',texto:'En el río Musi, el pirata Chen Zuyi, con miles de hombres y decenas de barcos, controla el paso. Zheng He le ofrece rendirse; él finge aceptar y ataca de noche. La flota lo esperaba.',reto:'ruta',bien:'El pirata cae en su propia trampa y la flota sigue.',mal:'El pirata escapó esta vez; repasá la ruta y lo alcanzamos.'},
{tramo:8,icono:'viento',titulo:'El monzón de vuelta',texto:'La flota no puede volver a China cuando quiere: sale de Arabia con el monzón del noreste y regresa con el del suroeste. Si pierde el viento, espera meses en un puerto; por eso cada viaje dura casi dos años.',reto:'imagen',bien:'Con el viento a favor, la flota avanza.',mal:'Se fue el viento; repasá y esperamos en puerto.'}]},

vocab:{llegada:r=>`Después de ${r.paradas.length} escalas, Odiseo vuelve a Ítaca, solo y veinte años después de haber salido.`,vozFin:r=>'Regreso: Ítaca. Después de nueve escalas, Odiseo vuelve a Ítaca, solo y veinte años después de haber salido.'},
inicio:{nombre:'Troya',nota:'El regreso empieza en Troya, la ciudad que los griegos tomaron tras diez años de guerra con el caballo de madera que ideó Odiseo; sus ruinas se excavan en la colina de Hisarlik, en Turquía. Las doce naves de Odiseo zarpan hacia Ítaca, que queda a menos de 600 km en línea recta. Según el poema, tardan diez años.',escena:['castillo','duna','barco']},
fin:{nombre:'Ítaca, el regreso',en:'Ítaca',escena:['casas','muelle','arbol']},
contexto:[
{clave:'poema',titulo:'El poema',texto:'La Odisea es un poema de veinticuatro cantos, compuesto en griego hacia el siglo VIII a. C. y atribuido a Homero, que cuenta el regreso de Odiseo (Ulises para los romanos) desde Troya hasta Ítaca. Tarda diez años; el poema empieza cuando ya solo le falta salir de la isla de Calipso, y el resto lo cuenta el propio Odiseo en un banquete.',pista:'Un poema muy antiguo sobre un regreso de diez años, contado en un banquete por el que lo vivió.'},
{clave:'mapa',titulo:'El mapa de la tradición',texto:'El poema casi no da nombres reales, pero desde la Antigüedad se buscan sus lugares en el Mediterráneo occidental: Tucídides puso a los cíclopes en Sicilia y a los feacios en Corfú, y Estrabón a Escila y Caribdis en el estrecho de Mesina. Eratóstenes se burlaba: el viaje de Odiseo se encontrará cuando se encuentre al zapatero que cosió el odre de los vientos. Este mapa sigue esa tradición, no un hecho.',pista:'Lugares que la gente lleva siglos buscando en un mar, sabiendo que el poema no los da.'}],

paradas:[
{nombre:'Ísmaro',pais:'Grecia',pos:[40.87,25.52],fecha:'año 1 del regreso',rumbo:'Por el Egeo, a la costa de Tracia',imagen:'Un mar de vino (Ís-mar-o) tan dulce que hay que mezclarlo con veinte medidas de agua: Marón regala doce ánforas, y con ellas caerá dormido un gigante.',dato:'Ciudad de los cícones en la costa de Tracia, la primera del regreso: los griegos la saquean y Marón, sacerdote de Apolo, regala a Odiseo doce ánforas de un vino tan fuerte que se bebe con veinte partes de agua; es el vino que después embriaga al cíclope. Se sitúa cerca de la antigua Maronea.',escena:['templo','campos','barco']},
{nombre:'Yerba',pais:'Túnez',pos:[33.8,10.85],fecha:'año 1 del regreso',rumbo:'Al sur, con la tormenta, hasta la costa de África',imagen:'Una yerba (Yerba) dulce como la miel que borra la memoria: los que la prueban lloran cuando los arrastran de vuelta a los remos.',dato:'Isla de los lotófagos, los que comen la flor del loto y olvidan volver a casa; una tormenta empuja a la flota nueve días desde el cabo Malea hasta aquí. Heródoto ya ponía a los lotófagos en la costa de Libia, y desde la Antigüedad se los identifica con la isla de Yerba, en Túnez.',escena:['palmera','duna','barco']},
{nombre:'Etna',pais:'Italia',pos:[37.6,15.17],fecha:'año 1 del regreso',rumbo:'Al norte, a la isla de los cíclopes',imagen:'Un ojo enorme se apaga con una estaca al pie del volcán (Etna), y los marineros salen de la cueva agarrados a la panza de las ovejas.',dato:'Tierra de los cíclopes: Polifemo, el gigante de un solo ojo, encierra a Odiseo y a sus hombres en su cueva y ellos escapan bajo las ovejas después de cegarlo. Tucídides cuenta que los cíclopes fueron los primeros habitantes de Sicilia; la tradición los pone al pie del Etna, y las rocas que el gigante lanzó se muestran frente a Acitrezza.',escena:['volcan','campos','barco']},
{nombre:'Lípari',pais:'Italia',pos:[38.47,14.95],fecha:'año 1 del regreso',rumbo:'A las islas al norte de Sicilia',imagen:'Un odre de cuero atado con hilo de plata que guarda todos los vientos, regalo del rey de la isla (Lípari); abrirlo a la vista de casa devuelve la flota al punto de partida.',dato:'Isla de Eolo, el señor de los vientos, que regala a Odiseo un odre con todos los vientos menos el favorable; a la vista de Ítaca los marineros lo abren y la tormenta los devuelve. Las islas Eolias, al norte de Sicilia, llevan su nombre desde la Antigüedad; Lípari es la mayor.',escena:['volcan','muelle','barco']},
{nombre:'Circeo',pais:'Italia',pos:[41.23,13.05],fecha:'año 2 del regreso',rumbo:'Costa arriba, hacia el norte, a la isla de la maga',imagen:'En un monte con forma de isla (Circeo), una maga con un cetro convierte a la tripulación en cerdos que lloran; el capitán, con una hierba mágica, resiste.',dato:'Isla de Eea, donde la maga Circe convierte a los compañeros en cerdos; Odiseo la vence con la hierba que le da Hermes y se queda un año entero. La tradición la sitúa en el monte Circeo, un promontorio del Lacio que desde el mar parece una isla.',escena:['selva','casas','barco']},
{nombre:'Sirenas',pais:'Italia',pos:[40.58,14.43],fecha:'año 2 del regreso',rumbo:'De vuelta al sur, por el golfo de Nápoles',imagen:'Dos islotes donde cantan mujeres con alas de pájaro (Sirenas); en la nave, todos con cera en los oídos y el capitán atado al mástil pidiendo que lo suelten.',dato:'Las sirenas cantan para atraer a los marineros; Odiseo tapa con cera los oídos de sus hombres y se hace atar al mástil para oírlas sin perderse. Los antiguos ponían su isla en las Sirenusas, frente a la costa de Sorrento: hoy los islotes Li Galli.',escena:['duna','aves','barco']},
{nombre:'Mesina',pais:'Italia',pos:[38.25,15.63],fecha:'año 2 del regreso',rumbo:'Al estrecho entre Sicilia y Calabria',imagen:'En un estrecho, un monstruo de seis cabezas a la derecha y un remolino que traga el mar a la izquierda (Mesina): la nave pasa por el medio remando sin mirar.',dato:'Escila, el monstruo de seis cabezas, y Caribdis, el remolino que traga el mar tres veces al día: pasar entre los dos cuesta seis hombres. Desde la Antigüedad se los coloca en el estrecho de Mesina, entre Sicilia y Calabria, donde las corrientes cambian con la marea.',escena:['garganta','barco','faro']},
{nombre:'Gozo',pais:'Malta',pos:[36.05,14.25],fecha:'años 3 a 10 del regreso',rumbo:'Al sur, a una isla pequeña, náufrago en un madero',imagen:'Siete años de gozo (Gozo) en una cueva con vista al mar, con una ninfa que no lo deja ir; al final, un hacha, veinte árboles y una balsa.',dato:'Ogigia, la isla de la ninfa Calipso, que retiene a Odiseo siete años y al fin lo deja partir en una balsa que él mismo construye. Una tradición muy repetida la identifica con Gozo, en Malta, donde una cueva lleva el nombre de Calipso; el poema no dice dónde está.',escena:['duna','arbol','balsa']},
{nombre:'Corfú',pais:'Grecia',pos:[39.62,19.92],fecha:'año 10 del regreso',rumbo:'Al este, en balsa, hasta las islas griegas',imagen:'Una princesa que lava ropa en la playa encuentra a un náufrago cubierto de sal (Corfú) y lo lleva a un palacio donde él cuenta todo el viaje.',dato:'Esqueria, la tierra de los feacios: la princesa Nausícaa encuentra a Odiseo náufrago en la playa, el rey Alcínoo lo escucha contar todo su viaje y sus marineros lo llevan dormido hasta Ítaca. Ya Tucídides identificaba a los feacios con Corfú.',escena:['casas','muelle','barco']}],
vehiculo:{nombre:'Las doce naves de Odiseo',tipo:'cuadrada',desc:'Galeras negras de un solo mástil, con vela cuadrada y una fila de remeros por banda, como las naves que el poema describe. Odiseo sale de Troya con doce; pierde once con los lestrigones y la última después de Trinacia, sigue en la balsa que construye en Ogigia y llega a Ítaca en un barco de los feacios.',zarpe:'Zarpás de Troya con doce naves llenas de botín.',llegada:'Veinte años después de haber salido, Odiseo llega dormido a Ítaca en una nave de los feacios: de las doce naves no queda ninguna.',
puertos:[['En Ísmaro cargaron el botín de los cícones y las doce ánforas del vino de Marón.','vino de Marón'],['En la isla de los lotófagos arrastraron de vuelta a los remos a los que probaron el loto.','loto y botín'],['De la cueva del cíclope salieron con sus ovejas y sus quesos, y con el nombre de Nadie.','ovejas y quesos'],['Eolo les dio un odre con los vientos; a la vista de Ítaca lo abrieron y la tormenta los devolvió.','el odre de los vientos'],['Circe los despidió con provisiones y un viento favorable después de un año en su isla.','pan, vino y carne'],['Pasaron a las sirenas con cera en los oídos y el capitán atado al mástil.','cera de abejas'],['Entre Escila y Caribdis perdieron seis remeros; después, en Trinacia, se comieron las vacas del Sol y Zeus hundió la nave.','lo que quedaba'],['Siete años con Calipso; se fue en una balsa con hacha, provisiones y ropa que ella le dio.','una balsa'],['Los feacios lo llenaron de regalos, bronce y oro, y lo llevaron dormido a Ítaca.','vendida']]},
companero:{nombre:'Nerea',especie:'la delfín',emoji:'🐬',glifo:'delfin',hola:'¡Soy Nerea, la delfín! Nado delante de las naves desde Troya. Este mar lo conozco de punta a punta; a los monstruos, de lejos.',fin:'Ítaca. Veinte años después, y llegó dormido. Yo me quedo en el mar; contá vos cómo termina.',
paradas:['Primera escala y ya hay lío: se llevan el vino dulce de Marón. Guardalo, que sirve más adelante.','Aquí la flor del loto hace olvidar la casa. No comás. Yo prefiero los peces.','Un gigante con un solo ojo. Salieron colgados de las ovejas. Yo no me acerqué a la cueva.','El rey de los vientos regaló un odre. Ojo con abrirlo cerca de casa: se sabe cómo termina.','Una maga convirtió a la tripulación en cerdos. Un año entero aquí. Yo, nadando en círculos.','Cantan lindo, lo admito. Cera en los oídos y el capitán atado al mástil. Yo pasé de largo.','A un lado seis cabezas, al otro un remolino. Pegate a la roca y remá. Yo pasé por abajo.','Siete años en esta isla con la ninfa Calipso. Al final, una balsa. Yo la empujé un poquito.','Una princesa lo encontró en la playa. Contó todo el viaje en un banquete. Mañana, a casa.']},

eventos:[
{tramo:4,icono:'piedra',titulo:'Nadie',texto:'El cíclope Polifemo preguntó el nombre del extranjero y Odiseo contestó «Nadie». Ciego, gritó que Nadie le había hecho daño, y los otros cíclopes no acudieron. Al zarpar, Polifemo arroja rocas que casi hunden la nave: la tradición las muestra frente a Acitrezza.',reto:'imagen',bien:'La roca cae al lado y la nave sale del alcance del gigante.',mal:'La roca cayó cerca; repasá y nos alejamos remando.'},
{tramo:7,icono:'ola',titulo:'Escila y Caribdis',texto:'A un lado Escila, seis cabezas en una cueva; al otro Caribdis, que traga y devuelve el mar tres veces al día. Circe aconsejó pasar pegados a Escila y perder seis hombres antes que la nave entera. En el estrecho de Mesina las corrientes cambian con la marea.',reto:'ruta',bien:'Seis remeros menos, pero la nave pasa.',mal:'La corriente nos empujó atrás; repasá la ruta y pasamos con la marea.'}]},
{id:'napoleon',tipo:'itinerario',conquista:true,nombre:'Napoleón',region:'1812',cruza:['el río Niemen','el Dniéper','el Berézina','las llanuras de Rusia'],
tramos:[{nombre:'Cruzar el Niemen',hasta:0},{nombre:'Tras el enemigo',hasta:2},{nombre:'Borodinó y Moscú',hasta:4},{nombre:'La retirada',hasta:7}],
vocab:{tuVehiculo:'Tu ejército',cerrado:'Cerrado: la campaña ya terminó.',llegada:r=>`Después de ${r.paradas.length} etapas, lo que queda del ejército vuelve a Vilna en diciembre; Napoleón ya va en trineo hacia París.`,vozFin:r=>'Regreso: Vilna. Después de ocho etapas, lo que queda del ejército vuelve a Vilna en diciembre; Napoleón ya va en trineo hacia París.'},
inicio:{nombre:'Kaunas',fecha:'junio de 1812',nota:'El 24 de junio de 1812 la Grande Armée empezó a cruzar el Niemen cerca de Kovno, la Kaunas de hoy: cerca de 600 000 hombres de media Europa, el ejército más grande que el continente había visto. Napoleón quería obligar al zar Alejandro a cerrar sus puertos al comercio inglés. Seis meses después volvieron a cruzar el río unas decenas de miles.',escena:['puente','castillo','casas']},
fin:{nombre:'Vilna, de regreso',en:'Vilna',fecha:'diciembre de 1812',escena:['nieve','iglesia','casas']},
contexto:[
{clave:'entonces',titulo:'La Europa de Napoleón',texto:'En 1812 Napoleón mandaba, directamente o por medio de aliados, en casi toda Europa continental, e Inglaterra era su enemiga en el mar. Para ahogarla, prohibía comerciar con ella; cuando el zar Alejandro abrió otra vez sus puertos, Napoleón juntó el ejército más grande de la historia europea, con soldados de Francia, Polonia, Italia, Alemania, Austria y otros países, y marchó sobre Rusia.',pista:'Un emperador dueño de casi todo un continente que marcha con un ejército enorme contra el único país grande que no obedece su bloqueo.'},
{clave:'hoy',titulo:'Lo que quedó',texto:'La campaña de Rusia fue el principio del fin: en 1813 Napoleón perdió en Leipzig y en 1814 tuvo que abdicar. Tolstói la contó en «Guerra y paz» y Chaikovski le puso música en la «Obertura 1812». Un gráfico de 1869 del ingeniero Minard, que dibuja el ejército como una franja que se va adelgazando de Kaunas a Moscú y de vuelta, es todavía uno de los mapas más famosos del mundo.',pista:'Una campaña que empezó la caída de un imperio, una novela larguísima y un mapa en el que un ejército se adelgaza como una franja.'}],

paradas:[
{nombre:'Vilna',pais:'Lituania',pos:[54.69,25.28],fecha:'junio de 1812',rumbo:'Al este, cruzando el Niemen, tras el ejército ruso',imagen:'Una vil (Vil-na) lluvia de días empapa a un ejército enorme mientras el emperador espera dieciocho días en la ciudad a que el enemigo quiera pelear.',dato:'El ejército ruso se retiró sin pelear. Napoleón entró en Vilna el 28 de junio y se quedó dieciocho días organizando Lituania; las tormentas de esos días mataron miles de caballos y el ejército empezó a perder hombres antes de la primera batalla.',escena:['iglesia','casas','animal:caballo']},
{nombre:'Vítebsk',pais:'Bielorrusia',pos:[55.19,30.2],fecha:'julio de 1812',rumbo:'Al este, por Lituania y Bielorrusia, siguiendo al enemigo que se retira',imagen:'Un ejército entero se queda viendo (Vi-tebsk) una ciudad vacía: los rusos se fueron de noche y el emperador no sabe si seguir o parar.',dato:'Napoleón llegó el 28 de julio esperando batalla, pero el ejército ruso se había ido de noche. Dudó dos semanas entre quedarse allí hasta la primavera o seguir a Moscú, y siguió. El calor y las marchas ya habían dejado atrás a decenas de miles de hombres.',escena:['campos','casas','arbol']},
{nombre:'Smolensk',pais:'Rusia',pos:[54.78,32.05],fecha:'agosto de 1812',rumbo:'Al sureste, hasta la ciudad amurallada del Dniéper',imagen:'Una muralla con torres se llena de humo (Smo-lensk): la ciudad arde la noche de la batalla y el ejército entra en un pueblo de ceniza.',dato:'Ciudad amurallada sobre el Dniéper. La batalla fue el 16 y el 17 de agosto; los rusos se retiraron de noche y la ciudad ardió. Napoleón entró el 18 en una ciudad quemada y, otra vez, decidió seguir hacia Moscú, a unos 400 km.',escena:['castillo','iglesia','puente']},
{nombre:'Borodinó',pais:'Rusia',pos:[55.52,35.83],fecha:'septiembre de 1812',rumbo:'Por el camino de Moscú, hasta el campo de batalla',imagen:'Un tambor (Bo-ro-din-ó) suena desde el amanecer hasta la noche en el campo más sangriento de la campaña; al final los dos ejércitos siguen donde estaban.',dato:'El 7 de septiembre, a unos 120 km de Moscú, se dio la batalla más sangrienta de la campaña: cerca de 70 000 muertos y heridos entre los dos ejércitos en un solo día. Kutúzov se retiró en orden y dejó abierto el camino a Moscú.',escena:['campos','animal:caballo','arbol']},
{nombre:'Moscú',pais:'Rusia',pos:[55.75,37.62],fecha:'septiembre de 1812',rumbo:'Al este, hasta la capital vacía',imagen:'Un emperador espera en una colina las llaves de una ciudad que nadie le entrega, y esa misma noche empieza el incendio.',dato:'Napoleón entró el 14 de septiembre en una ciudad casi vacía; esa noche empezaron los incendios, que duraron días y quemaron unos dos tercios de Moscú. Esperó cinco semanas una paz que el zar Alejandro nunca ofreció y el 19 de octubre salió con unos 100 000 hombres.',escena:['castillo','iglesia','casas']},
{nombre:'Maloyaroslávets',pais:'Rusia',pos:[55.02,36.46],fecha:'octubre de 1812',rumbo:'De vuelta, hacia el suroeste, buscando un camino nuevo',imagen:'Un pueblo pequeño (Malo-yaro-slávets) cambia de manos varias veces en un día, y después el ejército vuelve por el camino viejo, el de las tierras quemadas.',dato:'El 24 de octubre, a unos 120 km al suroeste de Moscú, la batalla por este pueblo cerró el camino del sur, donde había comida. Napoleón tuvo que volver por el camino de Smolensk, saqueado en la ida, con el invierno encima.',escena:['casas','puente','campos']},
{nombre:'Krasny',pais:'Rusia',pos:[54.57,31.45],fecha:'noviembre de 1812',rumbo:'Al oeste, por el mismo camino de la ida, con la nieve',imagen:'Un rojo (Krasny quiere decir «rojo») que no es de sangre sino de fogatas en la nieve: la retaguardia cruza de noche un río helado para alcanzar al ejército.',dato:'Del 15 al 18 de noviembre, con nieve y cerca de veinte grados bajo cero, el ejército pasó en columnas separadas junto a Krasny bajo ataque ruso. La retaguardia del mariscal Ney, dada por perdida, cruzó de noche el Dniéper helado y volvió con unos 800 hombres.',escena:['nieve','campos','casas']},
{nombre:'Berézina',pais:'Bielorrusia',pos:[54.3,28.48],fecha:'noviembre de 1812',rumbo:'Al oeste, hasta un río sin puentes',imagen:'Dos puentes de madera sobre un río helado (Bere-zina), levantados con el agua al pecho, y un ejército que cruza en tres días mientras el enemigo llega por los dos lados.',dato:'Del 26 al 29 de noviembre los pontoneros del general Eblé levantaron dos puentes en el agua helada cerca de Borísov y el ejército cruzó entre dos ejércitos rusos. Se salvó el núcleo, pero miles de rezagados quedaron en la orilla. En francés, «Berézina» todavía quiere decir desastre.',escena:['nieve','puente','hielo']}],
vehiculo:{nombre:'La Grande Armée',tipo:'jinete',desc:'Más de medio millón de hombres de Francia, Polonia, Italia, Alemania y otros países, con unos 200 000 caballos y más de mil cañones, en columnas que se extendían por cientos de kilómetros. Comía de lo que encontraba por el camino, y en Rusia encontró poco.',zarpe:'Cruzás el Niemen con el ejército más grande de Europa.',llegada:'En diciembre vuelven a cruzar el Niemen unas decenas de miles, muchos sin armas; Napoleón ya está camino a París.',
puertos:[['En Vilna el ejército descansó dieciocho días y perdió miles de caballos por las tormentas.','pan y forraje'],['En Vítebsk esperó dos semanas una batalla que no llegó.','harina y carne'],['En Smolensk entró en una ciudad quemada y siguió adelante.','poco: la ciudad ardió'],['En Borodinó peleó un día entero y siguió hacia Moscú.','vendas y pólvora'],['En Moscú cargó lo que el fuego dejó y esperó cinco semanas.','pieles, vino y plata'],['En Maloyaroslávets perdió el camino del sur y volvió por el de Smolensk.','lo cargado en Moscú'],['En Krasny la retaguardia de Ney volvió con 800 hombres.','casi nada: el hambre'],['En el Berézina cruzó por dos puentes y dejó atrás los carros.','vendida']]},
companero:{nombre:'Ceniza',especie:'el caballo',emoji:'🐴',glifo:'caballo',hola:'¡Soy Ceniza, un caballo gris del ejército! Salimos cientos de miles y yo llevo la cuenta de los kilómetros. Este viaje es largo, y el invierno, más.',fin:'Vilna otra vez, con nieve. Yo llegué; muchos no. Contá vos la campaña entera, del Niemen al Berézina.',
paradas:['Días de tormenta y los caballos sin techo. Yo dormí bajo un carro. Aquí esperamos dieciocho días.','Ciudad vacía: los rusos se fueron de noche. El emperador dudó dos semanas. Nosotros, a comer avena.','Torres de muralla y humo. La ciudad ardió la noche de la batalla. Seguimos por el camino de Moscú.','Un día entero de cañones. Nunca oí nada igual. Al otro día, el camino a Moscú quedó abierto.','Una ciudad casi vacía y, de noche, el incendio. Cinco semanas esperando una carta que no llegó.','Un pueblo que cambió de manos varias veces en un día. Nos cerraron el camino nuevo: volvemos por el viejo.','Nieve, viento y veinte bajo cero. Ney cruzó el río de noche por el hielo. Yo, pegado a la columna.','Dos puentes de madera en el agua helada. Cruzamos en tres días. Del otro lado todavía falta Vilna.']},

eventos:[
{tramo:5,icono:'vela',titulo:'El incendio de Moscú',texto:'La noche de la entrada, el 14 de septiembre, empezaron incendios en varios barrios; con el viento, el fuego duró cuatro días y quemó unos dos tercios de una ciudad casi toda de madera. Napoleón tuvo que salir del Kremlin.',reto:'imagen',bien:'El viento cambia y el ejército encuentra dónde dormir.',mal:'El humo no deja ver; repasá la imagen y buscamos otro barrio.'},
{tramo:7,icono:'hielo',titulo:'El general Invierno',texto:'A principios de noviembre cayó la primera nevada y el frío bajó hasta cerca de veinte grados bajo cero. Los caballos sin herraduras de invierno resbalaban y caían; los hombres marchaban de noche para no congelarse.',reto:'ruta',bien:'La columna sigue junta y llega al pueblo.',mal:'Nos quedamos atrás en la nieve; repasá la ruta y alcanzamos la columna.'},
{tramo:8,icono:'puente',titulo:'Los puentes del Berézina',texto:'Los rusos habían quemado el puente de Borísov. Los pontoneros del general Eblé, con el agua helada hasta el pecho, levantaron dos puentes en Studienka en una noche; muy pocos de ellos sobrevivieron al invierno.',reto:'frase',bien:'Cruzamos por el puente antes de que se rompa.',mal:'El puente se rompió; repasá la frase y cruzamos por el otro.'}]},

inicio:{nombre:'A Coruña',fecha:'junio de 1799',nota:'Alexander von Humboldt y el botánico Aimé Bonpland zarparon de A Coruña el 5 de junio de 1799 en la corbeta Pizarro, con un permiso del rey de España para recorrer sus colonias que casi ningún extranjero tenía. Llevaban unos cuarenta instrumentos para medir todo: alturas, temperaturas, el azul del cielo, el magnetismo de la Tierra.',escena:['faro','muelle','barco']},
fin:{nombre:'Burdeos, de regreso',en:'Burdeos',fecha:'agosto de 1804',escena:['muelle','casas','barco']},
contexto:[
{clave:'entonces',titulo:'Un continente por medir',texto:'La América española estaba cerrada a los extranjeros, y de sus montañas, ríos y volcanes había más leyendas que medidas. Humboldt pagó el viaje con su herencia y consiguió del rey Carlos IV un pasaporte para ir a donde quisiera. En cinco años él y Bonpland midieron alturas y posiciones, coleccionaron unas 60 000 plantas y anotaron minas, climas, pueblos y cuentas de cada país.',pista:'Dos viajeros con permiso para entrar a un mundo cerrado, que en vez de conquistarlo lo miden y lo dibujan.'},
{clave:'hoy',titulo:'Lo que quedó',texto:'Humboldt dibujó el Chimborazo con las plantas ordenadas por pisos de altura, un modo de ver la naturaleza como un todo conectado que Darwin leyó de joven. Una corriente fría del Pacífico, un pingüino, un calamar, una cordillera y decenas de lugares llevan su nombre. Sus 34 tomos sobre el viaje y su «Cosmos» fueron de los libros más leídos del siglo XIX.',pista:'Un dibujo de una montaña con sus plantas por pisos, una corriente fría con nombre propio y un lector joven que después daría la vuelta al mundo.'}],
