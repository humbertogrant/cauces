{tramo:4,icono:"🌊",titulo:"Las seis cataratas",reto:"ruta",texto:"Entre Jartum y Asuán el río salta seis cataratas: piedras y rápidos que frenaban a los barcos y marcaban la frontera con Nubia. Para pasarlas hay que saber qué viene después.",bien:"Esquivás las piedras como un barquero nubio.",mal:"La falúa raspa una piedra y hay que remendarla en la orilla."}],
amazonas:[
{tramo:6,icono:"🌊",titulo:"La pororoca",reto:"frase",texto:"Cerca de la boca del río, con la marea, una ola llamada pororoca remonta el Amazonas contra la corriente. Agarrate fuerte y recitá la ruta entera para no perder el rumbo.",bien:"Pasás la ola con la frase en la boca.",mal:"La ola da vuelta las hamacas; salís empapado, pero entero."},
{tramo:2,icono:"🐟",titulo:"Pirañas",reto:"imagen",texto:"En las aguas quietas viven las pirañas, con dientes como navajas. No cazan gente: comen peces y lo que flota. Pero un banco rodea la canoa por curiosidad, y para que se vaya hay que contar algo de una ciudad que ya conocés.",bien:"Las pirañas se aburren y se van en bandada.",mal:"Una piraña muerde el remo, solo para probar; seguís con el remo mordido."}],
yangtse:[
{tramo:2,icono:"🪨",titulo:"Las Tres Gargantas",reto:"ruta",texto:"El río se mete entre paredes de roca en las Tres Gargantas. Hasta hace un siglo, cientos de sirgadores subían los juncos a pulso por aquí. Bajando, el timonel tiene que saber qué viene después.",bien:"El junco baja las gargantas derechito.",mal:"El junco da vueltas en un remolino; los sirgadores se ríen desde la orilla."},
{tramo:3,icono:"🌉",titulo:"El primer puente",reto:"frase",texto:"Hasta 1957 ningún puente cruzaba el Yangtsé: los trenes pasaban en ferry. El puente de Wuhan fue el primero, con dos pisos, uno para el tren y otro para los carros. Al pasar debajo, el capitán pide la frase del río.",bien:"Pasás bajo el puente con la frase entera.",mal:"Te distraés mirando el puente y das una vuelta de más."}],
misisipi:[
{tramo:3,icono:"🌫️",titulo:"Niebla en el río",reto:"ruta",texto:"Se cerró la niebla y no se ve la orilla. Los pilotos de vapor, como el joven Mark Twain, se sabían el río de memoria, banco por banco. Ahora te toca a vos.",bien:"Salís de la niebla justo frente al muelle.",mal:"El vapor encalla en un banco de arena y toca esperar a que suba el agua."},
{tramo:4,icono:"🌊",titulo:"La gran crecida de 1927",reto:"frase",texto:"En 1927 el río se salió de madre y cubrió unos 70 000 km²: pueblos enteros bajo el agua y cientos de miles de personas sin casa. Con la orilla perdida, el piloto recita la ruta entera para no salirse del cauce.",bien:"Seguís el cauce con la frase en la boca.",mal:"El vapor se mete a un campo inundado y toca esperar a que baje el agua."}],
danubio:[
{tramo:4,icono:"🛃",titulo:"El aduanero",reto:"pais",texto:"Pasando Passau el río entra en Austria. Un aduanero sube a la barcaza y pide los papeles: ¿adónde vas y en qué país queda?",bien:"Sella los papeles y te desea buen viaje.",mal:"Revisa la carga entera, lento, muy lento, antes de dejarte seguir."},
{tramo:9,icono:"⛰️",titulo:"Las Puertas de Hierro",reto:"frase",texto:"Río abajo de Belgrado el Danubio se aprieta entre montañas en las Puertas de Hierro, un cañón temido por los barqueros hasta que las presas lo domaron. El capitán recita la ruta entera para no perder la cuenta.",bien:"Pasás el cañón con la frase entera.",mal:"Un remolino te da tres vueltas; salís mareado, pero a flote."},
{tramo:8,icono:"🛃",titulo:"El segundo aduanero",reto:"pais",texto:"El Danubio cruza diez países, más que ningún otro río. Pasando Budapest sale de Hungría, y otro aduanero sube a bordo: ¿en qué país queda la próxima parada?",bien:"Sella los papeles y te pide un pan de la barcaza.",mal:"Cuenta cada bulto de la bodega, despacio, antes de dejarte seguir."}],
rin:[
{tramo:4,icono:"🧜",titulo:"La Lorelei",reto:"frase",texto:"En la garganta del Rin, sobre una roca alta, la leyenda pone a una mujer que canta y distrae a los capitanes hasta hacerlos chocar. Para no escucharla, cantá vos más fuerte: la frase del río.",bien:"Tu canción tapa la suya y la barcaza pasa la roca.",mal:"Te quedaste escuchando y la barcaza rozó la roca."},
{tramo:2,icono:"📐",titulo:"El río enderezado",reto:"imagen",texto:"Hasta 1817 el Rin daba mil vueltas por esta llanura; el ingeniero Tulla lo enderezó y lo acortó unos 80 km. Con tanta curva cortada, el barquero se confunde: contá algo de una ciudad que ya conocés para ubicarte.",bien:"Encontrás el cauce nuevo, derechito.",mal:"Te metés a un brazo viejo del río y hay que dar la vuelta."}],
ganges:[
{tramo:2,icono:"🌫️",titulo:"Niebla de invierno",reto:"mar",texto:"En invierno una niebla espesa cubre la llanura del Ganges durante días y las barcas no ven ni la proa. Solo sigue quien sabe adónde va el río.",bien:"Con el rumbo claro, remás derecho hasta que la niebla se abre.",mal:"Das vueltas en la niebla hasta que sale el sol."},
{tramo:3,icono:"🪔",titulo:"La Kumbh Mela",reto:"frase",texto:"Cada doce años, en la Kumbh Mela de Prayagraj, millones de peregrinos se bañan en la confluencia del Ganges y el Yamuna: la reunión de gente más grande del planeta. Con tanta multitud, el barquero pide la frase del río para no perderse.",bien:"Pasás la multitud recitando la ruta.",mal:"Te quedás atrapado entre los botes hasta que baja la gente."}],
volga:[
{tramo:3,icono:"🧊",titulo:"Viene el hielo",reto:"ruta",texto:"El Volga se congela cada invierno y la navegación se para por meses. Los burlaki apuran: hay que llegar antes de que el hielo cierre el río. ¿Sabés qué viene después?",bien:"La lodia llega con el primer hielo crujiendo detrás.",mal:"El hielo alcanza la lodia y toca esperar el deshielo."},
{tramo:4,icono:"🪢",titulo:"Los sirgadores",reto:"imagen",texto:"Hasta hace poco más de un siglo, cuadrillas de sirgadores arrastraban las barcazas río arriba con sogas, cantando para llevar el paso; un pintor, Repin, los hizo famosos. Una cuadrilla te pide una historia a cambio de un empujón: contá algo de una ciudad que ya conocés.",bien:"Los sirgadores te dan el empujón y siguen cantando.",mal:"Se ríen de tu historia y te dejan remar solo un rato."}],
tigris:[
{tramo:2,icono:"🛃",titulo:"La frontera",reto:"pais",texto:"El kelek cruza de Turquía a Irak. En el puesto de la frontera revisan los odres uno por uno y preguntan adónde vas y en qué país queda.",bien:"Sellan los papeles y el kelek sigue flotando.",mal:"Desinflan medio kelek para revisarlo y hay que volver a soplar los odres."},
{tramo:5,icono:"🌪️",titulo:"Tormenta de arena",reto:"ruta",texto:"Un viento del desierto levanta una pared de polvo que tapa el sol y la orilla; en Irak pasa varias veces al año. Para no perderse en la nube hay que saber qué viene después.",bien:"Salís de la nube justo frente al muelle.",mal:"La barca da vueltas en el polvo hasta que el viento se calma."}],
mekong:[
{tramo:4,icono:"🌊",titulo:"Los rápidos de Khone",reto:"ruta",texto:"Antes de Camboya el Mekong se despeña en las cataratas de Khone, las que frenaron a la expedición francesa de 1866. Hay que sacar la barca del agua y cargarla por tierra: ¿sabés qué sigue después?",bien:"Cargás la barca por la orilla y la volvés a botar río abajo.",mal:"La barca se te escapa en los rápidos y la rescatás río abajo, empapada."},
{tramo:5,icono:"🛶",titulo:"El mercado flotante",reto:"imagen",texto:"En el delta se compra y se vende desde los botes: el mercado flotante de Cai Rang, cerca de Can Tho, abre al amanecer, y cada bote cuelga en un palo alto lo que vende. Para que te vendan algo, contá algo de una ciudad que ya conocés.",bien:"Te venden un racimo de rambutanes y te abren paso.",mal:"Los botes te cierran el paso hasta que termina el mercado."}],
niger:[
{tramo:5,icono:"🦛",titulo:"Hipopótamos",reto:"imagen",texto:"Por aquí el río tiene manadas de hipopótamos, y una entera cerró el paso. Se apartan despacio si les contás la historia de una ciudad que ya conocés.",bien:"La manada se abre y la pinaza pasa por el medio.",mal:"Los hipopótamos ni se mueven; toca rodearlos por el barro."},
{tramo:6,icono:"🛃",titulo:"El puesto de la frontera",reto:"pais",texto:"El río sale de Níger y entra en Nigeria: dos países con nombre de río. En el puesto revisan la pinaza y preguntan adónde vas y en qué país queda.",bien:"Sello, sonrisa y a seguir.",mal:"Te tienen una hora al sol contando sacos de cacahuate."},
{tramo:3,icono:"🌫️",titulo:"El harmatán",reto:"ruta",texto:"De noviembre a marzo sopla el harmatán, un viento seco que trae el polvo del Sáhara y vuelve el cielo color de leche. Con la orilla borrada, hay que saber qué viene después.",bien:"Seguís el cauce con los ojos entrecerrados.",mal:"La piragua encalla en un banco de arena que no se veía."}],
parana:[
{tramo:4,icono:"🐊",titulo:"Un yacaré en el camalote",reto:"imagen",texto:"Con la crecida bajan islas flotantes de camalotes y a veces traen un yacaré dormido. El lanchón no puede rodearlas: contale bajito la historia de una ciudad que ya pasaste, para que no se despierte.",bien:"El yacaré ni abre un ojo y la isla se aparta.",mal:"El yacaré abre un ojo, bosteza, y hay que esperar a que la isla pase."},
{tramo:6,icono:"🌬️",titulo:"La sudestada",reto:"mar",texto:"Un viento del sureste empuja el agua del Río de la Plata contra la costa y el río sube y se mete en las calles de Buenos Aires. El práctico no zarpa hasta que le digás adónde va a dar este río.",bien:"Esperás a que amaine y salís con el río en calma.",mal:"La sudestada te deja pegado al muelle un día entero."}],
indo:[
{tramo:5,icono:"🏝️",titulo:"Bancos de arena",reto:"mar",texto:"En Sind el Indo cambia de cauce con cada crecida y deja bancos de arena donde ayer había agua. La barca encalló. Para salir hay que saber hacia dónde va el río.",bien:"Con la pértiga y el rumbo claro, la barca vuelve al agua honda.",mal:"Empujás la barca por la arena un buen rato hasta encontrar el canal."},
{tramo:4,icono:"🌧️",titulo:"El monzón de 2010",reto:"ruta",texto:"En 2010 las lluvias del monzón desbordaron el Indo y una quinta parte de Pakistán quedó bajo el agua. Con el río convertido en un mar, hay que saber qué viene después para no perderse.",bien:"Encontrás el cauce entre los campos inundados.",mal:"La barca se pierde en el agua ancha y das vueltas hasta ver un poblado."}],
tempisque:[
{tramo:3,icono:"🌧️",titulo:"La llena",reto:"ruta",texto:"En setiembre y octubre los aguaceros desbordan el Tempisque y el llano de Filadelfia queda bajo el agua: no se ve dónde termina el río y dónde empieza el potrero. Para no perderse hay que saber qué viene después.",bien:"El bongo encuentra el cauce entre los árboles y sigue.",mal:"Se meten a un potrero inundado y dan vueltas hasta que baja el agua."},
{tramo:6,icono:"🌊",titulo:"La marea del golfo",reto:"mar",texto:"Cerca de la boca el río sube y baja con la marea del golfo de Nicoya, y con la marea baja el bongo encalla en el barro entre los mangles. El bonguero pregunta adónde va a salir este río.",bien:"Salís con la marea alta, derechito al golfo.",mal:"El bongo se queda pegado en el barro hasta que la marea vuelve a subir."}],
reventazon:[
{tramo:4,icono:"🌊",titulo:"Los rápidos",reto:"frase",texto:"Entre Juan Viñas y Turrialba el Reventazón salta rápidos de clase III y IV, cada uno con su nombre. El guía grita la ruta entera para que remés a tiempo.",bien:"Pasás los rápidos empapado y gritando de gusto.",mal:"La balsa se da vuelta y salís nadando, con casco y todo, hasta la orilla."},
{tramo:5,icono:"🚂",titulo:"El tren del Atlántico",reto:"ruta",texto:"Junto al río, entre Turrialba y Siquirres, corría el ferrocarril al Atlántico. El maquinista te grita desde la vía: ¿sabés qué parada sigue después de la próxima?",bien:"El tren pita dos veces y te acompaña un rato por la orilla.",mal:"El tren se te adelanta y llegás a la parada cuando ya se fue."}],
sarapiqui:[
{tramo:2,icono:"🌧️",titulo:"El aguacero",reto:"imagen",texto:"En Sarapiquí caen más de 4 000 mm de lluvia al año y el río sube de golpe con un aguacero. Mientras escampa, bajo un chilamate, contá algo de una ciudad que ya conocés.",bien:"Escampa y el río, más alto, te lleva más rápido.",mal:"El aguacero dura toda la tarde; salís cuando ya oscurece."},
{tramo:5,icono:"⚔️",titulo:"Los vigías de 1856",reto:"mar",texto:"En 1856 los filibusteros de William Walker rondaban el San Juan y las tropas de Costa Rica vigilaban el Sarapiquí. Un vigía en la orilla pide la contraseña: adónde va a dar este río.",bien:"Te dejan pasar con un saludo militar.",mal:"Te hacen esperar en la orilla hasta que alguien te reconoce."}],
sanjuan:[
{tramo:3,icono:"🏰",titulo:"El raudal del Castillo",reto:"ruta",texto:"Frente al castillo el río salta el raudal del Diablo. Los vapores del Tránsito no podían pasarlo: los pasajeros bajaban, caminaban por la orilla y subían a otro vapor río abajo. El piloto te pregunta qué parada sigue después de la próxima.",bien:"Pasás el raudal con el castillo mirándote desde arriba.",mal:"El vapor se atraviesa en el raudal y hay que sacarlo a cables."},
{tramo:4,icono:"🛃",titulo:"La frontera",reto:"pais",texto:"Pasando El Castillo el río se vuelve frontera: la orilla derecha es Costa Rica y el agua es de Nicaragua. Un guardia sube al vapor y pregunta en qué país queda la próxima parada.",bien:"Sella el pasaporte y te desea buen viaje.",mal:"Revisa la bodega despacio, muy despacio, antes de dejarte seguir."}],
tarcoles:[
{tramo:3,icono:"🐴",titulo:"El camino de mulas",reto:"ruta",texto:"Por aquí bajaba el café en carretas y mulas hacia Puntarenas, y cruzaba el río Grande en una balsa. El arriero te pregunta qué parada sigue después de la próxima.",bien:"El arriero te deja pasar delante de sus mulas.",mal:"Las mulas se te cruzan y esperás un buen rato en la orilla."},
{tramo:5,icono:"🐊",titulo:"Los cocodrilos del puente",reto:"imagen",texto:"Debajo del puente de la carretera toman el sol decenas de cocodrilos. Uno se cruza delante de la lancha y no tiene apuro. Mientras se aparta, contá algo de una ciudad que ya conocés.",bien:"El cocodrilo se hunde despacio y la lancha pasa.",mal:"El cocodrilo bosteza y se queda un rato; esperás a que se vaya."}],
terraba:[
{tramo:4,icono:"🎭",titulo:"Los diablitos",reto:"frase",texto:"En Boruca, cada fin de año, los diablitos con máscara pelean tres días contra el toro, que son los españoles, y al final ganan. Un diablito te cierra el paso y pide la frase del río.",bien:"El diablito baila y te deja pasar.",mal:"El diablito te persigue un rato por la orilla, riéndose."},
{tramo:5,icono:"⚪",titulo:"Las esferas",reto:"imagen",texto:"En Palmar la compañía bananera encontró esferas de piedra casi perfectas, algunas de más de dos metros y varias toneladas, hechas hace más de mil años. Nadie sabe para qué. Para pasar entre ellas, contá algo de una ciudad que ya conocés.",bien:"Pasás entre las esferas sin tocar ninguna.",mal:"Rozás una esfera y rueda un poquito; nadie lo vio."}]
};

function escena(items,cls){if(!items||!items.length)return '';const n=items.length,w=240/n;
  const partes=items.map((k,i)=>{const p=picto(k);if(!p)return '';const x=(i+0.5)*w;return p.vb[0]==='-'?`<g class="animal" transform="translate(${x.toFixed(1)} 55) scale(1.1)">${ANIMALES[k.split(':')[1]]}</g>`:`<g transform="translate(${(x-20).toFixed(1)} 28)">${p.svg}</g>`}).join('');
  return `<svg class="escena${cls?' '+cls:''}" viewBox="0 0 240 80" aria-hidden="true"><rect class="cielo" width="240" height="80"/><circle class="d" cx="222" cy="14" r="6"/><rect class="suelo" y="66" width="240" height="6"/><rect class="agua" y="72" width="240" height="8"/>${partes}</svg>`}

let animB=null;
function animarBarca(poly,t0,t1,px){const g=document.getElementById('barca'),m=document.getElementById('masc');if(!g)return;if(animB)cancelAnimationFrame(animB);
  const poner=p=>{let ang=p.ang,sx=1;if(Math.cos(ang*Math.PI/180)<0){ang=ang-180;sx=-1}g.setAttribute('transform',`translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${ang.toFixed(1)}) scale(${sx} 1)`);if(m)m.setAttribute('transform',`rotate(${(-ang*sx).toFixed(1)}) scale(${px.toFixed(4)})`)}/* derecho y mirando hacia adelante: se anula el giro, no el espejo */;
  if(poly.length<2){poner({x:poly[0][0],y:poly[0][1],ang:0});return}
  const L=[0];for(let i=1;i<poly.length;i++)L[i]=L[i-1]+Math.hypot(poly[i][0]-poly[i-1][0],poly[i][1]-poly[i-1][1]);const tot=L[L.length-1]||1;
  const pos=t=>{const s=t*tot;let i=1;while(i<L.length-1&&L[i]<s)i++;const a=poly[i-1],b=poly[i],u=(L[i]-L[i-1])?(s-L[i-1])/(L[i]-L[i-1]):0;return{x:a[0]+(b[0]-a[0])*u,y:a[1]+(b[1]-a[1])*u,ang:Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI,i}};
  const estela=document.getElementById('estela'),capa=document.getElementById('capa');
  const dibujarEstela=p=>{if(!estela)return;const pts=t1>=t0?poly.slice(0,p.i).concat([[p.x,p.y]]):[[p.x,p.y]].concat(poly.slice(p.i));estela.setAttribute('d','M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L'))};
  const salpicar=p=>{if(!capa||!capa.insertAdjacentHTML)return;capa.insertAdjacentHTML('beforeend',`<g class="salpicon" transform="translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) scale(${px.toFixed(4)})"><g class="sal"><circle r="4"/><circle cx="-5" cy="-2" r="1.5"/><circle cx="5" cy="-2" r="1.5"/><circle cy="-5" r="1.2"/></g></g>`);setTimeout(()=>{const s=capa.querySelector('.salpicon');if(s)s.remove()},1000)};
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(t0===t1||reduce){poner(pos(t1));return}
  const T=performance.now(),dur=1400;
  const step=now=>{let k=Math.min(1,(now-T)/dur);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;const p=pos(t0+(t1-t0)*k);poner(p);dibujarEstela(p);if(k<1)animB=requestAnimationFrame(step);else{animB=null;if(estela)estela.setAttribute('class','estela fin');salpicar(p)}};
  animB=requestAnimationFrame(step)}
