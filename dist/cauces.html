<style>

#svg{width:100%;height:100%;display:block}
#tierra{fill:var(--tierra)}

.etq.relieve{fill:var(--verde-claro);fill-opacity:.85;font-weight:600;letter-spacing:.16em;text-transform:uppercase}

.pico{fill:var(--dorado);stroke:var(--mar)}
#perfil{background:var(--mar);border-top:1px solid rgba(100,200,170,.25)}

.perfil-tierra{fill:var(--tierra);stroke:var(--verde-claro);stroke-width:1.5;stroke-linejoin:round}

.luz,.clima{position:absolute;inset:0;pointer-events:none}
.luz{opacity:0;transition:opacity 1.2s ease}

.clima{opacity:0;transition:opacity .8s ease}
.clima[data-clima="niebla"]{opacity:1;background:repeating-linear-gradient(100deg,rgba(255,255,255,.3) 0 70px,rgba(255,255,255,.06) 70px 160px);animation:deriva 16s linear infinite}
.clima[data-clima="arena"]{opacity:1;background:repeating-linear-gradient(115deg,rgba(232,185,82,.38) 0 3px,rgba(166,71,46,.2) 3px 9px);animation:deriva 2.2s linear infinite}

.sellos{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 6px}
.pas-rio{border-bottom:1px solid var(--grid);padding:10px 0 12px}
.pas-cab{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:500 20px var(--tit);color:var(--verde)}

{nombre:"Jinja",pais:"Uganda",pos:[0.42,33.2],escena:["presa","cataratas","selva"],imagen:"Un jinete salta a caballo desde el lago Victoria: aquí nace el Nilo Blanco (Jinja suena a jinete).",dato:"En Jinja el Nilo Blanco sale del lago Victoria. Las cataratas Ripon, la «fuente» que Speke identificó en 1862, quedaron bajo la represa de Owen Falls (1954)."},
{nombre:"Juba",pais:"Sudán del Sur",pos:[4.85,31.58],escena:["muelle","casas","pantano"],imagen:"Un país recién nacido con chupón: Juba es la capital de Sudán del Sur, el Estado más joven del mundo (2011).",dato:"Puerto sobre el Bahr al-Jabal, el «río de la montaña», nombre local del Nilo Blanco. Río abajo empieza el Sudd, un pantano del tamaño de Costa Rica que evapora la mitad del agua."},
{nombre:"Jartum",pais:"Sudán",pos:[15.6,32.5],escena:["mezquita","casas","piramide"],imagen:"Dos jarras, una de agua blanca y otra azul, se vacían en el mismo cauce: Jartum es la confluencia del Nilo Blanco y el Nilo Azul.",dato:"Al frente, Omdurmán, la capital del Mahdi. Río abajo, las pirámides de Meroe, capital del reino de Kush, que llegó a gobernar Egipto entero (dinastía XXV)."},
{nombre:"Asuán",pais:"Egipto",pos:[24.09,32.9],escena:["presa","duna","templo"],imagen:"Una aduana en el río: Asuán (a-duana) fue la frontera sur de Egipto en la primera catarata, y hoy la presa es la aduana del agua.",dato:"La Presa Alta (1970) creó el lago Nasser, de 500 km de largo. Abu Simbel fue cortado en bloques y subido 65 m para salvarlo del agua."},
{nombre:"Luxor",pais:"Egipto",pos:[25.7,32.64],escena:["templo","obelisco","palmera"],imagen:"Lujo (lux) de faraones: Luxor es la antigua Tebas, con Karnak en la orilla de los vivos y el Valle de los Reyes en la de los muertos.",dato:"Capital del Imperio Nuevo (c. 1550-1070 a. C.). La orilla este, donde sale el sol, era de los templos; la oeste, del ocaso, de las tumbas: Tutankamón apareció allí en 1922."},
{nombre:"El Cairo",pais:"Egipto",pos:[30.04,31.24],escena:["piramide","mezquita","rascacielos"],imagen:"El río cae (Cai-ro) en un abanico: aquí el Nilo se abre en el delta, la letra griega Δ que dio nombre a todos los deltas.",dato:"Fundada en 969 por los fatimíes junto a la antigua Menfis y las pirámides de Guiza. Es la mayor ciudad de África, con más de 20 millones de personas en su área metropolitana."}

{id:"amazonas",nombre:"Amazonas",continente:"América del Sur",escenaNace:["nieve","montaña","lago"],escenaMar:["manglar","barco","faro"],longitud:6400,mar:"Océano Atlántico (delta de Marajó)",marEn:"el Atlántico",
nace:"Andes del Perú",naceNota:"Su fuente más lejana suele situarse en el nevado Mismi, aunque se discute; el Ucayali y el Marañón forman el Amazonas cerca de Nauta. Por caudal es, de lejos, el mayor río del mundo: un quinto del agua dulce que llega a los océanos.",
antigua:"Antes de Colón la selva no estaba vacía: la «terra preta» (suelo negro fabricado por humanos) y la cerámica marajoara de la desembocadura revelan sociedades densas. En 1542 Francisco de Orellana bajó desde los Andes hasta el Atlántico, el primer europeo en cruzar el continente por agua, y bautizó el río por las guerreras que creyó ver: las amazonas de la mitología griega.",
moderna:"El auge del caucho (1879-1912) construyó el Teatro Amazonas de Manaos y la Casa de Fierro de Iquitos, y se derrumbó cuando las semillas robadas florecieron en Malasia. Hoy el río es la Zona Franca de Manaos (1967), el corredor de soya que sale por Santarém y la disputa mundial por la deforestación; Belém fue sede de la COP30 en 2025.",
pistaAntigua:"Un conquistador bajó todo el río en 1542 y lo bautizó por unas guerreras de la mitología griega.",
pistaModerna:"Un auge del caucho levantó un teatro de ópera en plena selva; se derrumbó cuando las semillas robadas florecieron en Asia.",

ciudades:[
{nombre:"Iquitos",pais:"Perú",pos:[-3.75,-73.25],escena:["selva","muelle","casas","animal:delfin"],imagen:"Un taxi flotante: a Iquitos no llega ninguna carretera. Es la ciudad grande más aislada del mundo; solo se entra por río o por aire.",dato:"Puerto principal de la Amazonía peruana, a 3 700 km del Atlántico y todavía navegable para barcos de calado oceánico. Del auge cauchero quedó la Casa de Fierro."},
{nombre:"Leticia",pais:"Colombia",pos:[-4.21,-69.94],escena:["selva","casas","balsa"],imagen:"Tres vecinas se dan la mano en una esquina: Leticia se toca con Tabatinga (Brasil) y Santa Rosa (Perú) en la triple frontera.",dato:"Único puerto de Colombia sobre el Amazonas: se cruza a Brasil caminando y a Perú en lancha. En Brasil el río pasa a llamarse Solimões hasta Manaos."},

{nombre:"Santarém",pais:"Brasil",pos:[-2.44,-54.7],escena:["grua","barco","selva"],imagen:"Un santo con un camión lleno de soya: Santarém es el puerto por donde la soya del centro de Brasil sale al mundo.",dato:"Confluencia con el Tapajós, de aguas verdes y playas de arena blanca. La terminal de Cargill (2003) conectó el río con la carretera BR-163 y la frontera agrícola."},

{id:"yangtse",nombre:"Yangtsé",continente:"Asia",escenaNace:["nieve","montaña","hielo"],escenaMar:["barco","faro","grua"],longitud:6300,mar:"Mar de China Oriental",marEn:"el mar de China Oriental",
nace:"Meseta tibetana",naceNota:"Baja de los montes Tanggula a más de 5 000 m; en su tramo alto se llama Jinsha, «arenas doradas». Es el río más largo de Asia y el tercero del mundo.",
antigua:"El Yangtsé es la frontera natural entre el norte del trigo y el sur del arroz. En el año 208, en los Acantilados Rojos cerca de Wuhan, una flota pequeña incendió la de Cao Cao y partió a China en Tres Reinos. Cuatro siglos después la dinastía Sui abrió el Gran Canal para llevar el arroz del sur hasta el norte: el Yangtsé pasó a ser el granero del imperio.",
moderna:"La presa de las Tres Gargantas (Yichang, terminada en 2012) es la central hidroeléctrica más grande del mundo y desplazó a 1,3 millones de personas. El delta, con Shanghái a la cabeza, produce cerca de un cuarto del PIB de China, y Chongqing, río arriba, es una de las ciudades más pobladas del planeta.",

antigua:"Cerca de San Luis, Cahokia fue hacia el año 1100 la ciudad más grande al norte de México, con un montículo de tierra más ancho que la Gran Pirámide. De Soto cruzó el río en 1541 y La Salle lo bajó hasta el golfo en 1682 para reclamar «Luisiana» en nombre de Luis XIV: los franceses lo usaron como carretera de pieles desde Canadá.",
moderna:"La Compra de Luisiana (1803) le dio a Estados Unidos el río entero y duplicó el país. Los vapores de Mark Twain dieron paso a las barcazas: por aquí sale cerca del 60 % del grano que exporta Estados Unidos, con esclusas desde Mineápolis y puertos hasta Nueva Orleans. El Old River Control impide que el río se escape por el Atchafalaya.",
pistaAntigua:"Junto a este río, una ciudad de montículos de tierra fue hacia 1100 la mayor de su continente al norte de México.",
pistaModerna:"Por este río sale más de la mitad del grano que exporta su país; una obra de ingeniería impide que cambie de cauce.",

antigua:"Durante cuatro siglos el Danubio fue el limes, la frontera del Imperio romano: Vindobona (Viena), Aquincum (Budapest) y Singidunum (Belgrado) nacieron como campamentos de legiones. Por el río bajaron las cruzadas hacia Constantinopla y por él subieron los otomanos hasta las puertas de Viena, en 1529 y 1683.",
moderna:"El canal Rin-Meno-Danubio (1992) permite que una barcaza vaya de Rotterdam al mar Negro sin tocar el mar. Las presas de las Puertas de Hierro (Serbia-Rumanía) lo represan en su cañón, y el delta, patrimonio de la humanidad, es el mayor humedal de Europa.",
pistaAntigua:"Fue la frontera del Imperio romano durante siglos; tres capitales actuales nacieron como campamentos de legiones en su orilla.",
pistaModerna:"Un canal de 1992 permite que una barcaza vaya del mar del Norte al mar Negro por su cauce.",
frase:"[U]n [R]ey [P]asó [L]ento por la [V] y las tres [B]",fraseNota:"La V y las tres B son las cuatro capitales: Viena, Bratislava, Budapest, Belgrado.",

ciudades:[
{nombre:"Ulm",pais:"Alemania",pos:[48.4,9.99],escena:["iglesia","casas","puente"],imagen:"Una U con un campanario dentro: la catedral de Ulm tuvo durante más de un siglo la torre de iglesia más alta del mundo (161 m).",dato:"Aquí empieza la navegación histórica: las «cajas de Ulm» eran barcazas de un solo viaje que bajaban colonos hasta Viena y se vendían como madera. Einstein nació en Ulm."},
{nombre:"Ratisbona",pais:"Alemania",pos:[49.01,12.1],escena:["puente","iglesia","casas"],imagen:"Una rata cruza un puente de piedra medieval: el Puente de Piedra de Ratisbona (1146) fue durante siglos el único sobre el Danubio.",dato:"Castra Regina para los romanos; sede de la Dieta Perpetua del Sacro Imperio (1663-1806). Su centro medieval está intacto."},
{nombre:"Passau",pais:"Alemania",pos:[48.57,13.46],escena:["puente","iglesia","montaña"],imagen:"Tres ríos se hacen un pase: en Passau confluyen el Inn (verde), el Ilz (negro) y el Danubio (azul).",dato:"La «ciudad de los tres ríos», en la frontera con Austria. El Inn trae aquí más agua que el propio Danubio."},
{nombre:"Linz",pais:"Austria",pos:[48.3,14.29],escena:["fabrica","iglesia","casas"],imagen:"Una tarta Linzer con enrejado de masa: el enrejado son los puentes de Linz.",dato:"Ciudad industrial del acero y ciudad de Bruckner. La Linzer Torte es una de las tartas más antiguas con receta escrita (1653)."},
{nombre:"Viena",pais:"Austria",pos:[48.21,16.37],escena:["iglesia","castillo","puente"],imagen:"Un vals sobre el agua: «El Danubio azul» de Strauss, aunque en Viena el río es café.",dato:"Vindobona romana; según la tradición, Marco Aurelio murió aquí en 180. Capital de los Habsburgo; los otomanos la sitiaron en 1529 y 1683 y no pasaron."},
{nombre:"Bratislava",pais:"Eslovaquia",pos:[48.15,17.11],escena:["castillo","puente","casas"],imagen:"Dos hermanos (brat) a 60 km: Bratislava y Viena son dos de las capitales más cercanas del mundo.",dato:"Presburgo para austriacos y húngaros; aquí se coronaron los reyes de Hungría durante 250 años. Un castillo blanco vigila el río."},
{nombre:"Budapest",pais:"Hungría",pos:[47.5,19.04],escena:["castillo","puente","iglesia"],imagen:"Buda arriba en la colina, Pest abajo en el llano y el río en medio: dos ciudades unidas en 1873, con el Puente de las Cadenas entre ellas.",dato:"Aquincum romana; baños termales sobre fallas geológicas; el Parlamento neogótico mira al río. Ocupada por los otomanos durante 145 años."},
{nombre:"Belgrado",pais:"Serbia",pos:[44.82,20.46],escena:["castillo","puente","casas"],imagen:"La ciudad blanca (beo-grad) donde el Sava entra: la fortaleza de Kalemegdan vigila la confluencia.",dato:"Singidunum romana; destruida y reconstruida decenas de veces por estar en la frontera entre imperios. Río abajo el Danubio se estrecha en las Puertas de Hierro."}
]},
{id:"rin",nombre:"Rin",continente:"Europa",escenaNace:["nieve","montaña","lago"],escenaMar:["barco","faro","grua"],longitud:1230,mar:"Mar del Norte",marEn:"el mar del Norte",
nace:"Alpes suizos",naceNota:"Baja de los Grisones, cruza el lago de Constanza y salta las cataratas de Schaffhausen, las más caudalosas de Europa.",
antigua:"El Rin fue la otra frontera del Imperio romano: Colonia, Maguncia y Coblenza empezaron como campamentos. En la Edad Media los barones de la garganta del Rin, entre Maguncia y Coblenza, cobraban peaje desde sus castillos, y la leyenda de Lorelei explicaba los naufragios. En Maguncia, hacia 1455, Gutenberg imprimió la primera Biblia.",
moderna:"Es la vía fluvial más transitada de Europa: Rotterdam es el mayor puerto del continente y Duisburgo el mayor puerto interior. Tulla lo enderezó en el siglo XIX y la Convención de Mannheim (1868) garantizó la navegación libre. Las sequías de 2018 y 2022 lo dejaron tan bajo que las barcazas viajaron casi vacías.",
pistaAntigua:"Junto a este río, un orfebre inventó la imprenta de tipos móviles hacia 1450.",
pistaModerna:"La vía fluvial más transitada de Europa; su mayor puerto marítimo y su mayor puerto interior están en el mismo cauce.",
frase:"[B]asilea [E]nvía [M]ercancía por [C]oblenza y [C]olonia a [D]uisburgo y [R]otterdam",fraseNota:"La frase es, literalmente, la ruta comercial moderna.",

{nombre:"Basilea",pais:"Suiza",pos:[47.56,7.59],escena:["fabrica","puente","casas"],imagen:"El río dobla en un codo de 90°: en Basilea (la base) el Rin gira al norte y Suiza tiene su único puerto.",dato:"Trifinio Suiza-Alemania-Francia. Sede de Novartis, Roche y el Banco de Pagos Internacionales, el «banco de los bancos centrales»."},
{nombre:"Estrasburgo",pais:"Francia",pos:[48.57,7.75],escena:["iglesia","casas","puente"],imagen:"Una ciudad de calles (Strasse-burg) que cambió de país cinco veces: Estrasburgo es hoy sede del Parlamento Europeo.",dato:"Catedral gótica de arenisca rosada; Gutenberg vivió aquí antes de Maguncia. Francesa, alemana (1871), francesa (1918), alemana (1940), francesa (1944)."},
{nombre:"Maguncia",pais:"Alemania",pos:[50.0,8.27],escena:["iglesia","casas","barco"],imagen:"Letras de plomo flotando en el río: en Maguncia Gutenberg imprimió la Biblia de 42 líneas hacia 1455.",dato:"Confluencia con el Meno, de donde sale el canal hacia el Danubio. Mogontiacum romana; sede del arzobispo elector más poderoso del Sacro Imperio."},
{nombre:"Coblenza",pais:"Alemania",pos:[50.36,7.6],escena:["castillo","puente","montaña"],imagen:"La confluencia (Confluentes): en la Esquina Alemana el Mosela entra al Rin bajo una estatua ecuestre.",dato:"Entre Maguncia y Coblenza está la garganta del Rin, patrimonio de la humanidad, con 40 castillos y la roca de Lorelei."},
{nombre:"Colonia",pais:"Alemania",pos:[50.94,6.96],escena:["iglesia","puente","tren"],imagen:"Dos torres góticas y un frasco de perfume: la catedral de Colonia (157 m) y el agua de colonia (1709).",dato:"Colonia Claudia Ara Agrippinensium, fundada como colonia romana en el año 50. La catedral tardó 632 años en terminarse (1248-1880)."},
{nombre:"Duisburgo",pais:"Alemania",pos:[51.43,6.76],escena:["grua","fabrica","barco"],imagen:"Un garaje de grúas: Duisburgo es el mayor puerto interior de Europa, la puerta del Ruhr.",dato:"Confluencia con el Ruhr; terminal de los trenes de carga que llegan desde China por la nueva Ruta de la Seda."},
{nombre:"Rotterdam",pais:"Países Bajos",pos:[51.92,4.48],escena:["grua","barco","rascacielos"],imagen:"El río se rinde al mar en un puerto de 40 km: Rotterdam, el mayor de Europa.",dato:"Delta del Rin y el Mosa. Arrasada por bombardeos en 1940 y reconstruida en vidrio y acero; gran parte de la ciudad está bajo el nivel del mar."}
]},
{id:"ganges",nombre:"Ganges",continente:"Asia",escenaNace:["nieve","montaña","cataratas"],escenaMar:["manglar","pantano","barco"],longitud:2525,mar:"Bahía de Bengala",marEn:"la bahía de Bengala",
nace:"Glaciar Gangotri",naceNota:"Sale de una cueva de hielo llamada Gaumukh, «boca de vaca», a 4 000 m en el Himalaya. Con el Brahmaputra forma el delta más grande del mundo.",
antigua:"La llanura del Ganges fue el corazón de los imperios Maurya y Gupta, gobernados desde Pataliputra (Patna); Ashoka extendió el budismo desde aquí después de que Buda diera su primer sermón en Sarnath, junto a Benarés. Es el río sagrado del hinduismo: bañarse en él borra el karma, y la Grand Trunk Road, la carretera más antigua de Asia, corre paralela a su orilla.",
moderna:"Más de 400 millones de personas viven en su cuenca y es uno de los ríos más contaminados del mundo; el programa Namami Gange (2014) intenta limpiarlo. La presa de Farakka (1975) desvía agua hacia Calcuta y enfrenta a India con Bangladés; el delta de los Sundarbans se hunde con el nivel del mar.",
pistaAntigua:"Un emperador difundió el budismo desde una capital en su orilla; el primer sermón del Buda ocurrió a pocos kilómetros del río.",
pistaModerna:"Una presa de 1975 desvía su agua hacia un puerto y enfrenta a dos países; su delta es el mayor del mundo.",
frase:"[H]oy [K]arma [P]uro [B]endice [P]eregrinos [C]ansados",

ciudades:[
{nombre:"Haridwar",pais:"India",pos:[29.95,78.16],escena:["templo","casas","montaña"],imagen:"Una puerta (dwar) en la montaña: en Haridwar el Ganges sale del Himalaya a la llanura y los peregrinos entran.",dato:"«Puerta de Hari» (Vishnu). Uno de los cuatro lugares del Kumbh Mela; cada atardecer se sueltan lámparas al río en el ghat de Har Ki Pauri."},
{nombre:"Kanpur",pais:"India",pos:[26.45,80.33],escena:["fabrica","puente","casas"],imagen:"Un can (perro) con zapatos de cuero: Kanpur es la capital del cuero de la India, y sus curtidurías tiñen el río.",dato:"Ciudad industrial de la era británica (Cawnpore); escenario del sitio de 1857 durante la rebelión de los cipayos."},
{nombre:"Prayagraj",pais:"India",pos:[25.44,81.85],escena:["templo","mercado","puente"],imagen:"Tres trenzas de agua: el Ganges, el Yamuna y el invisible Saraswati se unen en Prayagraj, y cada doce años se reúne allí la mayor multitud del planeta.",dato:"Antes Allahabad. El Kumbh Mela de 2025 congregó a cientos de millones de personas en pocas semanas. Cuna de Nehru."},
{nombre:"Benarés",pais:"India",pos:[25.32,83.0],escena:["templo","casas","balsa"],imagen:"Escaleras (ghats) que bajan al agua y fuego al amanecer: en Benarés se vive, se reza y se crema junto al río.",dato:"Varanasi es una de las ciudades habitadas más antiguas del mundo. A 10 km, en Sarnath, Buda predicó por primera vez."},
{nombre:"Patna",pais:"India",pos:[25.6,85.14],escena:["casas","puente","campos"],imagen:"Ashoka planta su pata en Pataliputra: Patna fue la capital de los imperios Maurya y Gupta.",dato:"Hacia el 300 a. C. Pataliputra fue una de las mayores ciudades del mundo; el griego Megástenes la describió como embajador."},
{nombre:"Calcuta",pais:"India",pos:[22.57,88.36],escena:["puente","rascacielos","grua"],imagen:"La última puerta antes del mar: Calcuta, capital del Raj británico hasta 1911, sobre el Hooghly, brazo del delta.",dato:"Kolkata creció desde una factoría de la Compañía de las Indias (1690). El puente Howrah cruza el Hooghly; río abajo, los manglares de los Sundarbans y sus tigres."}
]},
{id:"volga",nombre:"Volga",continente:"Europa",escenaNace:["arbol","lago","pantano"],escenaMar:["pantano","aves","barco"],longitud:3530,mar:"Mar Caspio",marEn:"el mar Caspio",
nace:"Colinas de Valdái",naceNota:"Nace en un pantano a 228 m sobre el mar y termina en un mar cerrado, el Caspio, 28 m bajo el nivel del océano. Es el río más largo de Europa.",
antigua:"Entre los siglos VIII y XI la «ruta del Volga» llevó a los vikingos varegos con pieles y esclavos hasta los jázaros y el califato; las monedas de plata árabes que se desentierran en Suecia vinieron por aquí. Los mongoles fundaron Sarái, capital de la Horda de Oro, junto a la desembocadura. Iván el Terrible tomó Kazán (1552) y Astracán (1556), y Moscú se quedó con el río entero.",
moderna:"El canal Volga-Don (1952) y el Volga-Báltico hicieron de Moscú un «puerto de cinco mares». Una cascada de presas convirtió el río en una cadena de embalses. Stalingrado (Volgogrado, 1942-1943) fue el giro de la Segunda Guerra Mundial. Hoy el Caspio baja de nivel y el esturión del caviar casi desapareció.",

{nombre:"Tver",pais:"Rusia",pos:[56.86,35.9],escena:["iglesia","casas","puente"],imagen:"Ver el río recién nacido: en Tver el Volga todavía cabe bajo un puente corto.",dato:"Rival de Moscú en el siglo XIV; hoy ciudad de paso entre Moscú y San Petersburgo. Río arriba, en Valdái, el Volga nace en un pantano."},
{nombre:"Yaroslavl",pais:"Rusia",pos:[57.63,39.87],escena:["iglesia","castillo","casas"],imagen:"Un príncipe mata un oso con un hacha: Yaroslavl lleva ese oso en su escudo desde su fundación (1010).",dato:"Parte del Anillo de Oro; su centro es patrimonio de la humanidad. Aquí el Volga gira hacia el sureste."},
{nombre:"Nizhni Nóvgorod",pais:"Rusia",pos:[56.33,44.0],escena:["castillo","puente","casas"],imagen:"La feria donde Oriente y Occidente regateaban: en Nizhni Nóvgorod el Oká entra al Volga y la gran feria del siglo XIX fijaba el precio del té y las pieles.",dato:"Kremlin de ladrillo rojo sobre la confluencia. Fue Gorki en la era soviética, ciudad cerrada; Sájarov vivió aquí su exilio."},

{nombre:"Samara",pais:"Rusia",pos:[53.2,50.15],escena:["fabrica","presa","casas"],imagen:"Un anzuelo gigante: en la Curva de Samara el río rodea unas montañas y casi vuelve sobre sí mismo.",dato:"Capital de reserva de la URSS en 1941, con búnker para Stalin. Cuna de los cohetes Soyuz."},
{nombre:"Volgogrado",pais:"Rusia",pos:[48.7,44.5],escena:["obelisco","fabrica","presa"],imagen:"Una mujer de 85 m alza una espada sobre el río: la Madre Patria de Mamáyev Kurgán, donde se decidió Stalingrado.",dato:"La batalla (agosto de 1942 a febrero de 1943) fue la más sangrienta de la guerra. Aquí el canal Volga-Don enlaza con el mar de Azov."},
{nombre:"Astracán",pais:"Rusia",pos:[46.35,48.04],escena:["castillo","barco","pantano"],imagen:"Un gorro de astracán y una lata de caviar: en el delta, el río se deshace en cientos de brazos antes del Caspio.",dato:"Antiguo puerto jázaro y tártaro, tomada en 1556. Puerta de Persia e India para los mercaderes rusos; el delta es la reserva del esturión."}
]},
{id:"tigris",nombre:"Tigris",continente:"Asia",escenaNace:["montaña","nieve","campos"],escenaMar:["barco","palmera","faro"],longitud:1900,mar:"Golfo Pérsico (Shatt al-Arab)",marEn:"el golfo Pérsico",
nace:"Montes Tauro",naceNota:"Nace en el este de Turquía, a pocos kilómetros del Éufrates, su gemelo; los dos se juntan en Al-Qurna y forman el Shatt al-Arab. Entre ambos: Mesopotamia.",
antigua:"Mesopotamia, «entre ríos», es donde Sumer inventó la escritura (Uruk, hacia 3300 a. C.), la rueda y la ciudad. Asiria gobernó desde Nínive, frente a Mosul; los partos y sasánidas desde Ctesifonte. En 762 el califa Al-Mansur fundó Bagdad, la ciudad redonda: en el siglo IX era la mayor del mundo y en su Casa de la Sabiduría se tradujo a Aristóteles. En 1258 los mongoles la saquearon y, dice la leyenda, el Tigris corrió negro de tinta.",
moderna:"Las presas turcas del proyecto GAP (Ilısu, 2020) reducen el caudal que llega a Irak, y la presa de Mosul, construida sobre yeso soluble, es considerada la más peligrosa del mundo. Saddam drenó los pantanos del sur en los años noventa; se están recuperando. Basora exporta la mayor parte del petróleo iraquí por el Shatt al-Arab. Su gemelo, el Éufrates, pasa por Raqqa, Faluya y las ruinas de Babilonia y Ur.",
pistaAntigua:"Una ciudad redonda fundada en 762 en su orilla fue la mayor del mundo; siglos después una biblioteca entera terminó en sus aguas.",
pistaModerna:"Una presa río arriba, construida sobre yeso, es considerada la más peligrosa del mundo; otro país controla su caudal.",
frase:"[D]os [M]ercaderes [T]raen [S]edas a [B]agdad y [B]asora",

{id:"mekong",nombre:"Mekong",continente:"Asia",escenaNace:["nieve","montaña","hielo"],escenaMar:["manglar","barco","campos"],longitud:4350,mar:"Mar de China Meridional",marEn:"el mar de China Meridional",
nace:"Meseta tibetana",naceNota:"En China se llama Lancang; recorre seis países, más que ningún otro río de Asia.",
antigua:"En el delta, el reino de Funan (siglos I-VI) comerciaba con Roma y la India desde el puerto de Óc Eo, donde aparecieron monedas romanas. El Imperio jemer de Angkor vivió del pulso del Tonlé Sap: cada monzón ese afluente invierte su curso y llena el lago de agua y peces. La expedición francesa de 1866-1868 buscó por aquí una ruta comercial a China y fracasó ante los rápidos de Khone.",
moderna:"China construyó once presas en el Lancang y Laos, la «batería de Asia», exporta hidroelectricidad (Xayaburi, 2019); juntas alteran el pulso del que dependen millones de pescadores. El delta produce cerca de la mitad del arroz de Vietnam, pero se hunde y se saliniza. Seis países y una Comisión del Río Mekong (1995) en la que China no participa.",
pistaAntigua:"Un imperio de templos vivía de un lago que se llena porque un afluente de este río invierte su curso cada monzón.",
pistaModerna:"Su delta produce cerca de la mitad del arroz de un país, pero once presas río arriba, en otro país, alteran su pulso.",
frase:"Un [J]unco [L]ento [V]iaja [P]or [C]amboya",

{id:"niger",nombre:"Níger",continente:"África",escenaNace:["montaña","selva","arbol"],escenaMar:["manglar","barco","fabrica"],longitud:4200,mar:"Golfo de Guinea",marEn:"el golfo de Guinea",
nace:"Tierras altas de Guinea",naceNota:"Nace a solo 240 km del Atlántico, pero le da la espalda: corre hacia el Sáhara, gira en Gao y baja hasta el golfo de Guinea. Un bumerán de 4 200 km.",
antigua:"Los imperios de Ghana, Malí y Songhai crecieron donde el río se acerca al desierto: por el Níger subía el oro y por las caravanas bajaba la sal, y en Tombuctú se cambiaban por libros. Mansa Musa cruzó a La Meca en 1324 con tanto oro que hundió su precio en El Cairo. Europa no supo hacia dónde corría el río hasta que Mungo Park lo vio en 1796; los hermanos Lander encontraron la desembocadura en 1830.",
moderna:"El delta del Níger es el petróleo de Nigeria: contaminación, quema de gas y conflicto. La presa de Kainji (1968) fue la primera grande; el delta interior, junto a Mopti, alimenta a millones con sus crecidas. Bamako, Niamey y el Sahel son hoy la franja más inestable de África.",
pistaAntigua:"Un emperador cruzó el desierto hacia La Meca en 1324 con tanto oro que hundió su precio en Egipto.",
pistaModerna:"Su delta concentra el petróleo de un país y la quema de gas ilumina los manglares de noche.",
frase:"[B]umerán: [M]alí [T]ira, [G]ira, [N]igeria [L]lega al [P]etróleo",fraseNota:"La frase también cuenta la forma del río: sube hacia el Sáhara, gira en Gao y baja al petróleo.",

{nombre:"Port Harcourt",pais:"Nigeria",pos:[4.82,7.05],escena:["grua","fabrica","manglar"],imagen:"Torres de petróleo entre manglares y llamas de gas de noche: Port Harcourt es la capital del delta petrolero.",dato:"Sobre el río Bonny, en el delta. Nigeria es el mayor productor de petróleo de África; los derrames y la quema de gas son la otra cara."}

{id:"parana",nombre:"Paraná",continente:"América del Sur",escenaNace:["presa","campos","arbol"],escenaMar:["barco","faro","aves"],longitud:4880,mar:"Río de la Plata (Atlántico)",marEn:"el Río de la Plata",
nace:"Confluencia del Paranaíba y el Grande",naceNota:"Se forma en Brasil, hace de frontera con Paraguay y luego con Argentina; con el Río de la Plata es el segundo sistema fluvial de Sudamérica.",
antigua:"Solís entró al Río de la Plata en 1516 y murió a manos de los charrúas; Caboto subió el Paraná en 1527 buscando la sierra de la plata (Potosí): de ahí el nombre. Entre 1609 y 1767 los jesuitas y los guaraníes levantaron treinta misiones en sus orillas. La Guerra de la Triple Alianza (1864-1870) se libró por el control del río; la fortaleza de Humaitá lo cerraba con cadenas.",
moderna:"Itaipú (1984, Brasil-Paraguay) fue la mayor hidroeléctrica del mundo hasta las Tres Gargantas; Yacyretá completa el sistema. La Hidrovía Paraguay-Paraná (3 400 km) saca la soya de Bolivia, Paraguay y Argentina por Rosario, el mayor complejo agroexportador del mundo. El dragado y los peajes son pleito permanente entre los países.",
pistaAntigua:"Su nombre viene de una sierra de plata que los conquistadores buscaban río arriba; una guerra del siglo XIX se libró por controlarlo.",
pistaModerna:"Una hidrovía de 3 400 km saca la soya de tres países por el mayor complejo agroexportador del mundo.",
frase:"[F]ernando [E]l [C]hamamecero [R]asguea [B]ien la [M]ilonga",fraseNota:"Chamamé en Corrientes, milonga en Buenos Aires y Montevideo.",

{id:"indo",nombre:"Indo",continente:"Asia",escenaNace:["nieve","montaña","lago"],escenaMar:["manglar","barco","duna"],longitud:3180,mar:"Mar Arábigo",marEn:"el mar Arábigo",

antigua:"La civilización del valle del Indo (2600-1900 a. C.), con Harappa y Mohenjo-daro, tuvo ciudades planificadas con alcantarillado antes que Roma, y su escritura sigue sin descifrarse. Alejandro Magno bajó el río en 326-325 a. C. La palabra India viene del Indo: Sindhu en sánscrito, Hindu en persa, Indos en griego.",
moderna:"El Tratado de Aguas del Indo (1960), mediado por el Banco Mundial, repartió sus ríos entre India y Pakistán; India lo dejó en suspenso en 2025. Sus canales forman el mayor sistema de riego contiguo del mundo y la presa de Tarbela (1976) es una de las mayores de tierra. Las inundaciones de 2010 y 2022 llegaron a cubrir hasta un tercio de Pakistán, y el delta se seca por falta de caudal.",
pistaAntigua:"Sus ciudades de hace 4 500 años tenían alcantarillado; su escritura sigue sin descifrarse.",
pistaModerna:"Un tratado de 1960 mediado por el Banco Mundial reparte sus aguas entre dos países rivales con armas nucleares.",

{id:"tempisque",nombre:"Tempisque",continente:"Guanacaste",escenaNace:["volcan","montaña","arbol"],escenaMar:["manglar","puente","barco"],zona:"cr",longitud:144,mar:"Golfo de Nicoya",marEn:"el golfo de Nicoya",
nace:"Cordillera de Guanacaste",naceNota:"Baja de la cordillera de Guanacaste, hacia el volcán Orosí, y cruza de norte a sur la llanura guanacasteca, la región más seca del país, hasta el golfo de Nicoya. Es el río principal de la provincia; su longitud suele darse en unos 144 km.",
antigua:"Esta llanura fue tierra chorotega y, desde la colonia, de haciendas ganaderas: sabanas para el ganado y casas de adobe. En 1824 el Partido de Nicoya se sumó a Costa Rica «por su propia voluntad», y el río fue durante un siglo la carretera de Guanacaste: bongos de un solo tronco bajaban maíz, cueros, queso y madera desde Bolsón, Puerto Humo y Bebedero, cruzaban el golfo hasta Puntarenas y volvían con sal y mercadería.",
moderna:"Hoy el llano se riega con agua que llega desde el embalse de Arenal, del otro lado de la cordillera, por el Distrito de Riego Arenal-Tempisque (años ochenta): caña de azúcar, arroz y melón. El Parque Nacional Palo Verde protege el humedal donde en la estación seca se juntan miles de aves acuáticas, y los cocodrilos toman el sol en los bancos de barro. Cerca de la boca, el puente de la Amistad de Taiwán (2003), de unos 780 m, une la península de Nicoya con el resto del país.",
pistaAntigua:"Una provincia entera se sumó al país «por su propia voluntad» en 1824; por este río bajaban en canoas de un solo tronco el maíz y los cueros de sus haciendas.",
pistaModerna:"Un puente de casi 800 m pagado por Taiwán lo cruza cerca de la boca, y el agua de un embalse al otro lado de la cordillera riega su caña y su arroz.",
frase:"[L]a [G]ente [F]esteja [B]ailando [P]unto",fraseNota:"El Punto guanacasteco es el baile típico. Cinco paradas, de Liberia al golfo.",

{nombre:"Liberia",pais:"Costa Rica",pos:[10.632,-85.4393],escena:["casas","iglesia","vaca"],imagen:"Una ciudad pintada de blanco donde todos usan sombrero de sabanero: Liberia, la «ciudad blanca» de Guanacaste, a media hora del río.",dato:"Capital de Guanacaste, fundada en 1769. El río Liberia atraviesa la ciudad y unos kilómetros al oeste entrega sus aguas al Tempisque. Su aeropuerto, el Daniel Oduber, es la segunda puerta de entrada del país."},
{nombre:"Guardia",pais:"Costa Rica",pos:[10.5655,-85.5868],escena:["puente","vaca","campos"],imagen:"Un guardia con machete y sombrero cuida un puente sobre el río: Guardia, el pueblo del puente del Tempisque.",dato:"Pueblo ribereño del cantón de Liberia; cerca de aquí la carretera a Filadelfia y Nicoya cruza el río. Río arriba el Tempisque es un río de piedras y pozas; río abajo se ensancha y serpentea por el llano."},
{nombre:"Filadelfia",pais:"Costa Rica",pos:[10.4454,-85.5526],escena:["campos","casas","vaca"],imagen:"Un queso crema gigante (Filadelfia) flota río abajo con sombrero de paja: Filadelfia, el pueblo del Tempisque en el corazón del arroz.",dato:"Cabecera del cantón de Carrillo, en medio del llano de arroz y caña. En la estación lluviosa el río se sale de su cauce y deja el pueblo y los campos bajo el agua durante días."},
{nombre:"Bolsón",pais:"Costa Rica",pos:[10.3623,-85.4493],escena:["muelle","campos","casas"],imagen:"Un bolsón (una bolsa enorme) lleno de maíz se sube a un bongo de un solo tronco: Bolsón fue puerto fluvial del Tempisque.",dato:"Pueblo de Santa Cruz en un meandro del río. Hasta mediados del siglo XX los bongos de remo y vela bajaban de aquí al golfo con maíz, cueros y madera, y subían con sal y mercadería de Puntarenas."},

]},
{id:"reventazon",nombre:"Reventazón",continente:"Cartago y Limón",escenaNace:["montaña","campos","arbol"],escenaMar:["palmera","barco","manglar"],zona:"cr",longitud:145,mar:"Mar Caribe",marEn:"el Caribe",
nace:"Valle de Orosi, Cartago",naceNota:"Se forma con el río Grande de Orosi y los ríos que bajan de la cordillera de Talamanca y del valle de Cartago, que se juntan en el embalse de Cachí; desde ahí cae hacia el Caribe y en la llanura toma el nombre de Parismina. Su longitud suele darse en unos 145 km.",
antigua:"Cartago, la capital colonial, buscaba por este valle su salida al Caribe: el camino a Matina, donde crecía el cacao que sirvió de moneda en la Costa Rica colonial. Orosi y Ujarrás nacieron como pueblos de indígenas reunidos por los frailes; la iglesia de Orosi (1743) es la más antigua del país que sigue en uso. En 1871 empezó el ferrocarril al Atlántico: Minor Keith lo terminó en 1890 siguiendo el Reventazón de Cartago a Siquirres, y para pagarlo sembró banano junto a la vía; de ahí nació la United Fruit (1899).",
moderna:"El valle es el corazón eléctrico del país: las plantas de Río Macho (1963), Cachí (1966), Angostura (2000) y Reventazón (2016, 305,5 MW, la hidroeléctrica más grande de Centroamérica cuando se inauguró). Turrialba vive del rafting, del queso, del CATIE, que investiga cultivos tropicales desde 1942, y de una fábrica que cose a mano todas las bolas de béisbol de las Grandes Ligas. En el llano hay banano y ganado; en la barra de Parismina anidan tortugas.",
pistaAntigua:"Un tren hacia el Atlántico se pagó sembrando banano junto a la vía; su constructor fundó después una compañía frutera enorme.",
pistaModerna:"Todas las bolas de béisbol de las Grandes Ligas se cosen a mano en una ciudad junto a este río, famoso por el rafting.",
frase:"[O]tro [C]afé, [J]efe, [T]an [S]uave, [P]or favor",fraseNota:"Seis paradas: Orosi, Cachí, Juan Viñas, Turrialba, Siquirres, Parismina.",

{nombre:"Orosi",pais:"Costa Rica",pos:[9.7965,-83.8543],escena:["iglesia","campos","montaña"],imagen:"Una iglesia chiquita de techo de tejas y un oso (O-rosi) que reza adentro: Orosi tiene la iglesia colonial más antigua del país que sigue en uso.",dato:"Valle de café entre montañas. La iglesia de San José de Orosi, de 1743, sigue abierta desde entonces. Cerca están las aguas termales y el Parque Nacional Tapantí, uno de los lugares más lluviosos de Costa Rica."},
{nombre:"Cachí",pais:"Costa Rica",pos:[9.8262,-83.8062],escena:["presa","lago","iglesia"],imagen:"Un cachete (Cachí) inflado aguanta el agua de todo el valle: la presa de Cachí embalsa el río.",dato:"La presa de Cachí (1966) fue una de las primeras grandes plantas del ICE. Junto al embalse están las ruinas de Ujarrás, el templo colonial que sus vecinos abandonaron en 1833 por las inundaciones, y la Casa del Soñador, con las tallas de madera de Macedonio Quesada."},
{nombre:"Juan Viñas",pais:"Costa Rica",pos:[9.8946,-83.7457],escena:["fabrica","campos","tren"],imagen:"Don Juan Viñas se toma un café con azúcar de su propio ingenio, sentado en la estación del tren: Juan Viñas, entre cafetales y cañales.",dato:"Pueblo de la Hacienda Juan Viñas, con ingenio de azúcar y beneficio de café desde el siglo XIX; el ferrocarril al Atlántico paraba aquí antes de bajar al valle de Turrialba."},
{nombre:"Turrialba",pais:"Costa Rica",pos:[9.9073,-83.6826],escena:["volcan","balsa","campos"],imagen:"Una bola de béisbol con un volcán de sombrero baja el río en balsa: en Turrialba se cosen las bolas de las Grandes Ligas, al pie del volcán Turrialba.",dato:"Ciudad del rafting y del queso. El CATIE investiga aquí cultivos tropicales desde 1942. A unos 20 km está Guayabo, la ciudad precolombina más grande del país, con calzadas y acueductos de piedra que todavía funcionan."},

{nombre:"Parismina",pais:"Costa Rica",pos:[10.3087,-83.3521],escena:["palmera","muelle","animal:tortuga"],imagen:"Una tortuga con paraguas y boina (Paris-mina) desova en la playa: en la barra de Parismina anidan tortugas.",dato:"Pueblo de pescadores en la boca del río, entre la playa y los canales que llevan a Tortuguero. Anidan tortugas verdes, baulas y carey, y los vecinos las cuidan de los saqueadores."}

{id:"sarapiqui",nombre:"Sarapiquí",continente:"Alajuela y Heredia",escenaNace:["volcan","cataratas","selva"],escenaMar:["selva","barco","casas"],zona:"cr",longitud:84,mar:"Río San Juan",marEn:"el río San Juan",
nace:"Cordillera Volcánica Central",naceNota:"Baja del lado norte de los volcanes Poás y Barva, entre cataratas, y en la llanura se vuelve un río ancho y navegable que entrega sus aguas al San Juan, en la frontera con Nicaragua. Su longitud suele darse en unos 84 km.",
antigua:"A mediados del siglo XIX este río fue la puerta de Costa Rica al Atlántico: por el camino de Sarapiquí bajaban las mulas desde Heredia hasta el Muelle, en Puerto Viejo, y de ahí los botes seguían por el San Juan hasta el Caribe. En abril de 1856, en la guerra contra el filibustero William Walker, tropas costarricenses vencieron en Sardinal, a orillas del Sarapiquí. Cuando el tren llegó a Limón, en 1890, el camino de Sarapiquí quedó en el olvido.",
moderna:"Piña, banano y turismo. La llanura de Sarapiquí es el corazón de la piña de un país que es el mayor exportador de piña fresca del mundo. En Puerto Viejo está La Selva (1968), una de las estaciones biológicas más estudiadas del trópico; en La Virgen las balsas de rafting bajan el río, y los puentes colgantes de Tirimbina lo cruzan sobre la selva.",
pistaAntigua:"En 1856 un ejército venció a los filibusteros a orillas de este río, que era entonces el camino de su país hacia el Atlántico.",
pistaModerna:"Su llanura es el corazón de la piña de un país que es el mayor exportador de piña fresca del mundo; a su orilla hay una estación biológica famosa.",
frase:"[S]i [L]a [C]anoa [P]asa [T]ranquila",fraseNota:"Cinco paradas: San Miguel, La Virgen, Chilamate, Puerto Viejo, Trinidad.",

ciudades:[
{nombre:"San Miguel",pais:"Costa Rica",pos:[10.3143,-84.1833],escena:["cataratas","montaña","presa"],imagen:"Un arcángel (San Miguel) con paraguas se baña bajo una catarata: San Miguel, donde el Sarapiquí baja de la montaña entre cascadas.",dato:"Pueblo del distrito de Sarapiquí, cantón de Alajuela, en la carretera que baja de Vara Blanca. Río arriba están la catarata de La Paz, en el río del mismo nombre, y la planta hidroeléctrica de Cariblanco (2007); el terremoto de Cinchona (2009) golpeó fuerte esta zona."},
{nombre:"La Virgen",pais:"Costa Rica",pos:[10.3997,-84.1368],escena:["balsa","puente","selva"],imagen:"Una virgen de yeso con chaleco salvavidas se sube a una balsa: en La Virgen empieza el rafting del Sarapiquí.",dato:"Pueblo de la carretera que baja de Vara Blanca a Puerto Viejo, donde el río sale de la montaña y las balsas entran al agua. A la orilla está la reserva Tirimbina, con un puente colgante de más de 250 m sobre el río."},
{nombre:"Chilamate",pais:"Costa Rica",pos:[10.4523,-84.0661],escena:["arbol","campos","casas"],imagen:"Un higuerón gigante (el chilamate) con un mate colgando de cada rama: Chilamate se llama como el árbol de la orilla.",dato:"Caserío de la ribera entre La Virgen y Puerto Viejo, entre piñales y potreros. El chilamate es un higuerón de sombra ancha, típico de estas orillas; río abajo se acaban los rápidos y el Sarapiquí se vuelve navegable."},
{nombre:"Puerto Viejo",pais:"Costa Rica",pos:[10.4541,-84.0083],escena:["muelle","selva","casas","animal:mono"],imagen:"Un muelle viejo con mulas cansadas que se bajan a un bote: en Puerto Viejo terminaba el camino de mulas y empezaba el viaje por agua.",dato:"Cabecera del cantón de Sarapiquí y antiguo Muelle de Sarapiquí, el puerto por donde salió el comercio del Valle Central hacia el Caribe a mediados del siglo XIX. Aquí se le une el río Puerto Viejo y, en la confluencia, está la estación biológica La Selva (1968)."},
{nombre:"Trinidad",pais:"Costa Rica",pos:[10.716,-83.9375],escena:["casas","muelle","selva"],imagen:"Una trinidad de botes se da la mano en la esquina de dos países: en Trinidad el Sarapiquí entra al San Juan, frente a Nicaragua.",dato:"Caserío en la boca del Sarapiquí, frente a la orilla nicaragüense del San Juan. Desde aquí los botes siguen río abajo hacia el Caribe o río arriba hacia el lago de Nicaragua. La frontera corre por la orilla derecha del San Juan desde 1858."}
]},
{id:"sanjuan",nombre:"San Juan",continente:"Frontera con Nicaragua",escenaNace:["lago","barco","casas"],escenaMar:["manglar","barco","faro"],zona:"cr",longitud:192,mar:"Mar Caribe",marEn:"el Caribe",
nace:"Lago de Nicaragua, en San Carlos",naceNota:"Desagua el lago de Nicaragua (Cocibolca), el más grande de Centroamérica, y corre hacia el Caribe; en su tramo final la frontera con Costa Rica va por su orilla derecha, según el tratado Cañas-Jerez de 1858. Es un río nicaragüense, pero la historia de Costa Rica pasa por él. Su longitud suele darse en unos 192 km.",
antigua:"Fue el camino de Granada al mar y por eso el de los piratas: Henry Morgan lo remontó en 1665 para saquear Granada. España levantó el castillo de la Inmaculada Concepción (1675) sobre un raudal; en 1762 Rafaela Herrera, de 19 años, dirigió su defensa contra los ingleses, y en 1780 un joven Horatio Nelson lo tomó por unos meses. Desde 1851 los vapores de Cornelius Vanderbilt subían el río con viajeros rumbo al oro de California; por esa ruta llegó el filibustero William Walker, y en la campaña de 1856 y 1857 Costa Rica le quitó los vapores del río.",
moderna:"El tratado Cañas-Jerez (1858) dejó el río a Nicaragua y a Costa Rica el derecho de navegarlo con fines de comercio; la Corte Internacional de Justicia volvió a leerlo en 2009 y falló sobre la frontera del delta en 2015 y 2018. El sueño del canal interoceánico vuelve cada tanto: en los años 1890 se dragó en Greytown y en 2013 Nicaragua dio una concesión a una empresa china, cancelada en 2024. Hoy casi toda el agua sale por el río Colorado, en Costa Rica: unas nueve de cada diez gotas.",
pistaAntigua:"Un almirante inglés famoso tomó de joven el castillo de este río; años antes lo había defendido de otros ingleses una muchacha de 19 años.",
pistaModerna:"Un tratado de 1858 lo dejó a un país y le dio a su vecino el derecho de navegarlo; una corte internacional lo volvió a leer en 2009.",
frase:"[S]eis [S]ardinas [E]n [B]olsa [D]e [S]al",fraseNota:"Seis paradas: San Carlos, Sábalos, El Castillo, Boca San Carlos, Delta y San Juan de Nicaragua.",

ciudades:[
{nombre:"San Carlos",pais:"Nicaragua",pos:[11.1231,-84.7783],escena:["castillo","muelle","lago"],imagen:"Un lago gigante se vacía por una pajilla (San Carlos): aquí el lago de Nicaragua se convierte en río.",dato:"Ciudad nicaragüense en la salida del lago Cocibolca, donde empieza el San Juan. De aquí zarpaban los vapores de la ruta del Tránsito y hoy salen las lanchas hacia las islas de Solentiname."},
{nombre:"Sábalos",pais:"Nicaragua",pos:[11.0426,-84.4723],escena:["balsa","muelle","selva"],imagen:"Un sábalo (un pez plateado enorme) salta por encima del bote y saluda: en Sábalos pescan sábalos reales.",dato:"Boca de Sábalos, pueblo en la boca del río Sábalos, famoso por la pesca del sábalo real, un pez plateado que puede pesar más de 100 kilos y salta fuera del agua cuando lo enganchan."},
{nombre:"El Castillo",pais:"Nicaragua",pos:[11.0189,-84.397],escena:["castillo","casas","selva"],imagen:"Un castillo de piedra sobre un raudal y una muchacha de 19 años disparando el cañón: El Castillo, donde Rafaela Herrera defendió el río en 1762.",dato:"La fortaleza de la Inmaculada Concepción (1675) vigila el raudal del Diablo. Rafaela Herrera la defendió en 1762 y Nelson la tomó en 1780. El pueblo no tiene calles para carros: todo llega por el río."},
{nombre:"Boca San Carlos",pais:"Costa Rica",pos:[10.7815,-84.1987],escena:["casas","selva","muelle"],imagen:"Una boca abierta se toma un río entero de un trago: en Boca San Carlos entra el río San Carlos, que viene de Costa Rica.",dato:"Caserío costarricense en la boca del río San Carlos, con puesto fronterizo. De aquí en adelante la orilla derecha es Costa Rica y el agua es de Nicaragua."},
{nombre:"Delta",pais:"Costa Rica",pos:[10.735,-83.7385],escena:["pantano","selva","balsa"],imagen:"Una letra griega Δ (delta) partida en dos por un cuchillo: en Delta el río se parte y casi toda el agua se va por el Colorado, a Costa Rica.",dato:"Aquí nace el río Colorado, el brazo que se lleva la mayor parte del caudal hasta Barra del Colorado, en Costa Rica; el San Juan sigue, más flaco, hacia San Juan de Nicaragua. La disputa por la Isla Portillos, en este delta, la decidió la Corte de La Haya en 2015."},
{nombre:"San Juan de Nicaragua",pais:"Nicaragua",pos:[10.9466,-83.7357],escena:["manglar","casas","muelle"],imagen:"Un pueblo gris (Grey-town) junto a un canal que nunca se terminó de cavar: San Juan de Nicaragua, la antigua Greytown, en la boca del río.",dato:"En el siglo XIX, como Greytown, fue el puerto de la ruta del Tránsito; un buque de Estados Unidos lo bombardeó en 1854, y en los años 1890 se dragó aquí el inicio de un canal que nunca se terminó. Hoy es un pueblo de lanchas y manglares, reconstruido en los años noventa."}
]},
{id:"tarcoles",nombre:"Tárcoles",continente:"Valle Central y Pacífico",escenaNace:["montaña","casas","campos"],escenaMar:["manglar","barco","palmera"],zona:"cr",longitud:111,mar:"Golfo de Nicoya",marEn:"el golfo de Nicoya",
nace:"Valle Central: el Virilla y el Grande",naceNota:"Recoge las aguas del Valle Central: el Virilla, que baja desde Coronado entre San José y Heredia, y el Grande, que viene de San Ramón y Atenas, se juntan en Balsa, y desde ahí el río se llama Grande de Tárcoles hasta el Pacífico. Su longitud suele darse en unos 111 km.",
antigua:"Por este valle bajó el café hacia el puerto: desde los años 1840 las carretas y las mulas iban de San José a Puntarenas por el camino de mulas, cruzaban el Virilla por el puente de Mulas, de piedra, y el río Grande en balsa, en el paso que le dio nombre al pueblo. El ferrocarril al Pacífico (1910) pasó por Orotina y dejó viejo el camino. Mucho antes, los huetares pescaban y cazaban en estos ríos del valle.",
moderna:"El Virilla recoge las aguas sucias de la Gran Área Metropolitana y el Tárcoles es el río más contaminado del país; desde 2015 la planta de Los Tajos trata parte de esas aguas. Sobre el río Grande, en La Garita, el ICE estrenó en 1958 su primera planta hidroeléctrica. Río abajo, el puente de la carretera a Jacó es el mirador de cocodrilos más famoso de Costa Rica, y en Carara vuelven a criar las lapas rojas. En Belén, junto al Virilla, la fábrica de Intel (1997) hizo de los chips la primera exportación del país durante años.",
pistaAntigua:"Por su valle bajaba el café en carreta hacia el puerto del Pacífico; el ferrocarril de 1910 dejó viejo el camino de mulas.",
pistaModerna:"Es el río más contaminado de su país y, a la vez, el del puente desde donde todos miran cocodrilos.",
frase:"[H]oy [B]ajo [B]uscando [O]tro [T]esoro",fraseNota:"Cinco paradas: Heredia, Belén, Balsa, Orotina, Tárcoles.",

{nombre:"Heredia",pais:"Costa Rica",pos:[9.9984,-84.1171],escena:["iglesia","castillo","campos"],imagen:"Una ciudad de flores con un fortín de ladrillo que mira el río desde arriba: Heredia, la ciudad de las flores, sobre el Virilla.",dato:"Capital de la provincia, la «ciudad de las flores». Fue de las primeras tierras de café del país, a principios del siglo XIX; tiene el Fortín (1876) y la Universidad Nacional. Sus ríos, el Pirro y el Burío, bajan al Virilla."},
{nombre:"Belén",pais:"Costa Rica",pos:[9.9796,-84.1852],escena:["puente","fabrica","casas"],imagen:"Un portal de Belén con mulas cruzando un puente de piedra y un chip de computadora de estrella: Belén, del puente de Mulas a Intel.",dato:"San Antonio de Belén, cantón de Heredia a orillas del Virilla. El puente de Mulas, de piedra, cruzaba el río en el camino a Puntarenas; en 1997 llegó la fábrica de Intel y los chips fueron por años la primera exportación del país."},
{nombre:"Balsa",pais:"Costa Rica",pos:[9.9428,-84.3791],escena:["balsa","puente","campos"],imagen:"Una balsa de troncos cruza el río justo donde dos ríos se abrazan: en Balsa se juntan el Virilla y el Grande y nace el Tárcoles.",dato:"Caserío de Atenas donde el Virilla se une al río Grande y el cauce pasa a llamarse Grande de Tárcoles. Aquí cruzaba en balsa el camino de mulas. Río arriba, en La Garita, el ICE estrenó en 1958 su primera planta hidroeléctrica."},
{nombre:"Orotina",pais:"Costa Rica",pos:[9.9119,-84.5237],escena:["tren","mercado","campos"],imagen:"Una oreja (Oro-tina) enorme escucha pasar el tren cargado de mangos y sandías: Orotina, la parada de las frutas.",dato:"Cantón de Alajuela en la bajada al Pacífico, famoso por sus puestos de frutas junto a la carretera. El ferrocarril al Pacífico (1910) paraba aquí entre San José y Puntarenas."},
{nombre:"Tárcoles",pais:"Costa Rica",pos:[9.7587,-84.625],escena:["puente","animal:cocodrilo","palmera"],imagen:"Docenas de cocodrilos toman el sol bajo un puente lleno de turistas con celular: Tárcoles, el puente de los cocodrilos.",dato:"Pueblo de pescadores en la boca del río. Desde el puente de la carretera a Jacó se ven decenas de cocodrilos en los bancos de barro, y en el Parque Nacional Carara, al lado, anidan las lapas rojas. El río sale al golfo de Nicoya."}
]},
{id:"terraba",nombre:"Térraba",continente:"Zona Sur",escenaNace:["montaña","campos","casas"],escenaMar:["manglar","barco","aves"],zona:"cr",longitud:160,mar:"Océano Pacífico (bahía de Coronado)",marEn:"el Pacífico",
nace:"Valle del General, Pérez Zeledón",naceNota:"Nace como río General al pie del Chirripó, la montaña más alta del país (3 820 m), recorre el valle de Pérez Zeledón y Buenos Aires, se une al Coto Brus en Paso Real y desde ahí se llama Grande de Térraba hasta el Pacífico. Con unos 160 km, es el río más largo de Costa Rica.",
antigua:"El valle del Diquís, «agua grande» en lengua boruca, fue tierra de esferas de piedra: los pueblos de aquí las tallaron entre los siglos IV y XVI y nadie sabe para qué. Los borucas y los térrabas siguen viviendo junto al río; cada fin de año, en Boruca, el Juego de los Diablitos enfrenta a las máscaras con el toro español. En 1938 la Compañía Bananera abrió fincas en Palmar y sacó las esferas a la luz al limpiar la tierra.",
moderna:"Piña en Buenos Aires, palma aceitera donde hubo banano, y el manglar de Térraba-Sierpe, el más grande del país. Las esferas de Finca 6 son Patrimonio de la Humanidad desde 2014. El ICE quiso levantar aquí la represa del Diquís, la más grande de Centroamérica, y la canceló en 2018 tras años de oposición de los pueblos térraba y boruca.",
pistaAntigua:"En su valle aparecieron cientos de esferas de piedra casi perfectas cuando una compañía bananera limpiaba la tierra; nadie sabe para qué las hicieron.",
pistaModerna:"El río más largo de su país; una represa gigante que iba a inundar tierra indígena se canceló en 2018.",
frase:"[S]i [V]as [P]or el [R]ío, [P]edí [C]afé",fraseNota:"Seis paradas: San Isidro, Volcán, Paso Real, Rey Curré, Palmar, Ciudad Cortés.",

<script>
const NAVES={
nilo:{nombre:"Una falúa",tipo:"latina",desc:"Casco bajo y una sola vela latina, triangular, que toma el viento del norte para subir y se pliega para bajar con la corriente. Es la misma silueta que navega el Nilo desde los faraones.",zarpe:"Zarpás del lago Victoria con la bodega vacía y cántaros de agua dulce.",llegada:"La falúa no sale al mar: en el delta la carga sigue en gabarra hasta Alejandría, y vos volvés al sur con la vela llena de viento del norte.",
puertos:[["Cargás sacos de café robusta de las laderas del lago: Uganda es uno de los dos mayores exportadores de café de África.","café"],
["Dejás el café y cargás colmillos de marfil, el comercio que hizo rica a Jartum en el siglo XIX.","marfil"],
["Cambiás el marfil por sacos de goma arábiga: la resina de las acacias sudanesas espesa refrescos y dulces en todo el mundo, y Sudán produce la mayor parte.","goma arábiga"],
["Sumás dátiles de las palmeras nubias y, si la crecida ayuda, un obelisco de granito rosado: las canteras de Asuán abastecieron los templos de todo Egipto.","goma arábiga, dátiles y un obelisco"],

amazonas:{nombre:"Un regatão",tipo:"canoa",desc:"La barca del vendedor ambulante de la Amazonía: techo de tablas, hamacas colgadas y una bodega que se llena y vacía en cada caserío. Compra caucho, castaña y pescado; vende sal, jabón y baterías.",zarpe:"Zarpás de los Andes con sal y anzuelos para vender río abajo.",llegada:"El regatão da la vuelta en Belém: el Atlántico es de los cargueros y el delta de Marajó, de las mareas.",
puertos:[["Cargás bolas de caucho ahumado, las «bolachas» que hicieron ricos a los barones del siglo XIX.","caucho"],
["Sumás pirarucú seco, el pez gigante del Amazonas que se sala y se vende como bacalao de río.","caucho y pirarucú"],
["Vendés el caucho en el puerto flotante, que sube y baja hasta 14 m con el río, y cargás castañas de Pará.","pirarucú y castañas"],

yangtse:{nombre:"Un junco",tipo:"junco",desc:"Velas de estera reforzadas con listones de bambú, timón de popa y un casco dividido en compartimentos estancos mil años antes que Europa. Baja las gargantas con la corriente y sube a la sirga, arrastrado desde la orilla.",zarpe:"Zarpás de Sichuan con la bodega vacía y las velas plegadas.",llegada:"El junco se queda en el estuario; del Yangtsé al mar salen los portacontenedores.",
puertos:[["Cargás sal de los pozos de Zigong y pimienta de Sichuan; la sal de pozo fue durante siglos el monopolio que financiaba al imperio.","sal y pimienta"],
["Bajás por las esclusas de las Tres Gargantas; hasta hace un siglo aquí se contrataban los sirgadores que subían los juncos a pulso.","sal y pimienta"],
["Vendés la sal y cargás ladrillos de té: desde Hankou salía el té prensado que cruzaba Mongolia a lomo de camello hasta Rusia.","pimienta y té"],

["Todo se vende en el Bund, y el junco vuelve con algodón hilado en las fábricas del delta.","vendida"]]},
misisipi:{nombre:"Un vapor de rueda",tipo:"vapor",desc:"Casco tan plano que, decían, flota sobre el rocío; dos chimeneas, una rueda de paletas a popa y un piloto que se sabe de memoria cada banco de arena, como el joven Mark Twain.",zarpe:"Zarpás de Minnesota con madera de pino y la caldera encendida.",llegada:"El vapor no sale al golfo: en Nueva Orleans la carga pasa a los barcos de altura, como pasó siempre.",
puertos:[["Cargás sacos de harina de los molinos de las cataratas de San Antonio: hacia 1880 Mineápolis molía más trigo que ninguna otra ciudad del mundo.","harina"],
["Sumás fardos de pieles de castor que bajaron por el Misuri: San Luis fue la capital del comercio de pieles del Oeste.","harina y pieles"],

["Sumás barriles de azúcar y melaza de los ingenios de Luisiana.","harina, algodón y azúcar"],

danubio:{nombre:"Una caja de Ulm",tipo:"barcaza",desc:"Barcaza plana de tablas de pino con una casita en cubierta, pintada a franjas blancas y negras, que solo navega río abajo. Al llegar se desarma y se vende como leña; el barquero vuelve a pie.",zarpe:"Zarpás de Ulm con barriles de vino y una familia de colonos.",llegada:"Quedan 1 600 km hasta el mar Negro; los hacen las barcazas modernas por las Puertas de Hierro. La caja de Ulm ya es leña.",

rin:{nombre:"Una barcaza del Rin",tipo:"barcaza",desc:"110 m de casco de acero, la cabina de la familia a popa, la bicicleta en cubierta y el coche encima de la escotilla. Lleva 3 000 toneladas, lo mismo que cien camiones.",zarpe:"Zarpás de Basilea con la bodega vacía, aguas abajo del codo del Rin.",llegada:"La barcaza no ve el mar: en Rotterdam el Rin se convierte en grúas.",
puertos:[["Cargás sal de las minas de Schweizerhalle y contenedores de la industria química: es el único puerto de Suiza.","sal y químicos"],

<script>
const MASCOTAS={
nilo:{nombre:"Hipo",especie:"el hipopótamo",emoji:"🦛",glifo:"hipo",hola:"¡Soy Hipo! Vivo aquí, en el lago. Subite, que el río es largo y yo conozco todos los bancos de arena.",mar:"El río se abre en abanico y se va al mar. Yo me quedo en el agua dulce. ¡Volvé pronto!",
paradas:["¿Olés el café? Aquí empieza todo. Agarrate, que la corriente ya nos lleva.","Los pantanos de aquí son mi lugar favorito. Cuidado con los mosquitos: a mí no me pican, pero a vos sí.","¡Mirá! Dos ríos se juntan y son uno. Como dos jarras en un solo balde.","¡Un obelisco en la barca! Si se hunde, no me mirés a mí.","Templos, templos y más templos. Los faraones sí que sabían construir.","¡Qué grande esta ciudad! Aquí me despido, que en la ciudad no dejan entrar hipopótamos."]},
amazonas:{nombre:"Boto",especie:"el delfín rosado",emoji:"🐬",glifo:"delfin",hola:"¡Soy Boto, el delfín rosado! De noche, dicen, me convierto en persona. De día te acompaño.",mar:"Hasta aquí llego. Cuando volvás, buscame donde el agua es dulce.",
paradas:["A esta ciudad no llega ninguna carretera. Todos llegan como nosotros: por el agua.","Tres países en una esquina. Yo cruzo las fronteras sin pasaporte.","¡Mirá las dos aguas que no se mezclan! Una oscura y otra color café con leche. Yo nado en las dos.","Aquí el agua es verde y hay playas de arena blanca. ¿Nadamos un rato?","Se huele el mar. Aquí el río es tan ancho que no se ve la otra orilla."]},
yangtse:{nombre:"Tun",especie:"la marsopa sin aleta",emoji:"🐋",glifo:"marsopa",hola:"Soy Tun, la marsopa que sonríe. Quedamos pocas en este río, así que cuidame.",mar:"El mar. Aquí me doy la vuelta, que el agua salada no me gusta.",
paradas:["¡Cuánta niebla y cuánta gente! Y huele a chile por todas partes.","Las gargantas dan un poco de miedo. Antes, cientos de hombres subían los barcos a pulso por aquí.","Un puente enorme, el primero que cruzó este río. Pasamos por debajo, ¿ves?","Nan es sur y jing es capital. ¿Y Pekín? Bei es norte. ¡Ya sabés tres palabras en chino!","¡Cuántas torres! Aquí el río se llama Huangpu, pero es la misma agua."]},
misisipi:{nombre:"Croac",especie:"la rana toro",emoji:"🐸",glifo:"rana",hola:"¡Croac! Soy Croac, la rana toro. Sí, canto muy fuerte. Ya te vas a acostumbrar.",mar:"El golfo. Agua salada, no gracias. ¡Croac!",
paradas:["¡La única catarata del río! Escuchá cómo suena. Los molinos la usaban para moler harina.","¿Ves ese arco enorme? Es la puerta del Oeste. Y aquí entra el Misuri, que es más largo que nosotros.","Aquí nació el rock. Yo también canto, pero nadie me da un disco.","El bastón rojo. Antes lo clavaban los cazadores para marcar su tierra. Ahora hay chimeneas.","¡Trompetas, desfiles y comida picante! Esta ciudad está más baja que el río. Raro, ¿no?"]},
danubio:{nombre:"Valsa",especie:"el cisne",emoji:"🦢",glifo:"cisne",hola:"Soy Valsa, el cisne. Sé bailar y sé el camino. Diez países, ¡y ninguno como mi río!",mar:"El mar Negro. Yo me quedo en el delta, con los pelícanos. ¡Volvé!",
paradas:["¡Mirá esa torre! Es una de las torres de iglesia más altas del mundo. Desde arriba se ve todo el río.","Un puente de piedra viejísimo; durante siglos fue el único. Pasamos por debajo con la cabeza baja.","Tres ríos de tres colores se juntan. Yo prefiero el azul, obviamente.","Aquí hacen una tarta con enrejado. Los cisnes no comemos tarta, pero vos podés.","¡Mi ciudad! Aquí escribieron un vals con mi nombre... bueno, con el nombre del río.","Un castillo blanco como yo. Y Viena está a solo 60 km: dos capitales casi vecinas.","Buda en la colina, Pest en el llano y yo en medio. ¿Ves el puente de las cadenas?","La ciudad blanca. Aquí me despido: más abajo el río se mete entre montañas."]},
rin:{nombre:"Bíber",especie:"el castor",emoji:"🦫",glifo:"castor",hola:"Soy Bíber, el castor. Construyo presas, pero prometo no tapar el río mientras viajás.",mar:"El mar del Norte, frío y gris. Yo me vuelvo a mi presa. ¡Chau!",
paradas:["El río dobla como un codo. Y aquí hay tres países en una esquina, pero un solo puerto suizo.","Esta ciudad cambió de país cinco veces. Yo siempre fui del río.","Aquí un señor llamado Gutenberg inventó la imprenta. Sin él no habría libros. Ni este juego.","¡Castillos por todos lados! Cuidado con la Lorelei, que canta y distrae a los capitanes.","Dos torres altísimas y olor a perfume. Aquí inventaron el agua de colonia.","Grúas, grúas y más grúas. Es el puerto de río más grande de Europa.","El puerto más grande del continente. Los barcos son tan grandes que parecen ciudades."]},
ganges:{nombre:"Gavi",especie:"el gavial",emoji:"🐊",glifo:"gavial",hola:"Soy Gavi, el gavial. Mi hocico es largo y finito para pescar. Tranquilo: no como personas.",mar:"Los manglares y los tigres. Yo me quedo aquí; vos no te bajés del barco.",
paradas:["Aquí el río sale de las montañas. Por la tarde sueltan lucecitas en el agua. ¡Mirá!","Uf, las fábricas de cuero ensucian el agua. Nadá con la boca cerrada.","Tres ríos se juntan aquí, aunque uno es invisible. Cada doce años viene muchísima gente.","Escaleras hasta el agua y gente rezando desde antes del amanecer. Es el lugar más antiguo del río.","Hace mucho, esta fue una de las ciudades más grandes del mundo. Ahora comemos arroz.","Un puente gigante y un mercado enorme. El río aquí se llama Hooghly."]},
volga:{nombre:"Belu",especie:"el esturión",emoji:"🐟",glifo:"esturion",hola:"Soy Belu, un esturión. Puedo vivir cien años y medir cuatro metros. Todavía soy chiquito.",mar:"El Caspio es un mar sin salida. Yo nací aquí, y aquí me quedo.",
paradas:["Aquí el río es tan angosto que casi salto a la otra orilla.","El escudo de la ciudad tiene un oso con un hacha. Yo prefiero uno con un pez.","¡La feria más grande de Rusia! Té, pieles, telas... y mucha gente gritando precios.","Una mezquita y una iglesia dentro del mismo castillo. Y el nombre de la ciudad quiere decir caldero.","El río hace una vuelta enorme alrededor de unas montañas. ¡Parece un anzuelo!","Una estatua gigante con una espada mira el río. Aquí hubo una batalla muy grande.","El río se deshace en cientos de brazos. Aquí viven mis primos, y crecen las sandías más ricas."]},
tigris:{nombre:"Rafi",especie:"la tortuga de caparazón blando",emoji:"🐢",glifo:"tortuga",hola:"Soy Rafi, la tortuga de caparazón blando. Vivo entre los dos ríos, donde inventaron la escritura.",mar:"El golfo. Yo me quedo en el agua dulce; los dátiles siguen en barco hasta la India.",
paradas:["Murallas negras y sandías más grandes que yo. ¡No las dejés caer!","Enfrente estaba Nínive, una ciudad con toros alados en las puertas.","Aquí nació Saladino. Ochocientos años después, otro señor famoso, pero mucho menos simpático.","¡Un minarete en espiral! Se sube caminando por afuera, como un caracol.","Una ciudad redonda con la biblioteca más grande del mundo. Hasta que vinieron los mongoles.","Palmeras de dátiles hasta donde alcanza la vista. Y de aquí zarpaba Simbad."]},
mekong:{nombre:"Buk",especie:"el bagre gigante",emoji:"🐠",glifo:"bagre",hola:"Soy Buk, el bagre gigante. Puedo pesar 300 kilos. Lo digo para que me respeten.",mar:"Nueve brazos, los nueve dragones, y el mar. Yo no salgo: soy de agua dulce y de arroz.",
paradas:["Elefantes, palmeras y té. Aquí el río todavía se llama Lancang.","Cada mañana los monjes hacen una fila naranja. En orden, como tus ciudades.","Una ciudad tranquila. Enfrente, al otro lado del agua, ya es Tailandia.","Cuatro brazos de río se juntan. Y hay un lago que se llena y se vacía como un pulmón.","Un mercado donde las tiendas son barcas. Se compra sin bajarse del bote."]},
niger:{nombre:"Mana",especie:"el manatí",emoji:"🦭",glifo:"manati",hola:"Soy Mana, el manatí. Soy lento, pero me conozco el bumerán entero.",mar:"El golfo de Guinea. El río nació a 240 km de aquí y dio la vuelta entera. ¡Qué viaje!",
paradas:["Río de cocodrilos, se llama. Yo nado lejos de ellos, y vos también.","Aquí el río se desparrama en lagos. Las barcas son taxis y la mezquita es de barro.","Sal del desierto, oro del río y libros en el medio. La ciudad del misterio.","¡Aquí el río gira! Hasta ahora íbamos hacia el desierto; ahora vamos al mar.","Cerca viven las últimas jirafas de esta parte de África. Saludá.","Entra otro río y el nuestro se pone gordo. Doble de agua, doble de manatíes.","Manglares, torres de petróleo y fuego de noche. Aquí termina mi camino."]},
parana:{nombre:"Lobi",especie:"el lobito de río",emoji:"🦦",glifo:"nutria",hola:"Soy Lobi, el lobito de río. Nado rápido y hablo mucho. Vamos.",mar:"El Atlántico. Yo me vuelvo río arriba, que el agua salada me pica.",
paradas:["¿Escuchás las cataratas? Son del río de al lado, pero el ruido llega hasta aquí.","Una misión de piedra roja. Hace mucho, aquí vivían guaraníes y curas juntos.","Aquí entra el río Paraguay y suena el chamamé. ¿Vos bailás?","Silos y silos de soya. Y aquí inventaron la bandera argentina.","El río es tan ancho que parece mar, y de color café con leche.","Un cerro chiquito y una playa larguísima. Fin del viaje. ¿Un helado?"]},
indo:{nombre:"Bulán",especie:"el delfín del Indo",emoji:"🐬",glifo:"delfin",hola:"Soy Bulán, el delfín ciego. Casi no veo, pero oigo todo. Vos mirá por los dos.",mar:"El mar Arábigo. Yo me quedo donde queda agua. Cuidala.",
paradas:["¡Qué alto! Aquí el aire es finito y las montañas son de colores.","Desde aquí salen las expediciones al K2, la segunda montaña más alta del mundo. Albaricoques para el camino.","Por este vado cruzaron todos: Alejandro, los mogoles... y ahora nosotros.","Una presa con 66 compuertas reparte el agua como una regadera. Cerca hay ruinas de hace 4 500 años.","Casas con torres de viento en el techo, para atrapar la brisa.","Una ciudad enorme junto al delta. Aquí el río ya casi no llega."]},
tempisque:{nombre:"Lalo",especie:"el cocodrilo del Tempisque",emoji:"🐊",glifo:"cocodrilo",hola:"Soy Lalo, cocodrilo. Tomo el sol en el barro y no como capitanes. Palabra.",mar:"El golfo de Nicoya. Hasta aquí llego; el agua salada me pica la panza.",
paradas:["La ciudad blanca. Yo no entro: mucha gente y poca sombra.","Aquí el río todavía trae piedras. Cuidado con la panza del bongo.","Cuando llueve, este llano se vuelve un lago y yo nado hasta las casas.","Los bongos cargaban maíz aquí. A mí me gusta más el pescado.","Enfrente está Palo Verde: miles de patos y garzas. Mi comedor favorito."]},
reventazon:{nombre:"Nuria",especie:"la nutria de río",emoji:"🦦",glifo:"nutria",hola:"Soy Nuria, la nutria. Nado boca arriba y como cangrejos. Subite a la balsa.",mar:"El Caribe. Las olas son más grandes que yo; me quedo en la barra.",
paradas:["Aquí el agua baja helada de Tapantí. ¡Brrr! Igual me meto.","Una pared enorme guarda el agua. Del otro lado el río se calma.","Huele a caña dulce y a café. Yo prefiero un pez.","Las balsas de colores saltan las olas. ¡Yo voy adelante!","Otra pared gigante, la más grande. Ya casi estamos en el llano.","Tortugas en la playa y lanchas en el canal. Ya casi llegamos."]},
sarapiqui:{nombre:"Bruno",especie:"el mono congo",emoji:"🐒",glifo:"mono",hola:"Soy Bruno, el mono congo. Grito más fuerte que la lluvia, pero no muerdo. Vamos.",mar:"El río San Juan. Desde la orilla los despido con un grito.",
paradas:["Aquí el río viene bajando a los saltos. Yo me agarro fuerte de la rama.","Desde los árboles veo saltar las balsas. Yo prefiero mirar.","Este higuerón es mi casa. ¿Oíste ese grito? Era yo.","Aquí hay científicos con binoculares mirándome todo el día.","Enfrente ya es Nicaragua. Los monos de allá gritan igual que yo."]},
sanjuan:{nombre:"Tiburcio",especie:"el tiburón toro",emoji:"🦈",glifo:"tiburon",hola:"Soy Tiburcio, el tiburón toro. Subo del mar al lago como si nada; el agua dulce no me asusta.",mar:"El Caribe. Yo voy y vengo entre el mar y el lago; vos elegís.",
paradas:["Aquí termina mi lago y empieza el río. ¡Qué grande!","Los sábalos saltan y yo los persigo, pero son rápidos.","Un raudal con piedras y un castillo encima. Cuidado con la panza.","Entra un río nuevo, con agua café de Costa Rica.","El río se parte y casi toda el agua se va por el Colorado. Yo sigo derecho.","¡El mar! Sal en el agua y olas en la nariz. Aquí me quedo un rato."]},
tarcoles:{nombre:"Ara",especie:"la lapa roja",emoji:"🦜",glifo:"lapa",hola:"Soy Ara, la lapa roja. Grito, vuelo en pareja y me encantan los almendros de la costa. Vamos.",mar:"El golfo de Nicoya. Yo me quedo en los almendros de la playa; vos seguí.",
paradas:["Aquí el río es una quebrada entre casas y cafetales. Todavía huele a flores.","Mucho ruido de fábricas y carros. Yo paso rapidito por encima.","Dos ríos se juntan y el agua se pone ancha. Ahora sí es un río.","Frutas por todos lados. ¡Mangos! Yo tomo uno prestado.","Cocodrilos abajo y lapas arriba. Ese puente es mi mirador favorito."]},
terraba:{nombre:"Pinzas",especie:"el cangrejo del manglar",emoji:"🦀",glifo:"cangrejo",hola:"Soy Pinzas, cangrejo de manglar. Camino de lado, pero llego. Subite.",mar:"El Pacífico, y mi manglar. Aquí me quedo, entre las raíces.",
paradas:["Aquí el río salta entre piedras y el agua está fría. ¡Yo me agarro!","Huele a piña por todos lados. ¿Será que a los cangrejos nos gusta?","Dos ríos se juntan y ahora el agua es ancha y café.","Máscaras de colores en las casas. A mí me dan un poquito de susto.","Esferas de piedra en el suelo. Redondas, redondas. Yo no sé rodar.","¡Mi manglar! Raíces, barro y mareas. Llegamos."]}
};
</script>
