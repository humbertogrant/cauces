.frase{background:var(--ficha);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.fkicker{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris2);margin-bottom:6px}
.ftexto{font-size:22px;font-weight:600;color:var(--verde);line-height:1.25}
.ftexto b,.op b{font-weight:700;color:var(--oro-tinta)}
.fnota{font-size:14px;color:var(--gris2);margin-top:4px}
.flista{font-size:15px;color:var(--gris2);margin-top:6px}
.btn{font:600 17px var(--cuerpo);background:var(--verde);color:#fff;border:1px solid var(--verde);border-radius:10px;padding:12px 18px;min-height:46px;cursor:pointer}
.btn.sec{background:var(--ficha);color:var(--verde);border-color:var(--linea)}
.btn:focus-visible,.son:focus-visible,.op:focus-visible,.chip:focus-visible,.fila:focus-visible,.tabs button:focus-visible,.volver:focus-visible{outline:3px solid var(--verde-claro);outline-offset:2px}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.enlace{background:none;border:0;padding:0;color:var(--verde-medio);font:600 15px var(--cuerpo);text-decoration:underline;cursor:pointer;margin-bottom:8px}
.campo{flex:1;min-width:0;font:400 17px var(--cuerpo);color:var(--gris);padding:10px 12px;border:1px solid var(--linea);border-radius:10px;background:var(--ficha)}
.campo:focus-visible{outline:3px solid var(--verde-claro);outline-offset:2px}
.perfiles{margin-bottom:14px}
.progreso{border-top:1px solid var(--grid);margin-top:8px;padding-top:12px}
.progreso .enlace{margin:-4px 0;padding:8px 0;font-size:14px}
label.enlace{cursor:pointer}
.tabs{display:flex;border:1px solid var(--linea);border-radius:10px;background:var(--ficha);overflow:hidden;margin-bottom:16px}
.tabs button{flex:1;border:0;background:var(--ficha);color:var(--verde);font:600 15px var(--cuerpo);padding:10px 4px;cursor:pointer}
.tabs button.on{background:var(--verde);color:#fff}
.fmeta{display:block;font-size:14px;color:var(--gris2);margin:2px 0 6px}
.barra{display:block;height:4px;background:var(--grid)}
.barra i{display:block;height:100%;background:var(--verde-claro)}
.aviso{background:var(--ficha);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.secuencia{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.extremo{font:600 12px var(--cuerpo);letter-spacing:.06em;text-transform:uppercase;color:var(--gris2)}
.puesto{background:var(--verde);color:#fff;padding:6px 10px;border-radius:999px;font-size:15px;font-weight:600}
.hueco{color:var(--gris3);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--papel);border:1px solid var(--linea);color:var(--verde);padding:10px 16px;min-height:44px;border-radius:22px;font:600 16px var(--cuerpo);cursor:pointer;text-align:left}
.chip.mal{border-color:var(--teja);color:var(--teja);background:var(--teja-fondo);animation:sacudir .4s}
@keyframes sacudir{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.chip.mal{animation:none}}
.pista{margin-bottom:12px}
.pregunta{font-size:22px;font-weight:600;line-height:1.3;color:var(--verde)}
.opciones{display:flex;flex-direction:column;gap:8px;margin:12px 0 14px}
.op{text-align:left;background:var(--papel);border:1px solid var(--linea);color:var(--gris);padding:12px 14px;border-radius:10px;font:400 1em var(--cuerpo);line-height:1.3;cursor:pointer}
.op.bien{background:var(--verde);color:#fff}
.op.bien b{color:var(--verde-claro)}
.op.mal{background:var(--teja-fondo);border-color:var(--teja);color:var(--teja)}
.op.apagada{opacity:.45}
.nota{background:var(--ficha);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;padding:12px 16px;margin-bottom:12px}
.nota.no{border-color:var(--teja)}
.resultado h2{font-size:44px}
#pie{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--ficha);border-top:1px solid var(--linea);box-shadow:0 -8px 24px rgba(15,66,58,.08);padding:6px 16px calc(6px + env(safe-area-inset-bottom))}
#pie .dentro{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.acto{display:flex;flex-direction:column;gap:6px}
.acto .chip{min-height:38px;padding:7px 14px;font-size:15px}
.botones .enlace{padding:6px 0;margin:0}
.botones{display:flex;align-items:center;justify-content:space-between;gap:10px}
.botones .fkicker{margin:0}
.botones .btn{padding:9px 16px;min-height:42px;font-size:16px}
.acto .guia,.acto .chips{margin:0}
.riel{display:grid;grid-template-columns:repeat(4,1fr);position:relative;padding-top:6px}
.acto+.riel{border-top:1px solid var(--linea);padding-top:10px}
.riel:before{content:"";position:absolute;left:12.5%;right:12.5%;top:calc(6px + 9px);height:2px;background:var(--linea)}
.acto+.riel:before{top:calc(10px + 9px)}
.paso{position:relative;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px var(--cuerpo);color:var(--gris2);cursor:pointer}
.paso i{width:20px;height:20px;border-radius:50%;border:2px solid var(--linea);background:var(--ficha);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;line-height:1}
.paso.hecho i{background:var(--verde);border-color:var(--verde)}
.paso.aqui i{background:var(--dorado);border-color:var(--dorado);box-shadow:0 0 0 4px rgba(232,185,82,.28);color:var(--verde)}
.paso.aqui{color:var(--verde)}
.num{font-family:var(--tit);font-weight:500;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kicker .num{font-size:15px}
.bolsa .num,.tesoro .num{font-size:1.1em}
@media (max-width:759px){body.con-pie #arriba:not(.compacto) #mapa{height:28vh;min-height:190px}}
.grupo{margin:0 0 18px}
.grupo h3{margin:18px 0 6px;font-size:20px}
.fkicker .cuenta{margin-left:6px;color:var(--gris3);letter-spacing:0;font-weight:400}
.cuadricula{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
@media (min-width:560px){.cuadricula{grid-template-columns:repeat(4,1fr)}}
@media (min-width:760px){.cuadricula{grid-template-columns:repeat(5,1fr)}}
.tarjeta{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--ficha);border:1px solid var(--linea);border-radius:12px;padding:10px 10px 8px;cursor:pointer;font-family:var(--cuerpo);color:var(--gris);min-width:0}
.tarjeta .emo{width:30px;height:30px;margin-bottom:3px}
.tarjeta .emo svg{width:30px;height:30px;display:block}
.tarjeta .tn{font:500 17px/1.1 var(--tit);color:var(--verde);max-width:100%;overflow-wrap:anywhere}
.tarjeta .tm{font-size:12px;color:var(--gris2)}
.tarjeta .tm .num{font-size:13px}
.tarjeta .listo{color:var(--verde);font-weight:700}
.tarjeta .barra{width:100%;height:3px;margin-top:7px;border-radius:2px;overflow:hidden}
.comparar .cmp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;margin:8px 0 0;padding:0;background:none;border:0;text-align:left;cursor:pointer;font-family:var(--cuerpo)}
.comparar .cn{font:500 17px var(--tit);color:var(--verde)}
.comparar .cm{font-size:13px;color:var(--gris2)}
.comparar .barra{grid-column:1/3;height:3px;border-radius:2px;overflow:hidden}
.comparar .fnota{margin-top:10px}
.quien{padding:12px 16px}
.quien .fkicker{margin-bottom:8px}
.quien .chips{margin-bottom:0}
.quien .acciones{margin:10px 0 0}
@media (min-width:760px){#mapa{height:46vh}h2{font-size:38px}#cab h1{font-size:32px}}
@media (max-width:480px){#mapa{height:34vh}}
@media (max-height:520px){#arriba{position:static}}
</style>

moderna:"La Presa Alta de Asuán (1970) domó la crecida y creó el lago Nasser; Abu Simbel tuvo que mudarse pieza por pieza. Hoy la tensión está río arriba: la Gran Presa del Renacimiento etíope, inaugurada en 2025 sobre el Nilo Azul, decide cuánta agua baja a Sudán y Egipto, y el 95 % de los egipcios vive en el valle y el delta.",
pistaAntigua:"Un jeroglífico de barco con vela significa «ir río arriba», porque el viento sopla contra la corriente.",
pistaModerna:"Una presa inaugurada en 2025 río arriba tensa a tres países que comparten su agua.",
frase:"Tres [J]otas y un [A][L][E]",fraseNota:"Tres ciudades con J en el sur; A-L-E en Egipto.",

{nombre:"Jinja",pais:"Uganda",pos:[0.42,33.2],escena:["presa","cataratas","selva"],imagen:"Un jinete salta a caballo desde el lago Victoria: aquí nace el Nilo Blanco (Jinja suena a jinete).",dato:"En Jinja el Nilo Blanco sale del lago Victoria. Las cataratas Ripon, la «fuente» que Speke identificó en 1862, quedaron bajo la represa de Owen Falls (1954)."},
{nombre:"Juba",pais:"Sudán del Sur",pos:[4.85,31.58],escena:["muelle","casas","pantano"],imagen:"Un país recién nacido con chupón: Juba es la capital de Sudán del Sur, el Estado más joven del mundo (2011).",dato:"Puerto sobre el Bahr al-Jabal, el «río de la montaña», nombre local del Nilo Blanco. Río abajo empieza el Sudd, un pantano del tamaño de Costa Rica que evapora la mitad del agua."},
{nombre:"Jartum",pais:"Sudán",pos:[15.6,32.5],escena:["mezquita","casas","piramide"],imagen:"Dos jarras, una de agua blanca y otra azul, se vacían en el mismo cauce: Jartum es la confluencia del Nilo Blanco y el Nilo Azul.",dato:"Al frente, Omdurmán, la capital del Mahdi. Río abajo, las pirámides de Meroe, capital del reino de Kush, que llegó a gobernar Egipto entero (dinastía XXV)."},
{nombre:"Asuán",pais:"Egipto",pos:[24.09,32.9],escena:["presa","duna","templo"],imagen:"Una aduana en el río: Asuán (a-duana) fue la frontera sur de Egipto en la primera catarata, y hoy la presa es la aduana del agua.",dato:"La Presa Alta (1970) creó el lago Nasser, de 500 km de largo. Abu Simbel fue cortado en bloques y subido 65 m para salvarlo del agua."},
{nombre:"Luxor",pais:"Egipto",pos:[25.7,32.64],escena:["templo","obelisco","palmera"],imagen:"Lujo (lux) de faraones: Luxor es la antigua Tebas, con Karnak en la orilla de los vivos y el Valle de los Reyes en la de los muertos.",dato:"Capital del Imperio Nuevo (c. 1550-1070 a. C.). La orilla este, donde sale el sol, era de los templos; la oeste, del ocaso, de las tumbas: Tutankamón apareció allí en 1922."},
{nombre:"El Cairo",pais:"Egipto",pos:[30.04,31.24],escena:["piramide","mezquita","rascacielos"],imagen:"El río cae (Cai-ro) en un abanico: aquí el Nilo se abre en el delta, la letra griega Δ que dio nombre a todos los deltas.",dato:"Fundada en 969 por los fatimíes junto a la antigua Menfis y las pirámides de Guiza. Es la mayor ciudad de África, con más de 20 millones de personas en su área metropolitana."}

{id:"amazonas",nombre:"Amazonas",continente:"América del Sur",escenaNace:["nieve","montaña","lago"],escenaMar:["manglar","barco","faro"],longitud:6400,mar:"Océano Atlántico (delta de Marajó)",marEn:"el Atlántico",
nace:"Andes del Perú",naceNota:"Su fuente más lejana suele situarse en el nevado Mismi, aunque se discute; el Ucayali y el Marañón forman el Amazonas cerca de Nauta. Por caudal es, de lejos, el mayor río del mundo: un quinto del agua dulce que llega a los océanos.",
antigua:"Antes de Colón la selva no estaba vacía: la «terra preta» (suelo negro fabricado por humanos) y la cerámica marajoara de la desembocadura revelan sociedades densas. En 1542 Francisco de Orellana bajó desde los Andes hasta el Atlántico, el primer europeo en cruzar el continente por agua, y bautizó el río por las guerreras que creyó ver: las amazonas de la mitología griega.",
moderna:"El auge del caucho (1879-1912) construyó el Teatro Amazonas de Manaos y la Casa de Fierro de Iquitos, y se derrumbó cuando las semillas robadas florecieron en Malasia. Hoy el río es la Zona Franca de Manaos (1967), el corredor de soya que sale por Santarém y la disputa mundial por la deforestación; Belém fue sede de la COP30 en 2025.",
pistaAntigua:"Un conquistador bajó todo el río en 1542 y lo bautizó por unas guerreras de la mitología griega.",
pistaModerna:"Un auge del caucho levantó un teatro de ópera en plena selva; se derrumbó cuando las semillas robadas florecieron en Asia.",

nace:"Meseta tibetana",naceNota:"Baja de los montes Tanggula a más de 5 000 m; en su tramo alto se llama Jinsha, «arenas doradas». Es el río más largo de Asia y el tercero del mundo.",
antigua:"El Yangtsé es la frontera natural entre el norte del trigo y el sur del arroz. En el año 208, en los Acantilados Rojos cerca de Wuhan, una flota pequeña incendió la de Cao Cao y partió a China en Tres Reinos. Cuatro siglos después la dinastía Sui abrió el Gran Canal para llevar el arroz del sur hasta el norte: el Yangtsé pasó a ser el granero del imperio.",
moderna:"La presa de las Tres Gargantas (Yichang, terminada en 2012) es la central hidroeléctrica más grande del mundo y desplazó a 1,3 millones de personas. El delta, con Shanghái a la cabeza, produce cerca de un cuarto del PIB de China, y Chongqing, río arriba, es una de las ciudades más pobladas del planeta.",
pistaAntigua:"Una batalla naval con barcos incendiados en el año 208 partió un imperio en tres reinos.",
pistaModerna:"La central hidroeléctrica más grande del mundo desplazó a más de un millón de personas en sus orillas.",

{id:"misisipi",nombre:"Misisipi",continente:"América del Norte",escenaNace:["lago","arbol","campos"],escenaMar:["pantano","barco","faro"],longitud:6275,mar:"Golfo de México",marEn:"el golfo de México",
nace:"Lago Itasca, Minnesota",naceNota:"Sale de un lago que se cruza a pie por unas piedras; con el Misuri, su afluente mayor, el sistema mide 6 275 km, el cuarto del mundo.",
antigua:"Cerca de San Luis, Cahokia fue hacia el año 1100 la ciudad más grande al norte de México, con un montículo de tierra más ancho que la Gran Pirámide. De Soto cruzó el río en 1541 y La Salle lo bajó hasta el golfo en 1682 para reclamar «Luisiana» en nombre de Luis XIV: los franceses lo usaron como carretera de pieles desde Canadá.",
moderna:"La Compra de Luisiana (1803) le dio a Estados Unidos el río entero y duplicó el país. Los vapores de Mark Twain dieron paso a las barcazas: por aquí sale cerca del 60 % del grano que exporta Estados Unidos, con esclusas desde Mineápolis y puertos hasta Nueva Orleans. El Old River Control impide que el río se escape por el Atchafalaya.",
pistaAntigua:"Junto a este río, una ciudad de montículos de tierra fue hacia 1100 la mayor de su continente al norte de México.",
pistaModerna:"Por este río sale más de la mitad del grano que exporta su país; una obra de ingeniería impide que cambie de cauce.",

{nombre:"Memphis",pais:"Estados Unidos",pos:[35.15,-90.05],escena:["puente","casas","barco"],imagen:"Elvis toca una guitarra hecha de algodón: Memphis fue el mercado del algodón del Sur y la cuna del blues y el rock.",dato:"Bautizada en 1819 por la Menfis egipcia: ambas, capitales junto a un gran río. Beale Street, Sun Records, Graceland; Martin Luther King fue asesinado aquí en 1968."},
{nombre:"Baton Rouge",pais:"Estados Unidos",pos:[30.45,-91.19],escena:["fabrica","barco","campos"],imagen:"Un bastón rojo clavado en la orilla: así marcaban los pueblos houma y bayagoula el límite de sus tierras de caza. Hoy las rojas son las chimeneas.",dato:"Capital de Luisiana y el puerto más interior que recibe buques de altura. El corredor petroquímico hasta Nueva Orleans concentra más de cien plantas."},
{nombre:"Nueva Orleans",pais:"Estados Unidos",pos:[29.95,-90.07],escena:["casas","barco","mercado"],imagen:"Una trompeta sale del agua en una media luna: Nueva Orleans, la Crescent City, está en una curva del río y bajo el nivel del mar.",dato:"Fundada por Francia en 1718, española de 1763 a 1800, comprada por Estados Unidos en 1803. Katrina (2005) rompió los diques; el delta se hunde y pierde tierra cada año."}
]},
{id:"danubio",nombre:"Danubio",continente:"Europa",escenaNace:["montaña","arbol","casas"],escenaMar:["pantano","aves","faro"],longitud:2850,mar:"Mar Negro",marEn:"el mar Negro",
nace:"Selva Negra",naceNota:"Nace en Donaueschingen, Alemania, y cruza diez países: más que ningún otro río del mundo. Es el único que pasa por cuatro capitales.",
antigua:"Durante cuatro siglos el Danubio fue el limes, la frontera del Imperio romano: Vindobona (Viena), Aquincum (Budapest) y Singidunum (Belgrado) nacieron como campamentos de legiones. Por el río bajaron las cruzadas hacia Constantinopla y por él subieron los otomanos hasta las puertas de Viena, en 1529 y 1683.",
moderna:"El canal Rin-Meno-Danubio (1992) permite que una barcaza vaya de Rotterdam al mar Negro sin tocar el mar. Las presas de las Puertas de Hierro (Serbia-Rumanía) lo represan en su cañón, y el delta, patrimonio de la humanidad, es el mayor humedal de Europa.",
pistaAntigua:"Fue la frontera del Imperio romano durante siglos; tres capitales actuales nacieron como campamentos de legiones en su orilla.",
pistaModerna:"Un canal de 1992 permite que una barcaza vaya del mar del Norte al mar Negro por su cauce.",
frase:"[U]n [R]ey [P]asó [L]ento por la [V] y las tres [B]",fraseNota:"La V y las tres B son las cuatro capitales: Viena, Bratislava, Budapest, Belgrado.",

ciudades:[
{nombre:"Ulm",pais:"Alemania",pos:[48.4,9.99],escena:["iglesia","casas","puente"],imagen:"Una U con un campanario dentro: la catedral de Ulm tuvo durante más de un siglo la torre de iglesia más alta del mundo (161 m).",dato:"Aquí empieza la navegación histórica: las «cajas de Ulm» eran barcazas de un solo viaje que bajaban colonos hasta Viena y se vendían como madera. Einstein nació en Ulm."},
{nombre:"Ratisbona",pais:"Alemania",pos:[49.01,12.1],escena:["puente","iglesia","casas"],imagen:"Una rata cruza un puente de piedra medieval: el Puente de Piedra de Ratisbona (1146) fue durante siglos el único sobre el Danubio.",dato:"Castra Regina para los romanos; sede de la Dieta Perpetua del Sacro Imperio (1663-1806). Su centro medieval está intacto."},
{nombre:"Passau",pais:"Alemania",pos:[48.57,13.46],escena:["puente","iglesia","montaña"],imagen:"Tres ríos se hacen un pase: en Passau confluyen el Inn (verde), el Ilz (negro) y el Danubio (azul).",dato:"La «ciudad de los tres ríos», en la frontera con Austria. El Inn trae aquí más agua que el propio Danubio."},
{nombre:"Linz",pais:"Austria",pos:[48.3,14.29],escena:["fabrica","iglesia","casas"],imagen:"Una tarta Linzer con enrejado de masa: el enrejado son los puentes de Linz.",dato:"Ciudad industrial del acero y ciudad de Bruckner. La Linzer Torte es una de las tartas más antiguas con receta escrita (1653)."},
{nombre:"Viena",pais:"Austria",pos:[48.21,16.37],escena:["iglesia","castillo","puente"],imagen:"Un vals sobre el agua: «El Danubio azul» de Strauss, aunque en Viena el río es café.",dato:"Vindobona romana; según la tradición, Marco Aurelio murió aquí en 180. Capital de los Habsburgo; los otomanos la sitiaron en 1529 y 1683 y no pasaron."},
{nombre:"Bratislava",pais:"Eslovaquia",pos:[48.15,17.11],escena:["castillo","puente","casas"],imagen:"Dos hermanos (brat) a 60 km: Bratislava y Viena son dos de las capitales más cercanas del mundo.",dato:"Presburgo para austriacos y húngaros; aquí se coronaron los reyes de Hungría durante 250 años. Un castillo blanco vigila el río."},
{nombre:"Budapest",pais:"Hungría",pos:[47.5,19.04],escena:["castillo","puente","iglesia"],imagen:"Buda arriba en la colina, Pest abajo en el llano y el río en medio: dos ciudades unidas en 1873, con el Puente de las Cadenas entre ellas.",dato:"Aquincum romana; baños termales sobre fallas geológicas; el Parlamento neogótico mira al río. Ocupada por los otomanos durante 145 años."},
{nombre:"Belgrado",pais:"Serbia",pos:[44.82,20.46],escena:["castillo","puente","casas"],imagen:"La ciudad blanca (beo-grad) donde el Sava entra: la fortaleza de Kalemegdan vigila la confluencia.",dato:"Singidunum romana; destruida y reconstruida decenas de veces por estar en la frontera entre imperios. Río abajo el Danubio se estrecha en las Puertas de Hierro."}
]},
{id:"rin",nombre:"Rin",continente:"Europa",escenaNace:["nieve","montaña","lago"],escenaMar:["barco","faro","grua"],longitud:1230,mar:"Mar del Norte",marEn:"el mar del Norte",
nace:"Alpes suizos",naceNota:"Baja de los Grisones, cruza el lago de Constanza y salta las cataratas de Schaffhausen, las más caudalosas de Europa.",
antigua:"El Rin fue la otra frontera del Imperio romano: Colonia, Maguncia y Coblenza empezaron como campamentos. En la Edad Media los barones de la garganta del Rin, entre Maguncia y Coblenza, cobraban peaje desde sus castillos, y la leyenda de Lorelei explicaba los naufragios. En Maguncia, hacia 1455, Gutenberg imprimió la primera Biblia.",
moderna:"Es la vía fluvial más transitada de Europa: Rotterdam es el mayor puerto del continente y Duisburgo el mayor puerto interior. Tulla lo enderezó en el siglo XIX y la Convención de Mannheim (1868) garantizó la navegación libre. Las sequías de 2018 y 2022 lo dejaron tan bajo que las barcazas viajaron casi vacías.",
pistaAntigua:"Junto a este río, un orfebre inventó la imprenta de tipos móviles hacia 1450.",
pistaModerna:"La vía fluvial más transitada de Europa; su mayor puerto marítimo y su mayor puerto interior están en el mismo cauce.",
frase:"[B]asilea [E]nvía [M]ercancía por [C]oblenza y [C]olonia a [D]uisburgo y [R]otterdam",fraseNota:"La frase es, literalmente, la ruta comercial moderna.",

{nombre:"Estrasburgo",pais:"Francia",pos:[48.57,7.75],escena:["iglesia","casas","puente"],imagen:"Una ciudad de calles (Strasse-burg) que cambió de país cinco veces: Estrasburgo es hoy sede del Parlamento Europeo.",dato:"Catedral gótica de arenisca rosada; Gutenberg vivió aquí antes de Maguncia. Francesa, alemana (1871), francesa (1918), alemana (1940), francesa (1944)."},
{nombre:"Maguncia",pais:"Alemania",pos:[50.0,8.27],escena:["iglesia","casas","barco"],imagen:"Letras de plomo flotando en el río: en Maguncia Gutenberg imprimió la Biblia de 42 líneas hacia 1455.",dato:"Confluencia con el Meno, de donde sale el canal hacia el Danubio. Mogontiacum romana; sede del arzobispo elector más poderoso del Sacro Imperio."},

{nombre:"Colonia",pais:"Alemania",pos:[50.94,6.96],escena:["iglesia","puente","tren"],imagen:"Dos torres góticas y un frasco de perfume: la catedral de Colonia (157 m) y el agua de colonia (1709).",dato:"Colonia Claudia Ara Agrippinensium, fundada como colonia romana en el año 50. La catedral tardó 632 años en terminarse (1248-1880)."},
{nombre:"Duisburgo",pais:"Alemania",pos:[51.43,6.76],escena:["grua","fabrica","barco"],imagen:"Un garaje de grúas: Duisburgo es el mayor puerto interior de Europa, la puerta del Ruhr.",dato:"Confluencia con el Ruhr; terminal de los trenes de carga que llegan desde China por la nueva Ruta de la Seda."},
{nombre:"Rotterdam",pais:"Países Bajos",pos:[51.92,4.48],escena:["grua","barco","rascacielos"],imagen:"El río se rinde al mar en un puerto de 40 km: Rotterdam, el mayor de Europa.",dato:"Delta del Rin y el Mosa. Arrasada por bombardeos en 1940 y reconstruida en vidrio y acero; gran parte de la ciudad está bajo el nivel del mar."}

{id:"ganges",nombre:"Ganges",continente:"Asia",escenaNace:["nieve","montaña","cataratas"],escenaMar:["manglar","pantano","barco"],longitud:2525,mar:"Bahía de Bengala",marEn:"la bahía de Bengala",
nace:"Glaciar Gangotri",naceNota:"Sale de una cueva de hielo llamada Gaumukh, «boca de vaca», a 4 000 m en el Himalaya. Con el Brahmaputra forma el delta más grande del mundo.",
antigua:"La llanura del Ganges fue el corazón de los imperios Maurya y Gupta, gobernados desde Pataliputra (Patna); Ashoka extendió el budismo desde aquí después de que Buda diera su primer sermón en Sarnath, junto a Benarés. Es el río sagrado del hinduismo: bañarse en él borra el karma, y la Grand Trunk Road, la carretera más antigua de Asia, corre paralela a su orilla.",
moderna:"Más de 400 millones de personas viven en su cuenca y es uno de los ríos más contaminados del mundo; el programa Namami Gange (2014) intenta limpiarlo. La presa de Farakka (1975) desvía agua hacia Calcuta y enfrenta a India con Bangladés; el delta de los Sundarbans se hunde con el nivel del mar.",
pistaAntigua:"Un emperador difundió el budismo desde una capital en su orilla; el primer sermón del Buda ocurrió a pocos kilómetros del río.",
pistaModerna:"Una presa de 1975 desvía su agua hacia un puerto y enfrenta a dos países; su delta es el mayor del mundo.",
frase:"[H]oy [K]arma [P]uro [B]endice [P]eregrinos [C]ansados",

{nombre:"Prayagraj",pais:"India",pos:[25.44,81.85],escena:["templo","mercado","puente"],imagen:"Tres trenzas de agua: el Ganges, el Yamuna y el invisible Saraswati se unen en Prayagraj, y cada doce años se reúne allí la mayor multitud del planeta.",dato:"Antes Allahabad. El Kumbh Mela de 2025 congregó a cientos de millones de personas en pocas semanas. Cuna de Nehru."},

{nombre:"Patna",pais:"India",pos:[25.6,85.14],escena:["casas","puente","campos"],imagen:"Ashoka planta su pata en Pataliputra: Patna fue la capital de los imperios Maurya y Gupta.",dato:"Hacia el 300 a. C. Pataliputra fue una de las mayores ciudades del mundo; el griego Megástenes la describió como embajador."},
{nombre:"Calcuta",pais:"India",pos:[22.57,88.36],escena:["puente","rascacielos","grua"],imagen:"La última puerta antes del mar: Calcuta, capital del Raj británico hasta 1911, sobre el Hooghly, brazo del delta.",dato:"Kolkata creció desde una factoría de la Compañía de las Indias (1690). El puente Howrah cruza el Hooghly; río abajo, los manglares de los Sundarbans y sus tigres."}
]},
{id:"volga",nombre:"Volga",continente:"Europa",escenaNace:["arbol","lago","pantano"],escenaMar:["pantano","aves","barco"],longitud:3530,mar:"Mar Caspio",marEn:"el mar Caspio",
nace:"Colinas de Valdái",naceNota:"Nace en un pantano a 228 m sobre el mar y termina en un mar cerrado, el Caspio, 28 m bajo el nivel del océano. Es el río más largo de Europa.",
antigua:"Entre los siglos VIII y XI la «ruta del Volga» llevó a los vikingos varegos con pieles y esclavos hasta los jázaros y el califato; las monedas de plata árabes que se desentierran en Suecia vinieron por aquí. Los mongoles fundaron Sarái, capital de la Horda de Oro, junto a la desembocadura. Iván el Terrible tomó Kazán (1552) y Astracán (1556), y Moscú se quedó con el río entero.",
moderna:"El canal Volga-Don (1952) y el Volga-Báltico hicieron de Moscú un «puerto de cinco mares». Una cascada de presas convirtió el río en una cadena de embalses. Stalingrado (Volgogrado, 1942-1943) fue el giro de la Segunda Guerra Mundial. Hoy el Caspio baja de nivel y el esturión del caviar casi desapareció.",
pistaAntigua:"Los vikingos lo bajaron para comerciar con un califato; por eso hay monedas árabes enterradas en Suecia.",
pistaModerna:"Un canal de 1952 lo conectó con otro río y convirtió a una capital lejana en «puerto de cinco mares».",
frase:"[T]res [Y]eguas [N]egras [K]abalgan [S]in [V]er [A]trás",fraseNota:"Kabalgan con K por Kazán. Las yeguas son la estepa y la Horda de Oro.",

{nombre:"Tver",pais:"Rusia",pos:[56.86,35.9],escena:["iglesia","casas","puente"],imagen:"Ver el río recién nacido: en Tver el Volga todavía cabe bajo un puente corto.",dato:"Rival de Moscú en el siglo XIV; hoy ciudad de paso entre Moscú y San Petersburgo. Río arriba, en Valdái, el Volga nace en un pantano."},
{nombre:"Yaroslavl",pais:"Rusia",pos:[57.63,39.87],escena:["iglesia","castillo","casas"],imagen:"Un príncipe mata un oso con un hacha: Yaroslavl lleva ese oso en su escudo desde su fundación (1010).",dato:"Parte del Anillo de Oro; su centro es patrimonio de la humanidad. Aquí el Volga gira hacia el sureste."},

{nombre:"Astracán",pais:"Rusia",pos:[46.35,48.04],escena:["castillo","barco","pantano"],imagen:"Un gorro de astracán y una lata de caviar: en el delta, el río se deshace en cientos de brazos antes del Caspio.",dato:"Antiguo puerto jázaro y tártaro, tomada en 1556. Puerta de Persia e India para los mercaderes rusos; el delta es la reserva del esturión."}

{id:"tigris",nombre:"Tigris",continente:"Asia",escenaNace:["montaña","nieve","campos"],escenaMar:["barco","palmera","faro"],longitud:1900,mar:"Golfo Pérsico (Shatt al-Arab)",marEn:"el golfo Pérsico",
nace:"Montes Tauro",naceNota:"Nace en el este de Turquía, a pocos kilómetros del Éufrates, su gemelo; los dos se juntan en Al-Qurna y forman el Shatt al-Arab. Entre ambos: Mesopotamia.",
antigua:"Mesopotamia, «entre ríos», es donde Sumer inventó la escritura (Uruk, hacia 3300 a. C.), la rueda y la ciudad. Asiria gobernó desde Nínive, frente a Mosul; los partos y sasánidas desde Ctesifonte. En 762 el califa Al-Mansur fundó Bagdad, la ciudad redonda: en el siglo IX era la mayor del mundo y en su Casa de la Sabiduría se tradujo a Aristóteles. En 1258 los mongoles la saquearon y, dice la leyenda, el Tigris corrió negro de tinta.",
moderna:"Las presas turcas del proyecto GAP (Ilısu, 2020) reducen el caudal que llega a Irak, y la presa de Mosul, construida sobre yeso soluble, es considerada la más peligrosa del mundo. Saddam drenó los pantanos del sur en los años noventa; se están recuperando. Basora exporta la mayor parte del petróleo iraquí por el Shatt al-Arab. Su gemelo, el Éufrates, pasa por Raqqa, Faluya y las ruinas de Babilonia y Ur.",
pistaAntigua:"Una ciudad redonda fundada en 762 en su orilla fue la mayor del mundo; siglos después una biblioteca entera terminó en sus aguas.",
pistaModerna:"Una presa río arriba, construida sobre yeso, es considerada la más peligrosa del mundo; otro país controla su caudal.",
frase:"[D]os [M]ercaderes [T]raen [S]edas a [B]agdad y [B]asora",

{nombre:"Tikrit",pais:"Irak",pos:[34.6,43.68],escena:["castillo","duna","casas"],imagen:"Un tic-tac de 800 años: Saladino nació en Tikrit en 1137 y Saddam Hussein a unos kilómetros, en 1937.",dato:"Ciudad natal del sultán que reconquistó Jerusalén (1187) y del dictador que gobernó Irak (1979-2003)."},

{id:"mekong",nombre:"Mekong",continente:"Asia",escenaNace:["nieve","montaña","hielo"],escenaMar:["manglar","barco","campos"],longitud:4350,mar:"Mar de China Meridional",marEn:"el mar de China Meridional",
nace:"Meseta tibetana",naceNota:"En China se llama Lancang; recorre seis países, más que ningún otro río de Asia.",
antigua:"En el delta, el reino de Funan (siglos I-VI) comerciaba con Roma y la India desde el puerto de Óc Eo, donde aparecieron monedas romanas. El Imperio jemer de Angkor vivió del pulso del Tonlé Sap: cada monzón ese afluente invierte su curso y llena el lago de agua y peces. La expedición francesa de 1866-1868 buscó por aquí una ruta comercial a China y fracasó ante los rápidos de Khone.",
moderna:"China construyó once presas en el Lancang y Laos, la «batería de Asia», exporta hidroelectricidad (Xayaburi, 2019); juntas alteran el pulso del que dependen millones de pescadores. El delta produce cerca de la mitad del arroz de Vietnam, pero se hunde y se saliniza. Seis países y una Comisión del Río Mekong (1995) en la que China no participa.",
pistaAntigua:"Un imperio de templos vivía de un lago que se llena porque un afluente de este río invierte su curso cada monzón.",

{id:"niger",nombre:"Níger",continente:"África",escenaNace:["montaña","selva","arbol"],escenaMar:["manglar","barco","fabrica"],longitud:4200,mar:"Golfo de Guinea",marEn:"el golfo de Guinea",
nace:"Tierras altas de Guinea",naceNota:"Nace a solo 240 km del Atlántico, pero le da la espalda: corre hacia el Sáhara, gira en Gao y baja hasta el golfo de Guinea. Un bumerán de 4 200 km.",
antigua:"Los imperios de Ghana, Malí y Songhai crecieron donde el río se acerca al desierto: por el Níger subía el oro y por las caravanas bajaba la sal, y en Tombuctú se cambiaban por libros. Mansa Musa cruzó a La Meca en 1324 con tanto oro que hundió su precio en El Cairo. Europa no supo hacia dónde corría el río hasta que Mungo Park lo vio en 1796; los hermanos Lander encontraron la desembocadura en 1830.",
moderna:"El delta del Níger es el petróleo de Nigeria: contaminación, quema de gas y conflicto. La presa de Kainji (1968) fue la primera grande; el delta interior, junto a Mopti, alimenta a millones con sus crecidas. Bamako, Niamey y el Sahel son hoy la franja más inestable de África.",
pistaAntigua:"Un emperador cruzó el desierto hacia La Meca en 1324 con tanto oro que hundió su precio en Egipto.",
pistaModerna:"Su delta concentra el petróleo de un país y la quema de gas ilumina los manglares de noche.",
frase:"[B]umerán: [M]alí [T]ira, [G]ira, [N]igeria [L]lega al [P]etróleo",fraseNota:"La frase también cuenta la forma del río: sube hacia el Sáhara, gira en Gao y baja al petróleo.",

{id:"parana",nombre:"Paraná",continente:"América del Sur",escenaNace:["presa","campos","arbol"],escenaMar:["barco","faro","aves"],longitud:4880,mar:"Río de la Plata (Atlántico)",marEn:"el Río de la Plata",
nace:"Confluencia del Paranaíba y el Grande",naceNota:"Se forma en Brasil, hace de frontera con Paraguay y luego con Argentina; con el Río de la Plata es el segundo sistema fluvial de Sudamérica.",
antigua:"Solís entró al Río de la Plata en 1516 y murió a manos de los charrúas; Caboto subió el Paraná en 1527 buscando la sierra de la plata (Potosí): de ahí el nombre. Entre 1609 y 1767 los jesuitas y los guaraníes levantaron treinta misiones en sus orillas. La Guerra de la Triple Alianza (1864-1870) se libró por el control del río; la fortaleza de Humaitá lo cerraba con cadenas.",
moderna:"Itaipú (1984, Brasil-Paraguay) fue la mayor hidroeléctrica del mundo hasta las Tres Gargantas; Yacyretá completa el sistema. La Hidrovía Paraguay-Paraná (3 400 km) saca la soya de Bolivia, Paraguay y Argentina por Rosario, el mayor complejo agroexportador del mundo. El dragado y los peajes son pleito permanente entre los países.",
pistaAntigua:"Su nombre viene de una sierra de plata que los conquistadores buscaban río arriba; una guerra del siglo XIX se libró por controlarlo.",
pistaModerna:"Una hidrovía de 3 400 km saca la soya de tres países por el mayor complejo agroexportador del mundo.",
frase:"[F]ernando [E]l [C]hamamecero [R]asguea [B]ien la [M]ilonga",fraseNota:"Chamamé en Corrientes, milonga en Buenos Aires y Montevideo.",

{nombre:"Montevideo",pais:"Uruguay",pos:[-34.9,-56.16],escena:["faro","casas","barco"],imagen:"«Monte vide eu»: un vigía vio un monte (el Cerro) y así, dice la leyenda, se nombró la última orilla antes del Atlántico.",dato:"Fundada por los españoles en 1726 para frenar a los portugueses de Colonia del Sacramento. Su rambla de 22 km bordea el estuario."}
]},
{id:"indo",nombre:"Indo",continente:"Asia",escenaNace:["nieve","montaña","lago"],escenaMar:["manglar","barco","duna"],longitud:3180,mar:"Mar Arábigo",marEn:"el mar Arábigo",
nace:"Tíbet, junto al Kailash",naceNota:"Nace cerca del monte sagrado del budismo y el hinduismo, cruza Ladakh y entra en Pakistán entre las montañas más altas del mundo.",
antigua:"La civilización del valle del Indo (2600-1900 a. C.), con Harappa y Mohenjo-daro, tuvo ciudades planificadas con alcantarillado antes que Roma, y su escritura sigue sin descifrarse. Alejandro Magno bajó el río en 326-325 a. C. La palabra India viene del Indo: Sindhu en sánscrito, Hindu en persa, Indos en griego.",
moderna:"El Tratado de Aguas del Indo (1960), mediado por el Banco Mundial, repartió sus ríos entre India y Pakistán; India lo dejó en suspenso en 2025. Sus canales forman el mayor sistema de riego contiguo del mundo y la presa de Tarbela (1976) es una de las mayores de tierra. Las inundaciones de 2010 y 2022 llegaron a cubrir hasta un tercio de Pakistán, y el delta se seca por falta de caudal.",
pistaAntigua:"Sus ciudades de hace 4 500 años tenían alcantarillado; su escritura sigue sin descifrarse.",
pistaModerna:"Un tratado de 1960 mediado por el Banco Mundial reparte sus aguas entre dos países rivales con armas nucleares.",
frase:"[L]eones [S]edientos [A]traviesan [S]ind [H]asta [K]arachi",fraseNota:"Sind es la provincia de Sukkur; Hasta, por Hyderabad.",

ciudades:[
{nombre:"Leh",pais:"India",pos:[34.16,77.58],escena:["castillo","montaña","nieve"],imagen:"Un hilo verde en un desierto de altura: en Leh, a 3 500 m, el Indo es una franja de álamos entre montañas ocres.",dato:"Capital de Ladakh, budista y tibetana; antiguo alto de las caravanas entre Cachemira y Asia Central."},
{nombre:"Skardu",pais:"Pakistán",pos:[35.3,75.63],escena:["nieve","montaña","castillo"],imagen:"Una K de K2: Skardu es la puerta del Karakórum y de la segunda montaña más alta del mundo.",dato:"Aquí el Indo recibe el Shigar y gira al oeste entre las montañas más altas del planeta; su cañón bajo el Nanga Parbat es uno de los más profundos que existen."},
{nombre:"Attock",pais:"Pakistán",pos:[33.9,72.25],escena:["castillo","puente","montaña"],imagen:"Un puente de barcas y un fuerte mogol: en Attock entra el río Kabul y por aquí cruzaron todos los conquistadores.",dato:"Alejandro cruzó el Indo cerca de aquí (326 a. C.); Akbar levantó el fuerte en 1583 para guardar el vado. Río arriba está la presa de Tarbela."},
{nombre:"Sukkur",pais:"Pakistán",pos:[27.7,68.87],escena:["presa","puente","palmera"],imagen:"Sesenta y seis compuertas reparten el río como una regadera: la presa de Sukkur (1932) riega todo Sind.",dato:"Cerca está Mohenjo-daro, «el montículo de los muertos», la gran ciudad del valle del Indo, descubierta en 1922."},
{nombre:"Hyderabad",pais:"Pakistán",pos:[25.38,68.37],escena:["castillo","casas","campos"],imagen:"Ventiladores de viento en los techos: Hyderabad (la de Pakistán, no la de India) captura la brisa del Indo con torres de viento.",dato:"Capital de los emires talpur de Sind hasta la conquista británica (1843). Aquí termina el ferrocarril colonial y empieza el delta."},
{nombre:"Karachi",pais:"Pakistán",pos:[24.86,67.0],escena:["rascacielos","grua","barco"],imagen:"Veinte millones de personas en la boca de un río que ya casi no llega: Karachi, al borde del delta del Indo.",dato:"Mayor ciudad de Pakistán y su puerto. El delta, sin caudal, retrocede ante el mar Arábigo y sus manglares se salinizan."}
]},
{id:"congo",nombre:"Congo",continente:"África",escenaNace:["pantano","lago","campos"],escenaMar:["barco","manglar","faro"],longitud:4700,mar:"Océano Atlántico (en Banana)",marEn:"el Atlántico",
nace:"Meseta de Katanga",naceNota:"Nace como Lualaba en la meseta de Katanga, en el sureste del Congo, a unos 1 400 m; su fuente más lejana es el Chambeshi, en Zambia. Solo en Kisangani, después de las cataratas Boyoma, toma el nombre de Congo. Con unos 4 700 km es el segundo río de África, el segundo del mundo por caudal y el más profundo: pasa de 200 m en algunos tramos.",antigua:"El reino del Kongo, en la desembocadura, ya tenía rey y capital cuando el portugués Diogo Cão llegó al estuario en 1482 y plantó un padrón de piedra; el reino se hizo cristiano y sus reyes se cartearon con Lisboa. Nadie en Europa supo de dónde venía el río hasta que Stanley lo bajó entero entre 1874 y 1877, en un viaje de 999 días desde Zanzíbar hasta Boma. Después el rey Leopoldo II de Bélgica se quedó con la cuenca como propiedad privada, el Estado Libre del Congo (1885-1908): el trabajo forzado del caucho costó millones de vidas, según la mayoría de los cálculos, y su denuncia fue una de las primeras campañas mundiales por los derechos humanos.",moderna:"Hoy el río es la carretera del país: los convoyes de barcazas tardan semanas entre Kinshasa y Kisangani con mercados a bordo, y en las orillas se cambia pescado, mandioca y aceite de palma. Kinshasa y Brazzaville, capitales de dos países, se miran a través del agua. Las presas de Inga (1972 y 1982), en las cataratas Livingstone, dan luz a las minas de Katanga, y el proyecto Gran Inga sería la central más grande del mundo, pero lleva décadas en planos.",pistaAntigua:"Un navegante lo encontró desde el mar hace cinco siglos, un explorador lo bajó entero en tres años y un rey europeo convirtió su cuenca en finca privada.",pistaModerna:"Dos capitales que se miran a través del agua y unas cataratas donde una presa podría dar luz a medio continente.",frase:"[B]uscá [K]ilos: [K]iwis, [M]angos, [K]akis, [M]elones, [B]ananos",fraseNota:"Lista de mercado con siete kilos, uno por parada; el kaki es el caqui, la fruta naranja.",

ciudades:[{nombre:"Bukama",pais:"República Democrática del Congo",pos:[-9.2,25.85],escena:["pantano","tren","barco"],imagen:"Una vaca (Bu-kama) dormida en una cama flotante entre papiros: aquí el Lualaba se estira en lagos y pantanos y por fin se deja navegar.",dato:"Puerto del alto Lualaba, donde el río se vuelve navegable, y estación del tren que sube al cobre de Katanga: en el siglo XX la «vía nacional» del Congo alternaba tren y barco para sacar el cobre hasta el Atlántico. Alrededor está la depresión de Upemba, con decenas de lagos y un parque nacional desde 1939."},
{nombre:"Kindu",pais:"República Democrática del Congo",pos:[-2.95,25.92],escena:["tren","barco","selva"],imagen:"Un kínder (Kin-du) de barcazas aprende a subirse al tren: en Kindu la carga baja del vagón al río, o del río al vagón.",dato:"Capital de la provincia de Maniema y puerto del tramo navegable que llega hasta Ubundu, unos 300 km río abajo; de ahí, desde 1906, un tren de 125 km rodea las siete cataratas Boyoma hasta Kisangani. Otro tren une Kindu con el lago Tanganica."},
{nombre:"Kisangani",pais:"República Democrática del Congo",pos:[0.52,25.2],escena:["cataratas","selva","muelle"],imagen:"Un pescador le tira un beso (Kis-angani) a la catarata mientras cuelga trampas de madera sobre el torrente: así pescan los wagenia desde hace siglos.",dato:"Nació en 1883 como estación de Stanley junto a las cataratas Boyoma: siete saltos en cien kilómetros por los que pasa más agua que por ninguna otra catarata del mundo. Los wagenia pescan en ellas con andamios de madera y trampas cónicas. Aquí el Lualaba pasa a llamarse Congo y empieza el tramo navegable de 1 700 km hasta Kinshasa."},
{nombre:"Mbandaka",pais:"República Democrática del Congo",pos:[0.05,18.26],escena:["selva","lago","barco"],imagen:"Una banda (M-banda-ka) toca con un pie en cada hemisferio: por Mbandaka pasa el ecuador, y el río, ancho como un mar, no se decide de lado.",dato:"Fundada por Stanley en 1883 como Équateur, porque la línea del ecuador pasa por aquí: el Congo es el único gran río que cruza el ecuador dos veces. Frente a la ciudad mide hasta quince kilómetros de ancho, lleno de islas, y recibe al Ruki; el jardín botánico de Eala, de 1900, está a la salida."},
{nombre:"Kinshasa",pais:"República Democrática del Congo",pos:[-4.32,15.31],escena:["rascacielos","mercado","barco"],imagen:"Dos capitales frente a frente, una en cada orilla, y un boxeador con corona (Kin-shasa) que cruza en balsa para pelear: Kinshasa y Brazzaville, a un río de distancia.",dato:"Kinshasa y Brazzaville son las capitales más cercanas del mundo: se ven a través del Pool Malebo, un ensanche del río de 35 km. Kinshasa, la Léopoldville de 1881, pasa de 15 millones de habitantes y es la mayor ciudad de habla francesa; en 1974 recibió la pelea de Ali y Foreman. Río abajo empiezan las cataratas Livingstone: 350 km de rápidos que ningún barco pasa."},
{nombre:"Matadi",pais:"República Democrática del Congo",pos:[-5.82,13.45],escena:["puente","muelle","montaña"],imagen:"Una mata de piedras (Mata-di, «piedras» en kikongo) con un puente colgante encima: en Matadi los barcos del mar ya no pueden subir más.",dato:"Puerto de mar del Congo, a 150 km del Atlántico, hasta donde suben los barcos grandes; desde 1898 el tren a Kinshasa rodea las cataratas. Su puente colgante (1983) es el más largo de África, con 722 m de vano. Cerca, en la roca de Yelala, Diogo Cão grabó su nombre en 1485."},
{nombre:"Boma",pais:"República Democrática del Congo",pos:[-5.85,13.05],escena:["muelle","casas","arbol"],imagen:"Un baobab con bigote de capitán (Bo-ma) que fue capital y ahora mira pasar los barcos hacia el mar.",dato:"Capital del Estado Libre del Congo y del Congo Belga entre 1886 y 1923, cuando la capital pasó a Léopoldville. Puerto viejo en la orilla norte del estuario, con un baobab gigante junto al que, dicen, acampó Stanley. Río abajo, en Banana, el Congo entra al Atlántico y sigue bajo el mar por un cañón de 800 km."}]},
{id:"huanghe",nombre:"Huang He",continente:"Asia",escenaNace:["nieve","montaña","lago"],escenaMar:["fabrica","aves","faro"],longitud:5464,mar:"Golfo de Bohai",marEn:"el golfo de Bohai",
nace:"Montes Bayan Har, meseta tibetana",naceNota:"Nace en los montes Bayan Har, en Qinghai, a unos 4 500 m, y pasa por los lagos Gyaring y Ngoring antes de bajar a la meseta de loes. Con 5 464 km es el segundo río de China y el sexto del mundo, y arrastra más barro que ningún otro: de ahí el color y el nombre, río Amarillo.",antigua:"En sus orillas nacieron las primeras dinastías chinas, Xia, Shang y Zhou, y capitales como Anyang, Luoyang y Kaifeng: por eso lo llaman la cuna de China. Pero también «la pena de China»: el barro del loes le levanta el lecho, rompe los diques y en dos mil quinientos años cambió de curso más de veinte veces; la inundación de 1887 mató a cientos de miles de personas, quizá más de un millón. Los emperadores medían su mandato del cielo por los diques.",moderna:"Hoy lo sujetan presas como Sanmenxia (1960), que se llenó de barro, y Xiaolangdi (2001), que cada verano abre las compuertas y lanza un chorro amarillo para limpiar el cauce. En los años noventa el río dejó de llegar al mar durante meses por tanto riego: 226 días en 1997. En el delta, que crece cada año, está el campo petrolero de Shengli, y en Kaifeng el río corre por encima de la ciudad, entre diques, a unos diez metros sobre las calles.",pistaAntigua:"Cuna de las primeras dinastías de su país y a la vez su pena: cambió de curso más de veinte veces y sus diques medían el poder del emperador.",pistaModerna:"Corre por encima de una ciudad, entre diques, y en los años noventa dejó de llegar al mar durante meses.",frase:"[L]a [Y]egua [B]aila [Z]amba, [K]iwi [J]uega al [D]ragón",fraseNota:"Siete palabras absurdas, siete paradas; el dragón es la carpa que saltó la Puerta del Dragón.",

ciudades:[{nombre:"Lanzhou",pais:"China",pos:[36.06,103.83],escena:["puente","balsa","casas"],imagen:"Un lanchón (Lan-zhou) que cruza el río lleno de fideos: en Lanzhou inventaron los fideos de carne estirados a mano y el primer puente de hierro sobre el Amarillo.",dato:"Capital de Gansu, ciudad de paso de la Ruta de la Seda y de norias de madera que sacan agua para el riego. El puente Zhongshan (1909), de hierro, fue el primero permanente sobre el Huang He; los fideos lamian de Lanzhou se comen en toda China. Durante siglos el río se bajaba en balsas de pieles de oveja infladas."},
{nombre:"Yinchuan",pais:"China",pos:[38.47,106.27],escena:["campos","duna","castillo"],imagen:"Un yin y un yang de arroz (Yin-chuan) en medio del desierto: canales de dos mil años riegan Ningxia mientras el resto del río hace daño.",dato:"Capital de Ningxia, oasis de arroz y bayas de goji al borde del desierto gracias a canales que empezaron con los Qin y los Han, hace más de dos mil años. Un dicho chino dice que el Huang He hace daño en todas partes y solo enriquece a Ningxia. Cerca están las tumbas de los reyes de Xia Occidental, del siglo XI."},
{nombre:"Baotou",pais:"China",pos:[40.65,109.84],escena:["fabrica","duna","vaca"],imagen:"Un bao de acero al vapor (Bao-tou) en lo alto de la curva: en Baotou el río hace su gran vuelta hacia el sur y la ciudad funde hierro.",dato:"Ciudad del acero de Mongolia Interior, en el vértice norte del gran recodo con que el río rodea la meseta de Ordos. Su nombre en mongol quiere decir «lugar de ciervos». Cerca, en Bayan Obo, está el yacimiento de tierras raras más grande del mundo."},
{nombre:"Zhengzhou",pais:"China",pos:[34.75,113.65],escena:["tren","castillo","campos"],imagen:"Un zapato de bronce gigante (Zheng-zhou) marca el kilómetro cero de China: aquí hubo una capital Shang hace 3 500 años.",dato:"Capital de Henan y cruce de trenes de toda China; bajo la ciudad hay murallas de una capital Shang de hace unos 3 500 años. En Huayuankou, al norte, el ejército rompió los diques en 1938 para frenar a los japoneses, y la inundación mató a cientos de miles de personas. A 70 km está el templo Shaolin."},
{nombre:"Kaifeng",pais:"China",pos:[34.8,114.31],escena:["pagoda","mercado","puente"],imagen:"Una ciudad enterrada varias veces bajo el barro y un río que pasa por arriba, a diez metros sobre los techos: en Kaifeng miran hacia arriba para ver el agua.",dato:"Capital de la dinastía Song del Norte (960-1127), entonces una de las ciudades más grandes del mundo, pintada en el rollo «Escenas junto al río en el festival Qingming». El barro del río la enterró varias veces: bajo la ciudad hay capas de ciudades anteriores, y hoy el lecho del río corre unos diez metros por encima de sus calles, entre diques."},
{nombre:"Jinan",pais:"China",pos:[36.65,117],escena:["lago","casas","templo"],imagen:"Un genio (Ji-nan) sale de un manantial y no del río: en Jinan el agua buena brota del suelo, en cientos de fuentes, y el Amarillo pasa de largo por el norte.",dato:"Capital de Shandong, la «ciudad de los manantiales»: 72 famosos, con Baotu a la cabeza. El río llegó aquí recién en 1855, cuando cambió de curso y dejó de salir al mar Amarillo para salir al golfo de Bohai. Confucio nació a 130 km, en Qufu."},
{nombre:"Dongying",pais:"China",pos:[37.46,118.5],escena:["fabrica","aves","faro"],imagen:"Un dong de campana (Dong-ying) suena en un delta nuevo cada año: aquí el río se inventa tierra con su barro y los pozos de petróleo cabecean entre las gaviotas.",dato:"Ciudad joven (1983) del campo petrolero de Shengli, el segundo de China. El delta del Huang He gana tierra al mar cada año con el barro que trae el río, cambia de boca cada pocas décadas y es una reserva de aves; en otoño una planta de sal tiñe de rojo la playa."}]},
{id:"orinoco",nombre:"Orinoco",continente:"América del Sur",escenaNace:["montaña","selva","cataratas"],escenaMar:["manglar","barco","aves"],longitud:2140,mar:"Océano Atlántico (delta del Orinoco)",marEn:"el Atlántico",
nace:"Sierra Parima",naceNota:"Nace en el cerro Delgado Chalbaud, en la sierra Parima, en la frontera de Venezuela con Brasil, a unos 1 000 m; su fuente exacta la fijó una expedición franco-venezolana en 1951. Con unos 2 140 km tiene el segundo caudal de Sudamérica, y por el brazo Casiquiare, un canal natural, le presta agua al río Negro y al Amazonas: un caso único entre los grandes ríos.",
antigua:"Los waraos del delta, «la gente de la curiara», ya navegaban sus caños cuando Diego de Ordaz subió el río en 1531 buscando El Dorado; Walter Raleigh lo intentó en 1595 y escribió un libro sobre la Guayana. En 1800 Humboldt y Bonpland remontaron el alto Orinoco y comprobaron que el Casiquiare lo une con el Amazonas. En 1819 Bolívar reunió en Angostura el congreso que fundó la Gran Colombia.",
moderna:"Hoy el río es la carretera del oriente de Venezuela: barcos de mar suben unos 300 km hasta Ciudad Guayana, donde el hierro del cerro Bolívar se vuelve acero y la presa del Guri, en el Caroní, da buena parte de la electricidad del país. Río arriba, los raudales de Atures y Maipures siguen cortando la navegación, y en los Llanos el ganado espera la crecida de cada año.",
pistaAntigua:"Un río que comparte agua con el más grande de todos, y una ciudad angosta donde nació un país.",pistaModerna:"Barcos de mar suben cientos de kilómetros a cargar acero, y unos raudales parten el río en dos.",
frase:"[S]i [P]edro [p]esca, [c]uatro [c]angrejos [c]antan",fraseNota:"Seis palabras, seis paradas: San Fernando, Puerto Ayacucho, Puerto Carreño, Caicara, Ciudad Bolívar y Ciudad Guayana.",

ciudades:[
{nombre:"San Fernando de Atabapo",pais:"Venezuela",pos:[4.05,-67.7],escena:["selva","palmera","muelle"],imagen:"Un pescador llamado Fernando sirve té negro en tazas de arena blanca: el Atabapo trae agua color té y playas blancas, y aquí se junta con el Orinoco.",dato:"Donde el Atabapo, de aguas negras, y el Guaviare, de aguas pardas, entran al Orinoco: tres ríos y dos países, porque la otra orilla ya es Colombia. Fue la capital del Amazonas venezolano hasta 1928."},
{nombre:"Puerto Ayacucho",pais:"Venezuela",pos:[5.66,-67.63],escena:["cataratas","casas","muelle"],imagen:"Un puerto lleno de ayes: el agua grita al saltar los raudales de Atures y los barcos se bajan a caminar por la carretera que los rodea.",dato:"Capital del estado Amazonas, fundada en 1924 para construir la carretera que rodea los raudales de Atures y Maipures, donde el río salta entre rocas y ningún barco pasa: la carga cambia de barco por tierra, unos 60 km hasta Samariapo."},
{nombre:"Puerto Carreño",pais:"Colombia",pos:[6.19,-67.49],escena:["campos","muelle","casas"],imagen:"Un carro con carreta (Carreño) cruza el río con una meta pintada en la espalda: aquí el Meta entra al Orinoco, y la otra orilla ya es Venezuela.",dato:"Capital del Vichada, en la boca del río Meta: la frontera entre Colombia y Venezuela va por el agua. Río abajo el Orinoco ya es ancho y navegable todo el año; alrededor están los Llanos, una llanura de pastos que se inunda medio año."},
{nombre:"Caicara del Orinoco",pais:"Venezuela",pos:[7.64,-66.17],escena:["campos","muelle","aves"],imagen:"Un caimán con cara de caimán (Cai-cara) dobla el río hacia el este con la cola mientras cuenta semillas de sarrapia que huelen a vainilla.",dato:"Puerto de la orilla sur, donde el río dobla hacia el este; enfrente, Cabruta, donde entra el Apure. En el siglo XIX exportaba sarrapia, la semilla del árbol de tonka con que se perfumaba el tabaco; cerca hay petroglifos de los pueblos del río."},
{nombre:"Ciudad Bolívar",pais:"Venezuela",pos:[8.12,-63.55],escena:["puente","casas","iglesia"],imagen:"Simón Bolívar aprieta el río con las dos manos hasta dejarlo angosto y lo cruza por un puente colgante con una botella de amargo: Angostura.",dato:"Se llamó Angostura porque aquí el río se estrecha a menos de un kilómetro. En 1819 Bolívar reunió el Congreso de Angostura, que fundó la Gran Colombia; el amargo de Angostura se inventó aquí en 1824; el puente de Angostura, de 1967, fue el primero sobre el Orinoco."},
{nombre:"Ciudad Guayana",pais:"Venezuela",pos:[8.35,-62.65],escena:["fabrica","grua","muelle"],imagen:"Dos ríos de colores corren juntos sin mezclarse, como café y té, y una guayaba de acero brilla en el muelle: Guayana.",dato:"Fundada en 1961 al unir Puerto Ordaz y San Félix, donde el Caroní, de aguas oscuras, entra al Orinoco pardo y los dos corren un rato sin mezclarse. Puerto del hierro y del acero: los barcos de mar cargan aquí, a unos 300 km del océano; río arriba, en el Caroní, está la presa del Guri."}]},
{id:"murray",nombre:"Murray",continente:"Oceanía",escenaNace:["nieve","montaña","arbol"],escenaMar:["lago","aves","barco"],longitud:2508,mar:"Océano Austral (boca del Murray)",marEn:"el océano Austral",
nace:"Alpes Australianos",naceNota:"Nace en los Alpes Australianos, cerca del monte Kosciuszko, el más alto del continente (2 228 m), y durante la mayor parte de su recorrido es la frontera entre Nueva Gales del Sur y Victoria. Con unos 2 508 km es el río más largo de Australia; con el Darling, su afluente, forma la cuenca que produce cerca del 40 % de lo que el país cosecha.",
antigua:"Para los pueblos del río, como los ngarrindjeri de la boca, el cauce lo abrió un bacalao gigante, Ponde, que huía del cazador Ngurunderi: los coletazos del pez son los meandros. Charles Sturt lo bajó en un bote de remos en 1830 y le puso el nombre de un ministro británico; luego vinieron las ovejas, los vapores de ruedas y, desde 1887, el riego.",
moderna:"Hoy es un río repartido: presas, esclusas y canales llevan su agua a naranjales, viñas y arrozales de tres estados, y en los años secos llega tan poca al mar que la boca se cierra con arena y hay que dragarla. El bacalao del Murray, el pez de agua dulce más grande de Australia, es hoy una especie protegida.",
pistaAntigua:"Un pez enorme que huía dibujó los meandros, y un explorador lo bajó a remo en un bote.",pistaModerna:"Tanta agua le sacan para regar que su boca hay que dragarla para que llegue al mar.",
frase:"[A]yer [e]l [s]apo [M]iguel [r]emó [m]uy [g]racioso",fraseNota:"Siete palabras, siete paradas: Albury, Echuca, Swan Hill, Mildura, Renmark, Murray Bridge y Goolwa.",

ciudades:[
{nombre:"Albury",pais:"Australia",pos:[-36.08,146.92],escena:["montaña","presa","casas"],imagen:"En un albergue (Albury) al pie de la montaña, un ornitorrinco pide la cama de arriba y una manta de lana: el río recién baja de los Alpes y ya separa dos estados.",dato:"La primera ciudad grande del río, en la orilla de Nueva Gales del Sur; enfrente, Wodonga, en Victoria. Río arriba, el embalse de Hume (1936) guarda el agua del deshielo para el riego. Por aquí cruzaron Hume y Hovell en 1824, los primeros europeos que vieron el río."},
{nombre:"Echuca",pais:"Australia",pos:[-36.14,144.75],escena:["muelle","barco","arbol"],imagen:"Un eco (Echuca) repite el silbato de los vapores de ruedas contra un muelle de madera altísimo: en 1870 este era el puerto fluvial más grande de Australia.",dato:"En los años 1870 fue el mayor puerto interior de Australia: los vapores de ruedas subían la lana de las estancias y bajaban madera de eucalipto rojo, hasta que el tren se llevó la carga. El muelle de madera de 1865 sigue en pie y el vapor Adelaide, de 1866, todavía navega. Su nombre, en yorta yorta, es «donde se juntan las aguas»."},
{nombre:"Swan Hill",pais:"Australia",pos:[-35.34,143.55],escena:["animal:cisne","campos","muelle"],imagen:"Una colina llena de cisnes negros (Swan Hill) que graznan toda la noche: así la bautizó el explorador Mitchell en 1836, porque no lo dejaron dormir.",dato:"Thomas Mitchell acampó aquí en 1836 y la llamó Swan Hill por los cisnes negros que graznaron toda la noche. Hoy es la puerta del Mallee, tierra de trigo y almendros, y tiene un museo de vapores a la orilla."},
{nombre:"Mildura",pais:"Australia",pos:[-34.19,142.16],escena:["campos","duna","casas"],imagen:"Una naranja gigante hace de sol sobre un desierto verde: Mildura riega con el río naranjales y viñas en tierra roja y seca, y su nombre, en lengua local, es «tierra roja».",dato:"En 1887 los hermanos Chaffey, canadienses, abrieron aquí la primera colonia de riego de Australia: canales y bombas de vapor convirtieron el secano en cítricos, uvas y almendras. Cerca entra el Darling, el afluente más largo, que viene desde Queensland."},
{nombre:"Renmark",pais:"Australia",pos:[-34.17,140.75],escena:["campos","muelle","barco"],imagen:"Un marinero renombra (Renmark) cada uva de la parra con un nombre distinto: en Renmark el río corre entre viñedos y huertas de la Riverland.",dato:"La primera colonia de riego de Australia Meridional, también de los Chaffey (1887), y el corazón de la Riverland: uvas, naranjas y frutas secas. Aquí el río ya va por el último estado de su viaje."},
{nombre:"Murray Bridge",pais:"Australia",pos:[-35.12,139.27],escena:["puente","tren","casas"],imagen:"Un puente (bridge) de hierro le hace cosquillas al río con los pies: fue el primer puente sobre el Murray, y el tren llegó poco después.",dato:"El primer puente sobre el Murray (1879) unió Adelaida con el este; desde 1886 lo cruzó también el tren. La ciudad se llamaba Mobilong y tomó el nombre del puente en 1924."},
{nombre:"Goolwa",pais:"Australia",pos:[-35.5,138.78],escena:["lago","faro","barco"],imagen:"En Goolwa una gaviota (gu-) cierra unas compuertas enormes: las barreras separan el lago dulce del mar salado, y la boca del río hay que dragarla.",dato:"El puerto de la boca, donde el río sale del lago Alexandrina al mar. Las barreras de 1940 cierran el lago al agua salada, y desde 2002 hay que dragar la boca para que no se tape de arena. En 1854 tuvo el primer ferrocarril público de Australia, tirado por caballos, hasta la playa de Port Elliot."}]},
{id:"sanlorenzo",nombre:"San Lorenzo",continente:"América del Norte",escenaNace:["lago","arbol","faro"],escenaMar:["hielo","aves","faro"],longitud:1197,mar:"Golfo de San Lorenzo (Atlántico)",marEn:"el golfo de San Lorenzo",
nace:"Lago Ontario",naceNota:"Sale del lago Ontario, el último de los Grandes Lagos, en Kingston, a 74 m sobre el mar: por él desaguan los cinco lagos, que guardan cerca de una quinta parte del agua dulce superficial del mundo. Con unos 1 200 km hasta el golfo es corto para lo que lleva, pero contando los lagos el sistema pasa de 3 000 km.",
antigua:"Los iroqueses del río, los algonquinos y los innu pescaban y comerciaban en él mucho antes de que Jacques Cartier lo remontara en 1535 hasta la aldea de Hochelaga y le diera el nombre del santo del día en que entró al golfo. Fue el camino de las pieles de castor y de la Nueva Francia: Tadoussac en 1600, Quebec en 1608, Montreal en 1642; en 1759 la batalla de las llanuras de Abraham, junto a Quebec, decidió que Canadá sería británico.",
moderna:"Desde 1959 la Vía Marítima lo vuelve una escalera de esclusas: barcos de mar de 225 m suben desde el Atlántico hasta los Grandes Lagos, unos 3 700 km tierra adentro, cargados de mineral de hierro y de trigo. En invierno el río se congela en parte y los rompehielos mantienen abierto el canal; en Tadoussac, donde el agua dulce se vuelve salada, se juntan las belugas y, en verano, las ballenas azules.",
pistaAntigua:"Lleva el nombre de un santo porque un navegante entró en su golfo el día de su fiesta; fue el camino de las pieles.",pistaModerna:"Barcos de mar suben por esclusas hasta unos lagos tan grandes que parecen mares, y en invierno lo abren rompehielos.",
frase:"[K]arla [c]ome [m]ucho: [t]ortas, [q]ueso, [t]amales",fraseNota:"Seis palabras, seis paradas: Kingston, Cornwall, Montreal, Trois-Rivières, Quebec y Tadoussac.",

ciudades:[
{nombre:"Kingston",pais:"Canadá",pos:[44.23,-76.48],escena:["lago","castillo","barco"],imagen:"Un rey (King) con corona de hielo se sienta en la boca del lago Ontario y deja salir el río entre mil islas.",dato:"Donde el lago Ontario se vuelve río, entre las Mil Islas. Fue la primera capital de la provincia de Canadá (1841-1844) y guarda el fuerte Henry, de 1832, levantado por miedo a una invasión desde Estados Unidos."},
{nombre:"Cornwall",pais:"Canadá",pos:[45.02,-74.73],escena:["presa","grua","casas"],imagen:"Una vaca de Cornualles (Cornwall) empuja la puerta de una esclusa gigante: aquí los barcos de mar suben una escalera de agua hacia los Grandes Lagos.",dato:"Junto a la presa Moses-Saunders (1958), compartida con Estados Unidos, y a las esclusas de la Vía Marítima (1959) que dejan pasar barcos de mar hasta los Grandes Lagos. Para hacer el embalse se inundaron varios pueblos, hoy llamados los Pueblos Perdidos."},
{nombre:"Montreal",pais:"Canadá",pos:[45.5,-73.57],escena:["rascacielos","puente","iglesia"],imagen:"Un monte real (Mont Royal) con sombrero de nieve mira cómo los rápidos de Lachine hacen saltar las canoas de corteza.",dato:"En una isla al pie del monte Royal. Cartier llegó en 1535 a la aldea iroquesa de Hochelaga, y los rápidos de Lachine, río arriba, pararon a todos los barcos hasta el canal de 1825. La ciudad nació en 1642 como Ville-Marie y hoy es la más grande de Quebec."},
{nombre:"Trois-Rivières",pais:"Canadá",pos:[46.35,-72.55],escena:["fabrica","muelle","arbol"],imagen:"Tres ríos (Trois-Rivières) se dan la mano en un puerto de papel: la ciudad fue la capital mundial del papel de periódico.",dato:"Fundada en 1634 donde el Saint-Maurice llega al San Lorenzo partido en tres brazos por dos islas. En el siglo XX sus fábricas la hicieron la capital mundial del papel de periódico; río arriba se abre el lago Saint-Pierre, un ensanche del río lleno de islas y aves."},
{nombre:"Quebec",pais:"Canadá",pos:[46.81,-71.21],escena:["castillo","casas","muelle"],imagen:"Un diamante enorme (cabo Diamant) aprieta el río hasta dejarlo angosto: kébec quiere decir «donde el río se estrecha».",dato:"Champlain la fundó en 1608 sobre el cabo Diamant, donde el río se estrecha a cerca de un kilómetro: eso quiere decir kébec en algonquino. Es la única ciudad amurallada al norte de México; en 1759 los británicos la tomaron en las llanuras de Abraham."},
{nombre:"Tadoussac",pais:"Canadá",pos:[48.14,-69.72],escena:["garganta","muelle","animal:beluga"],imagen:"Una ballena blanca toca un tambor (Tadoussac) en la boca del fiordo del Saguenay, justo donde el agua dulce se vuelve salada.",dato:"En la boca del fiordo del Saguenay, donde el agua dulce se vuelve salada y el río ya es un estuario de unos 20 km de ancho. En 1600 se abrió aquí el primer puesto francés de comercio de pieles de América; hoy vienen las belugas y, en verano, las ballenas azules."}]},
{id:"zambeze",nombre:"Zambeze",continente:"África",escenaNace:["arbol","pantano","campos"],escenaMar:["manglar","barco","palmera"],longitud:2574,mar:"Océano Índico (canal de Mozambique)",marEn:"el Índico",
nace:"Colinas de Mwinilunga",naceNota:"Nace en un bosque de miombo del noroeste de Zambia, cerca de Kalene Hill, a unos 1 500 m, donde se tocan Zambia, Angola y el Congo; entra a Angola y vuelve a Zambia. Con unos 2 574 km es el cuarto río de África y el más largo de los que salen al Índico; en el camino cae por las cataratas Victoria y llena dos de los embalses más grandes del mundo.",
antigua:"Los lozi de la llanura del alto río y los reinos shona del Monomotapa vivían de él antes de que los portugueses subieran desde Sofala en el siglo XVI hasta Sena y Tete, tras el oro y el marfil. En 1855 David Livingstone llegó a la catarata que los kololo llamaban Mosi-oa-Tunya, «el humo que truena», y la bautizó Victoria; en 1858 volvió a remontarlo en un vapor y los rápidos de Cahora Bassa lo pararon.",
moderna:"Hoy es el río de las presas: Kariba (1959) y Cahora Bassa (1974) dan electricidad a media África austral, y sus lagos artificiales están entre los mayores del mundo. Las cataratas y los rápidos traen turistas a Livingstone y a Victoria Falls; en Tete el carbón baja en tren, y en el delta los ciclones del Índico entran cada pocos años.",
pistaAntigua:"Un misionero escocés le puso nombre de reina a un humo que truena.",pistaModerna:"Dos presas enormes le sacan la electricidad y unas cataratas le traen turistas.",
frase:"[M]i [k]ayak [l]leva [k]iwis, [t]omates, [c]ocos",fraseNota:"Seis palabras, seis paradas: Mongu, Katima Mulilo, Livingstone, Kariba, Tete y Chinde.",

ciudades:[
{nombre:"Mongu",pais:"Zambia",pos:[-15.25,23.13],escena:["pantano","campos","balsa"],imagen:"Un mono (Mongu) con corona rema en una llanura inundada: cada año el rey de los lozi se muda en barca cuando el río se sale.",dato:"Capital de Barotselandia, sobre la llanura del alto Zambeze, que cada año se inunda durante meses. Cuando llega la crecida, el litunga, el rey lozi, se traslada de Lealui a Limulunga en la barca Nalikwanda, con tambores y cientos de remeros: es la ceremonia Kuomboka, «salir del agua»."},
{nombre:"Katima Mulilo",pais:"Namibia",pos:[-17.5,24.27],escena:["casas","palmera","muelle"],imagen:"Una gata mima (Katima) a un mulito (Mulilo) mientras apagan juntos un fuego con agua del río, justo donde cuatro países se tocan.",dato:"En la franja de Caprivi, el brazo de Namibia que llega al río. Su nombre, en lozi, es «apagar el fuego», por un rápido cuya espuma apagaba las antorchas de los remeros. Río abajo, en Kazungula, se tocan cuatro países: Namibia, Botsuana, Zambia y Zimbabue."},
{nombre:"Livingstone",pais:"Zambia",pos:[-17.85,25.86],escena:["cataratas","selva","puente"],imagen:"Un león de piedra (Living-stone) se moja la melena bajo una catarata que truena: el humo que truena.",dato:"A 10 km de las cataratas Victoria, Mosi-oa-Tunya, «el humo que truena»: 1,7 km de ancho y 108 m de caída, la cortina de agua más grande del mundo. David Livingstone las vio en 1855; el puente de 1905 sobre la garganta une Zambia con Zimbabue y hoy es un lugar de saltos en cuerda."},
{nombre:"Kariba",pais:"Zimbabue",pos:[-16.52,28.8],escena:["presa","lago","aves"],imagen:"Una caja (Kariba) enorme guarda el río entero: la presa hizo un lago tan grande que hubo que rescatar a los animales en barca.",dato:"La presa de Kariba (1959), en una garganta del río, creó uno de los mayores embalses del mundo, de más de 220 km de largo, compartido por Zimbabue y Zambia. Mientras el lago subía, la Operación Noé rescató en botes a unos 6 000 animales de las islas que iban quedando."},
{nombre:"Tete",pais:"Mozambique",pos:[-16.16,33.59],escena:["puente","casas","fabrica"],imagen:"Una tetera (Tete) hierve sola al sol sobre un puente colgante: es una de las ciudades más calientes del país, y tiene carbón por debajo.",dato:"Vieja plaza portuguesa del siglo XVI, de las más calurosas de Mozambique. El puente colgante de 1973 fue durante décadas el único sobre el bajo Zambeze; alrededor están las minas de carbón de Moatize, y río arriba la presa de Cahora Bassa (1974)."},
{nombre:"Chinde",pais:"Mozambique",pos:[-18.58,36.47],escena:["manglar","muelle","barco"],imagen:"Un chinchorro (Chinde) colgado entre dos manglares mece a un capitán inglés con sombrero: aquí Inglaterra alquiló un pedacito de puerto para subir el río a vapor.",dato:"Puerto del delta, en uno de los brazos por los que el río sale al Índico. Entre 1891 y 1923 fue una concesión británica desde donde los vapores subían con carga hacia Nyasalandia, el actual Malaui; los ciclones se lo han llevado en parte."}]},
{id:"tempisque",nombre:"Tempisque",continente:"Guanacaste",escenaNace:["volcan","montaña","arbol"],escenaMar:["manglar","puente","barco"],zona:"cr",longitud:144,mar:"Golfo de Nicoya",marEn:"el golfo de Nicoya",
nace:"Cordillera de Guanacaste",naceNota:"Baja de la cordillera de Guanacaste, hacia el volcán Orosí, y cruza de norte a sur la llanura guanacasteca, la región más seca del país, hasta el golfo de Nicoya. Es el río principal de la provincia; su longitud suele darse en unos 144 km.",
antigua:"Esta llanura fue tierra chorotega y, desde la colonia, de haciendas ganaderas: sabanas para el ganado y casas de adobe. En 1824 el Partido de Nicoya se sumó a Costa Rica «por su propia voluntad», y el río fue durante un siglo la carretera de Guanacaste: bongos de un solo tronco bajaban maíz, cueros, queso y madera desde Bolsón, Puerto Humo y Bebedero, cruzaban el golfo hasta Puntarenas y volvían con sal y mercadería.",
moderna:"Hoy el llano se riega con agua que llega desde el embalse de Arenal, del otro lado de la cordillera, por el Distrito de Riego Arenal-Tempisque (años ochenta): caña de azúcar, arroz y melón. El Parque Nacional Palo Verde protege el humedal donde en la estación seca se juntan miles de aves acuáticas, y los cocodrilos toman el sol en los bancos de barro. Cerca de la boca, el puente de la Amistad de Taiwán (2003), de unos 780 m, une la península de Nicoya con el resto del país.",
pistaAntigua:"Una provincia entera se sumó al país «por su propia voluntad» en 1824; por este río bajaban en canoas de un solo tronco el maíz y los cueros de sus haciendas.",
pistaModerna:"Un puente de casi 800 m pagado por Taiwán lo cruza cerca de la boca, y el agua de un embalse al otro lado de la cordillera riega su caña y su arroz.",
frase:"[L]a [G]ente [F]esteja [B]ailando [P]unto",fraseNota:"El Punto guanacasteco es el baile típico. Cinco paradas, de Liberia al golfo.",

ciudades:[
{nombre:"Liberia",pais:"Costa Rica",pos:[10.632,-85.4393],escena:["casas","iglesia","vaca"],imagen:"Una ciudad pintada de blanco donde todos usan sombrero de sabanero: Liberia, la «ciudad blanca» de Guanacaste, a media hora del río.",dato:"Capital de Guanacaste, fundada en 1769. El río Liberia atraviesa la ciudad y unos kilómetros al oeste entrega sus aguas al Tempisque. Su aeropuerto, el Daniel Oduber, es la segunda puerta de entrada del país."},
{nombre:"Guardia",pais:"Costa Rica",pos:[10.5655,-85.5868],escena:["puente","vaca","campos"],imagen:"Un guardia con machete y sombrero cuida un puente sobre el río: Guardia, el pueblo del puente del Tempisque.",dato:"Pueblo ribereño del cantón de Liberia; cerca de aquí la carretera a Filadelfia y Nicoya cruza el río. Río arriba el Tempisque es un río de piedras y pozas; río abajo se ensancha y serpentea por el llano."},
{nombre:"Filadelfia",pais:"Costa Rica",pos:[10.4454,-85.5526],escena:["campos","casas","vaca"],imagen:"Un queso crema gigante (Filadelfia) flota río abajo con sombrero de paja: Filadelfia, el pueblo del Tempisque en el corazón del arroz.",dato:"Cabecera del cantón de Carrillo, en medio del llano de arroz y caña. En la estación lluviosa el río se sale de su cauce y deja el pueblo y los campos bajo el agua durante días."},
{nombre:"Bolsón",pais:"Costa Rica",pos:[10.3623,-85.4493],escena:["muelle","campos","casas"],imagen:"Un bolsón (una bolsa enorme) lleno de maíz se sube a un bongo de un solo tronco: Bolsón fue puerto fluvial del Tempisque.",dato:"Pueblo de Santa Cruz en un meandro del río. Hasta mediados del siglo XX los bongos de remo y vela bajaban de aquí al golfo con maíz, cueros y madera, y subían con sal y mercadería de Puntarenas."},
{nombre:"Puerto Humo",pais:"Costa Rica",pos:[10.3142,-85.3509],escena:["muelle","aves","pantano","animal:cocodrilo"],imagen:"Un muelle tapado por el humo de los fogones donde hierven las ollas de arroz: Puerto Humo, la última parada, frente a Palo Verde.",dato:"Antiguo puerto fluvial del cantón de Nicoya, frente al Parque Nacional Palo Verde, el humedal donde en la estación seca se juntan miles de patos, garzas y espátulas. En sus bancos de barro descansan los cocodrilos del Tempisque."}
]},
{id:"reventazon",nombre:"Reventazón",continente:"Cartago y Limón",escenaNace:["montaña","campos","arbol"],escenaMar:["palmera","barco","manglar"],zona:"cr",longitud:145,mar:"Mar Caribe",marEn:"el Caribe",
nace:"Valle de Orosi, Cartago",naceNota:"Se forma con el río Grande de Orosi y los ríos que bajan de la cordillera de Talamanca y del valle de Cartago, que se juntan en el embalse de Cachí; desde ahí cae hacia el Caribe y en la llanura toma el nombre de Parismina. Su longitud suele darse en unos 145 km.",
antigua:"Cartago, la capital colonial, buscaba por este valle su salida al Caribe: el camino a Matina, donde crecía el cacao que sirvió de moneda en la Costa Rica colonial. Orosi y Ujarrás nacieron como pueblos de indígenas reunidos por los frailes; la iglesia de Orosi (1743) es la más antigua del país que sigue en uso. En 1871 empezó el ferrocarril al Atlántico: Minor Keith lo terminó en 1890 siguiendo el Reventazón de Cartago a Siquirres, y para pagarlo sembró banano junto a la vía; de ahí nació la United Fruit (1899).",
moderna:"El valle es el corazón eléctrico del país: las plantas de Río Macho (1963), Cachí (1966), Angostura (2000) y Reventazón (2016, 305,5 MW, la hidroeléctrica más grande de Centroamérica cuando se inauguró). Turrialba vive del rafting, del queso, del CATIE, que investiga cultivos tropicales desde 1942, y de una fábrica que cose a mano todas las bolas de béisbol de las Grandes Ligas. En el llano hay banano y ganado; en la barra de Parismina anidan tortugas.",
pistaAntigua:"Un tren hacia el Atlántico se pagó sembrando banano junto a la vía; su constructor fundó después una compañía frutera enorme.",
pistaModerna:"Todas las bolas de béisbol de las Grandes Ligas se cosen a mano en una ciudad junto a este río, famoso por el rafting.",
frase:"[O]tro [C]afé, [J]efe, [T]an [S]uave, [P]or favor",fraseNota:"Seis paradas: Orosi, Cachí, Juan Viñas, Turrialba, Siquirres, Parismina.",

{nombre:"Orosi",pais:"Costa Rica",pos:[9.7965,-83.8543],escena:["iglesia","campos","montaña"],imagen:"Una iglesia chiquita de techo de tejas y un oso (O-rosi) que reza adentro: Orosi tiene la iglesia colonial más antigua del país que sigue en uso.",dato:"Valle de café entre montañas. La iglesia de San José de Orosi, de 1743, sigue abierta desde entonces. Cerca están las aguas termales y el Parque Nacional Tapantí, uno de los lugares más lluviosos de Costa Rica."},
{nombre:"Cachí",pais:"Costa Rica",pos:[9.8262,-83.8062],escena:["presa","lago","iglesia"],imagen:"Un cachete (Cachí) inflado aguanta el agua de todo el valle: la presa de Cachí embalsa el río.",dato:"La presa de Cachí (1966) fue una de las primeras grandes plantas del ICE. Junto al embalse están las ruinas de Ujarrás, el templo colonial que sus vecinos abandonaron en 1833 por las inundaciones, y la Casa del Soñador, con las tallas de madera de Macedonio Quesada."},
{nombre:"Juan Viñas",pais:"Costa Rica",pos:[9.8946,-83.7457],escena:["fabrica","campos","tren"],imagen:"Don Juan Viñas se toma un café con azúcar de su propio ingenio, sentado en la estación del tren: Juan Viñas, entre cafetales y cañales.",dato:"Pueblo de la Hacienda Juan Viñas, con ingenio de azúcar y beneficio de café desde el siglo XIX; el ferrocarril al Atlántico paraba aquí antes de bajar al valle de Turrialba."},
{nombre:"Turrialba",pais:"Costa Rica",pos:[9.9073,-83.6826],escena:["volcan","balsa","campos"],imagen:"Una bola de béisbol con un volcán de sombrero baja el río en balsa: en Turrialba se cosen las bolas de las Grandes Ligas, al pie del volcán Turrialba.",dato:"Ciudad del rafting y del queso. El CATIE investiga aquí cultivos tropicales desde 1942. A unos 20 km está Guayabo, la ciudad precolombina más grande del país, con calzadas y acueductos de piedra que todavía funcionan."},
{nombre:"Siquirres",pais:"Costa Rica",pos:[10.098,-83.5076],escena:["presa","tren","banano"],imagen:"Un sí que chirría (Si-quirres) como los frenos del tren: en Siquirres se cruzaban las vías, y hoy está la represa más grande.",dato:"Cruce del ferrocarril al Atlántico, donde el río sale de las montañas al llano bananero. La planta Reventazón (2016), de 305,5 MW, es la mayor central hidroeléctrica de Centroamérica."},
{nombre:"Parismina",pais:"Costa Rica",pos:[10.3087,-83.3521],escena:["palmera","muelle","animal:tortuga"],imagen:"Una tortuga con paraguas y boina (Paris-mina) desova en la playa: en la barra de Parismina anidan tortugas.",dato:"Pueblo de pescadores en la boca del río, entre la playa y los canales que llevan a Tortuguero. Anidan tortugas verdes, baulas y carey, y los vecinos las cuidan de los saqueadores."}
]},
{id:"sarapiqui",nombre:"Sarapiquí",continente:"Alajuela y Heredia",escenaNace:["volcan","cataratas","selva"],escenaMar:["selva","barco","casas"],zona:"cr",longitud:84,mar:"Río San Juan",marEn:"el río San Juan",
nace:"Cordillera Volcánica Central",naceNota:"Baja del lado norte de los volcanes Poás y Barva, entre cataratas, y en la llanura se vuelve un río ancho y navegable que entrega sus aguas al San Juan, en la frontera con Nicaragua. Su longitud suele darse en unos 84 km.",
antigua:"A mediados del siglo XIX este río fue la puerta de Costa Rica al Atlántico: por el camino de Sarapiquí bajaban las mulas desde Heredia hasta el Muelle, en Puerto Viejo, y de ahí los botes seguían por el San Juan hasta el Caribe. En abril de 1856, en la guerra contra el filibustero William Walker, tropas costarricenses vencieron en Sardinal, a orillas del Sarapiquí. Cuando el tren llegó a Limón, en 1890, el camino de Sarapiquí quedó en el olvido.",
moderna:"Piña, banano y turismo. La llanura de Sarapiquí es el corazón de la piña de un país que es el mayor exportador de piña fresca del mundo. En Puerto Viejo está La Selva (1968), una de las estaciones biológicas más estudiadas del trópico; en La Virgen las balsas de rafting bajan el río, y los puentes colgantes de Tirimbina lo cruzan sobre la selva.",
pistaAntigua:"En 1856 un ejército venció a los filibusteros a orillas de este río, que era entonces el camino de su país hacia el Atlántico.",
pistaModerna:"Su llanura es el corazón de la piña de un país que es el mayor exportador de piña fresca del mundo; a su orilla hay una estación biológica famosa.",
frase:"[S]i [L]a [C]anoa [P]asa [T]ranquila",fraseNota:"Cinco paradas: San Miguel, La Virgen, Chilamate, Puerto Viejo, Trinidad.",
