{nombre:"La Virgen",pais:"Costa Rica",pos:[10.3997,-84.1368],escena:["balsa","puente","selva"],imagen:"Una virgen de yeso con chaleco salvavidas se sube a una balsa: en La Virgen empieza el rafting del Sarapiquí.",dato:"Pueblo de la carretera que baja de Vara Blanca a Puerto Viejo, donde el río sale de la montaña y las balsas entran al agua. A la orilla está la reserva Tirimbina, con un puente colgante de más de 250 m sobre el río."},
{nombre:"Chilamate",pais:"Costa Rica",pos:[10.4523,-84.0661],escena:["arbol","campos","casas"],imagen:"Un higuerón gigante (el chilamate) con un mate colgando de cada rama: Chilamate se llama como el árbol de la orilla.",dato:"Caserío de la ribera entre La Virgen y Puerto Viejo, entre piñales y potreros. El chilamate es un higuerón de sombra ancha, típico de estas orillas; río abajo se acaban los rápidos y el Sarapiquí se vuelve navegable."},
{nombre:"Puerto Viejo",pais:"Costa Rica",pos:[10.4541,-84.0083],escena:["muelle","selva","casas","animal:mono"],imagen:"Un muelle viejo con mulas cansadas que se bajan a un bote: en Puerto Viejo terminaba el camino de mulas y empezaba el viaje por agua.",dato:"Cabecera del cantón de Sarapiquí y antiguo Muelle de Sarapiquí, el puerto por donde salió el comercio del Valle Central hacia el Caribe a mediados del siglo XIX. Aquí se le une el río Puerto Viejo y, en la confluencia, está la estación biológica La Selva (1968)."},
{nombre:"Trinidad",pais:"Costa Rica",pos:[10.716,-83.9375],escena:["casas","muelle","selva"],imagen:"Una trinidad de botes se da la mano en la esquina de dos países: en Trinidad el Sarapiquí entra al San Juan, frente a Nicaragua.",dato:"Caserío en la boca del Sarapiquí, frente a la orilla nicaragüense del San Juan. Desde aquí los botes siguen río abajo hacia el Caribe o río arriba hacia el lago de Nicaragua. La frontera corre por la orilla derecha del San Juan desde 1858."}
]},
{id:"sanjuan",nombre:"San Juan",continente:"Frontera con Nicaragua",escenaNace:["lago","barco","casas"],escenaMar:["manglar","barco","faro"],zona:"cr",longitud:192,mar:"Mar Caribe",marEn:"el Caribe",
nace:"Lago de Nicaragua, en San Carlos",naceNota:"Desagua el lago de Nicaragua (Cocibolca), el más grande de Centroamérica, y corre hacia el Caribe; en su tramo final la frontera con Costa Rica va por su orilla derecha, según el tratado Cañas-Jerez de 1858. Es un río nicaragüense, pero la historia de Costa Rica pasa por él. Su longitud suele darse en unos 192 km.",
antigua:"Fue el camino de Granada al mar y por eso el de los piratas: Henry Morgan lo remontó en 1665 para saquear Granada. España levantó el castillo de la Inmaculada Concepción (1675) sobre un raudal; en 1762 Rafaela Herrera, de 19 años, dirigió su defensa contra los ingleses, y en 1780 un joven Horatio Nelson lo tomó por unos meses. Desde 1851 los vapores de Cornelius Vanderbilt subían el río con viajeros rumbo al oro de California; por esa ruta llegó el filibustero William Walker, y en la campaña de 1856 y 1857 Costa Rica le quitó los vapores del río.",
moderna:"El tratado Cañas-Jerez (1858) dejó el río a Nicaragua y a Costa Rica el derecho de navegarlo con fines de comercio; la Corte Internacional de Justicia volvió a leerlo en 2009 y falló sobre la frontera del delta en 2015 y 2018. El sueño del canal interoceánico vuelve cada tanto: en los años 1890 se dragó en Greytown y en 2013 Nicaragua dio una concesión a una empresa china, cancelada en 2024. Hoy casi toda el agua sale por el río Colorado, en Costa Rica: unas nueve de cada diez gotas.",
pistaAntigua:"Un almirante inglés famoso tomó de joven el castillo de este río; años antes lo había defendido de otros ingleses una muchacha de 19 años.",

nace:"Valle Central: el Virilla y el Grande",naceNota:"Recoge las aguas del Valle Central: el Virilla, que baja desde Coronado entre San José y Heredia, y el Grande, que viene de San Ramón y Atenas, se juntan en Balsa, y desde ahí el río se llama Grande de Tárcoles hasta el Pacífico. Su longitud suele darse en unos 111 km.",
antigua:"Por este valle bajó el café hacia el puerto: desde los años 1840 las carretas y las mulas iban de San José a Puntarenas por el camino de mulas, cruzaban el Virilla por el puente de Mulas, de piedra, y el río Grande en balsa, en el paso que le dio nombre al pueblo. El ferrocarril al Pacífico (1910) pasó por Orotina y dejó viejo el camino. Mucho antes, los huetares pescaban y cazaban en estos ríos del valle.",
moderna:"El Virilla recoge las aguas sucias de la Gran Área Metropolitana y el Tárcoles es el río más contaminado del país; desde 2015 la planta de Los Tajos trata parte de esas aguas. Sobre el río Grande, en La Garita, el ICE estrenó en 1958 su primera planta hidroeléctrica. Río abajo, el puente de la carretera a Jacó es el mirador de cocodrilos más famoso de Costa Rica, y en Carara vuelven a criar las lapas rojas. En Belén, junto al Virilla, la fábrica de Intel (1997) hizo de los chips la primera exportación del país durante años.",
pistaAntigua:"Por su valle bajaba el café en carreta hacia el puerto del Pacífico; el ferrocarril de 1910 dejó viejo el camino de mulas.",
pistaModerna:"Es el río más contaminado de su país y, a la vez, el del puente desde donde todos miran cocodrilos.",

antigua:"El valle del Diquís, «agua grande» en lengua boruca, fue tierra de esferas de piedra: los pueblos de aquí las tallaron entre los siglos IV y XVI y nadie sabe para qué. Los borucas y los térrabas siguen viviendo junto al río; cada fin de año, en Boruca, el Juego de los Diablitos enfrenta a las máscaras con el toro español. En 1938 la Compañía Bananera abrió fincas en Palmar y sacó las esferas a la luz al limpiar la tierra.",
moderna:"Piña en Buenos Aires, palma aceitera donde hubo banano, y el manglar de Térraba-Sierpe, el más grande del país. Las esferas de Finca 6 son Patrimonio de la Humanidad desde 2014. El ICE quiso levantar aquí la represa del Diquís, la más grande de Centroamérica, y la canceló en 2018 tras años de oposición de los pueblos térraba y boruca.",
pistaAntigua:"En su valle aparecieron cientos de esferas de piedra casi perfectas cuando una compañía bananera limpiaba la tierra; nadie sabe para qué las hicieron.",

["Bajás por las esclusas de las Tres Gargantas; hasta hace un siglo aquí se contrataban los sirgadores que subían los juncos a pulso.","sal y pimienta"],
["Vendés la sal y cargás ladrillos de té: desde Hankou salía el té prensado que cruzaba Mongolia a lomo de camello hasta Rusia.","pimienta y té"],
["Sumás rollos de brocado yunjin, la «seda de nubes» que vestía a los emperadores.","pimienta, té y brocado"],
["Todo se vende en el Bund, y el junco vuelve con algodón hilado en las fábricas del delta.","vendida"]]},
misisipi:{nombre:"Un vapor de rueda",tipo:"vapor",desc:"Casco tan plano que, decían, flota sobre el rocío; dos chimeneas, una rueda de paletas a popa y un piloto que se sabe de memoria cada banco de arena, como el joven Mark Twain.",zarpe:"Zarpás de Minnesota con madera de pino y la caldera encendida.",llegada:"El vapor no sale al golfo: en Nueva Orleans la carga pasa a los barcos de altura, como pasó siempre.",
puertos:[["Cargás sacos de harina de los molinos de las cataratas de San Antonio: hacia 1880 Mineápolis molía más trigo que ninguna otra ciudad del mundo.","harina"],
["Sumás fardos de pieles de castor que bajaron por el Misuri: San Luis fue la capital del comercio de pieles del Oeste.","harina y pieles"],
["Vendés las pieles y cargás algodón en pacas de más de 200 kilos: Memphis fue el mayor mercado de algodón al contado del mundo.","harina y algodón"],
["Sumás barriles de azúcar y melaza de los ingenios de Luisiana.","harina, algodón y azúcar"],
["Todo se vende en el dique del puerto, y el vapor vuelve río arriba con café del Caribe y telas de Europa.","vendida"]]},
danubio:{nombre:"Una caja de Ulm",tipo:"barcaza",desc:"Barcaza plana de tablas de pino con una casita en cubierta, pintada a franjas blancas y negras, que solo navega río abajo. Al llegar se desarma y se vende como leña; el barquero vuelve a pie.",zarpe:"Zarpás de Ulm con barriles de vino y una familia de colonos.",llegada:"Quedan 1 600 km hasta el mar Negro; los hacen las barcazas modernas por las Puertas de Hierro. La caja de Ulm ya es leña.",
puertos:[["Cargás familias de colonos suabos con todo lo que tienen: en el siglo XVIII bajaron así decenas de miles hacia el Banato, y de ahí salieron los «suabos del Danubio».","colonos y vino"],
["Sumás sal de Baviera: Ratisbona guardaba la sal de los Alpes en un almacén enorme junto al puente de piedra.","colonos, vino y sal"],
["Cargás hojas de espada y cuchillos de Passau, marcados con el lobo que era garantía de acero.","colonos, vino, sal y acero"],
["Vendés la sal y cargás lino de la Alta Austria: Linz fue ciudad de tejedores antes que de acero.","colonos, vino, acero y lino"],
["Sumás toneles de vino de las colinas de Viena y el permiso imperial para seguir río abajo.","colonos, vino, acero y lino"],
["Cambiás el lino por trigo húngaro: la llanura que empieza aquí era el granero del imperio.","colonos, vino, acero y trigo"],
["Sumás pimentón de Szeged y harina: los molinos de Budapest fueron los mayores de Europa en el siglo XIX.","colonos, vino, acero, trigo y pimentón"],
["Descargás a los colonos hacia el Banato, vendés todo, y la caja se desarma: sus tablas se venden como madera y vos volvés a Ulm a pie, semanas de camino.","vendida"]]},
rin:{nombre:"Una barcaza del Rin",tipo:"barcaza",desc:"110 m de casco de acero, la cabina de la familia a popa, la bicicleta en cubierta y el coche encima de la escotilla. Lleva 3 000 toneladas, lo mismo que cien camiones.",zarpe:"Zarpás de Basilea con la bodega vacía, aguas abajo del codo del Rin.",llegada:"La barcaza no ve el mar: en Rotterdam el Rin se convierte en grúas.",
puertos:[["Cargás sal de las minas de Schweizerhalle y contenedores de la industria química: es el único puerto de Suiza.","sal y químicos"],
["Sumás vino de Alsacia, riesling y gewürztraminer, y chucrut para el viaje.","sal, químicos y vino"],
["Vendés la sal, cargás vino del Rheingau y, en honor a Gutenberg, cajas de libros de la feria de Fráncfort.","químicos, vino y libros"],
["Sumás vino del Mosela, que llega en toneles por el afluente, y pizarra de las montañas.","químicos, vino, libros y pizarra"],
["Cargás frascos de agua de colonia y descargás los libros para la universidad.","químicos, vino, pizarra y perfume"],
["Sumás carbón del Ruhr y bobinas de acero; en el mismo muelle descargan los trenes que llegan de China.","químicos, vino, pizarra, perfume, carbón y acero"],
["Todo pasa a los cargueros oceánicos, y la barcaza vuelve río arriba con contenedores, café y soya.","vendida"]]},
ganges:{nombre:"Una barca del Ganges",tipo:"cuadrada",desc:"Vela cuadrada, remos largos y un techo de paja a popa: la que los ingleses llamaban «budgerow». Sube con la vela cuando sopla del sur y baja con la corriente y los remos.",zarpe:"Zarpás del Himalaya con cántaros vacíos para el agua sagrada.",llegada:"La barca se queda en el Hooghly. Río abajo, los Sundarbans y el mar.",
puertos:[["Cargás cántaros de agua del Ganges, el gangajal que los peregrinos llevan a sus casas: nunca se pudre, dicen.","agua sagrada"],
["Sumás cuero curtido de las tenerías: Kanpur hace las botas del ejército indio.","agua sagrada y cuero"],
["Cargás guayabas, las más famosas de la India, y rellenás los cántaros en la confluencia.","agua sagrada, cuero y guayabas"],
["Sumás saris de seda con hilo de oro: los brocados de Benarés visten las bodas de todo el país.","agua sagrada, cuero, guayabas y seda"],
["Vendés el cuero y cargás arroz de Patna, el grano largo que Inglaterra importaba por barco.","agua sagrada, guayabas, seda y arroz"],
["Todo se descarga en los muelles del Hooghly, y la barca vuelve con yute crudo para las fábricas de sacos.","vendida"]]},
volga:{nombre:"Una lodia",tipo:"cuadrada",desc:"Casco de tablones, una vela cuadrada y remos: la barca de los mercaderes rusos y de los varegos antes que ellos. En los tramos sin viento la sirgan los burlaki, los que Repin pintó tirando de la cuerda.",zarpe:"Zarpás de Valdái con la bodega vacía y el hielo recién ido.",llegada:"El Caspio no tiene salida al mar: la lodia da media vuelta, como el río.",
puertos:[["Cargás pieles de marta cibelina y ardilla que bajaron de los bosques del norte: la moneda de Rusia durante siglos.","pieles"],
["Sumás lino de Yaroslavl, tejido en la primera gran manufactura de Rusia (1722).","pieles y lino"],
["En la feria vendés las pieles y cargás cajas de té que llegaron de China por Kiajta.","lino y té"],
["Sumás cuero de Kazán, el marroquí de los tártaros, y jabón.","lino, té y cuero"],
["Cargás trigo de la estepa: en el siglo XIX Samara fue el granero que alimentaba a San Petersburgo.","lino, té, cuero y trigo"],
["Sumás sandías de Kamyshin, las más dulces del Volga, y vendés el lino.","té, cuero, trigo y sandías"],
["Todo se vende en el bazar, y la lodia vuelve río arriba con sal de los lagos, caviar y sedas de Persia.","vendida"]]},
tigris:{nombre:"Un kelek",tipo:"balsa",desc:"Balsa de troncos de álamo sobre docenas de odres de piel de cabra inflados, sin proa ni popa, que solo baja. En Bagdad se vende la madera, se desinflan los odres y vuelven a Mosul a lomo de burro.",zarpe:"Zarpás de los montes Tauro inflando los odres uno por uno.",llegada:"La mahaila se queda en el Shatt al-Arab; los odres vuelven a Mosul en burro.",
puertos:[["Cargás sandías gigantes, las que aquí crecen de hasta 50 kilos, y lingotes de cobre de las minas de Ergani.","sandías y cobre"],
["Sumás muselina y trigo; vendés las sandías antes de que se pasen.","cobre, muselina y trigo"],
["Cargás dátiles y lana de las tribus del río; el kelek se hunde un poco más.","cobre, muselina, trigo y lana"],
["Sumás cerámica de reflejo metálico, el lustre que los alfareros abasíes perfeccionaron aquí.","cobre, muselina, trigo, lana y cerámica"],
["Vendés la madera del kelek y la carga entera en el zoco, y seguís a Basora en una mahaila, la barca de vela de Irak, con papel de Bagdad y libros.","papel y libros"],
["Cambiás todo por dátiles de Basora, los más famosos del mundo, que salen por el Shatt al-Arab hacia la India.","vendida"]]},
mekong:{nombre:"Una barca de cola larga",tipo:"canoa",desc:"Casco estrecho de madera y un motor de camión en la popa con la hélice al final de un tubo de tres metros, para levantarla en los rápidos y los bajíos.",zarpe:"Zarpás de Yunnan con la bodega vacía y el motor tosiendo.",llegada:"La cola larga se queda en el delta; el arroz sale al mar por los nueve dragones.",
puertos:[["Cargás tortas de té pu'er prensado, el que viajaba a caballo hasta el Tíbet por la Ruta del Té y los Caballos.","té"],
["Sumás seda lao tejida a mano y arroz glutinoso, el pan de cada día en Laos.","té, seda y arroz"],
["Vendés el té y cargás madera de teca: Laos vende ríos en forma de electricidad y bosques en forma de tablones.","seda, arroz y teca"],
["Sumás prahok, la pasta de pescado fermentado del Tonlé Sap, y pimienta de Kampot.","seda, arroz, teca, prahok y pimienta"],
["Todo se vende desde las barcas en el mercado flotante de Cai Rang, y cargás arroz del delta para los buques de Vietnam.","vendida"]]},
niger:{nombre:"Una pinaza",tipo:"canoa",desc:"Canoa larga de tablas de caílcedrat cosidas y calafateadas, hasta 30 m, con techo de esteras y un motor que a veces funciona. Es el camión del Níger: en la crecida lleva de todo; en la seca se queda en el barro.",zarpe:"Zarpás de Guinea con la bodega vacía, dándole la espalda al Atlántico.",llegada:"La pinaza no sale al golfo: en el delta mandan los manglares y las plataformas.",
puertos:[["Cargás polvo de oro de Bouré y Bambuk, el que hizo famoso a Malí.","oro"],
["Sumás pescado seco y ahumado de los bozo, y cebollas de los dogón.","oro y pescado"],
["Cambiás el oro por barras de sal de Taoudeni, que las caravanas trajeron 700 km por el desierto, y por un manuscrito.","sal, pescado y un manuscrito"],
["Vendés el pescado y comprás telas teñidas de índigo; aquí el río gira al sur.","sal, telas y un manuscrito"],
["Sumás sacos de cacahuate, el cultivo del Sahel que se vende en aceite.","sal, telas, cacahuate y un manuscrito"],
["Vendés la sal y cargás barriles de aceite de palma: la Royal Niger Company hizo aquí su fortuna con él.","telas, cacahuate, aceite de palma y un manuscrito"],
["Todo se descarga entre las torres de las petroleras: hoy el único cargamento que cuenta es el crudo.","vendida"]]},
parana:{nombre:"Un lanchón de la hidrovía",tipo:"barcaza",desc:"Barcaza plana que viaja en convoy, hasta veinte juntas, empujadas por un remolcador. Cada convoy carga tanto como mil camiones.",zarpe:"Zarpás de Brasil con la bodega vacía, aguas abajo de Itaipú.",llegada:"Del Río de la Plata al mar quedan 220 km de agua marrón; los hacen los cargueros.",
puertos:[["Cargás yerba mate de Misiones y Paraguay, el oro verde de los jesuitas.","yerba mate"],
["Sumás naranjas y madera de las antiguas misiones.","yerba, naranjas y madera"],
["Vendés las naranjas y cargás algodón y cueros del Chaco.","yerba, madera, algodón y cueros"],
["Sumás soya y harina de soya de las terminales del Gran Rosario, la mayor concentración de puertos agroexportadores del mundo.","yerba, madera, algodón, cueros y soya"],
["Descargás casi todo en el puerto, menos la yerba, que aquí se toma, y cargás carne enfriada.","carne"],
["La carne sale al Atlántico desde la bahía, y el lanchón vuelve al norte vacío.","vendida"]]},
indo:{nombre:"Una barca mohana",tipo:"latina",desc:"Fondo plano y una vela, la barca de los mohana, el pueblo del río en Sind, que vive, pesca y comercia a bordo; una pértiga larga para los bajíos.",zarpe:"Zarpás del Tíbet con la bodega vacía y el río aún helado.",llegada:"La barca se queda en el delta; al mar Arábigo casi no llega ni el agua.",
puertos:[["Cargás lana pashmina de las cabras de Changthang, la que se convierte en chales en Cachemira.","pashmina"],
["Sumás albaricoques secos de Baltistán, los que alimentan los inviernos del Karakórum.","pashmina y albaricoques"],
["Cargás almendras, pasas y granadas de las caravanas que bajan de Kabul por el paso de Khyber.","pashmina, albaricoques y frutos secos"],
["Vendés la pashmina y cargás dátiles de Khairpur; el agua de la presa riega los palmerales.","albaricoques, frutos secos y dátiles"],
["Sumás telas ajrak, estampadas a mano con índigo y granza, el traje de Sind.","albaricoques, frutos secos, dátiles y ajrak"],
["Todo se vende en el bazar, y cargás algodón para los buques del puerto.","vendida"]]},
congo:{nombre:"El convoy de barcazas",tipo:"barcaza",desc:"Un remolcador empuja cinco o seis barcazas amarradas, cargadas de gente, cabras, pescado ahumado y todo lo que se vende en el camino: un pueblo flotante que tarda semanas entre Kisangani y Kinshasa.",zarpe:"Zarpás entre papiros con una sola barcaza; el río todavía es chico.",llegada:"En Boma el convoy se queda; el mar es de otros barcos.",
puertos:[["En Bukama cargás cobre que bajó en tren desde las minas de Katanga.","cobre"],["En Kindu el cobre vuelve al tren hacia el este y la barcaza sigue con madera y arroz.","madera y arroz"],["En Kisangani se cambia de barco: el de arriba no baja las cataratas. Suben pescado ahumado de los wagenia.","pescado ahumado"],["En Mbandaka se acercan canoas con mandioca, aceite de palma y plátanos.","aceite de palma y mandioca"],["En Kinshasa se descarga casi todo: la ciudad se come lo que baja por el río. Suben café y sacos de cemento para Matadi.","café y cemento"],["En Matadi la carga pasa a los barcos de mar y vuelve sal.","sal para río arriba"],["En Boma se vende lo que queda y el convoy da la vuelta.","vendida"]]},
huanghe:{nombre:"Una balsa de pieles de oveja",tipo:"balsa",desc:"Trece pieles de oveja infladas, amarradas bajo un enrejado de madera: la balsa yangpi fazi bajaba el Amarillo desde Lanzhou con mercancía y pasajeros; al final del viaje se vendía la madera y las pieles volvían dobladas, a lomo de camello.",zarpe:"Zarpás en una balsa que respira: si una piel se desinfla, soplá.",llegada:"En el delta la balsa se deshace: la madera se vende y las pieles vuelven en camello.",
puertos:[["En Lanzhou cargás lana y fideos secos; las norias giran en la orilla.","lana y fideos"],["En Yinchuan suben arroz y bayas de goji de los canales de Ningxia.","arroz y goji"],["En Baotou dejás la lana y cargás carbón y hierro.","carbón y hierro"],["En Zhengzhou, trigo de Henan y ladrillos para los diques.","trigo y ladrillos"],["En Kaifeng, seda y sandías, las mejores de la provincia.","seda y sandías"],["En Jinan, sal y cerámica; el agua de manantial se queda en la ciudad.","sal y cerámica"],["En el delta se vende lo que queda y la balsa se deshace.","vendida"]]},
orinoco:{nombre:"Una curiara con motor",tipo:"canoa",desc:"La curiara es la canoa del Orinoco: un tronco vaciado, largo y angosto, que hoy lleva motor fuera de borda y antes se movía a canalete. Es el bote de los waraos, «la gente de la curiara», y sube y baja el río cargada de gente, pescado y sacos.",zarpe:"Zarpás donde se juntan tres ríos, con la curiara vacía y el agua negra del Atabapo.",llegada:"En el delta la curiara se mete por los caños; el mar es de los barcos grandes.",
puertos:[["En San Fernando cargás casabe y chinchorros de moriche tejidos en la selva.","casabe y chinchorros"],["En Puerto Ayacucho la curiara va en camión hasta Samariapo para saltar los raudales; suben plátanos.","casabe, chinchorros y plátanos"],["En Puerto Carreño vendés el casabe y cargás queso llanero y cueros del otro lado de la frontera.","chinchorros, plátanos, queso y cueros"],["En Caicara suben sacos de sarrapia, la semilla que huele a vainilla.","chinchorros, queso, cueros y sarrapia"],["En Ciudad Bolívar se venden los cueros y la sarrapia y suben botellas de amargo.","chinchorros, queso y amargo"],["En Ciudad Guayana todo se vende a los barcos de mar; volvés con sal y hierro.","vendida"]]},
murray:{nombre:"Un vapor de ruedas",tipo:"vapor",desc:"Un vapor de ruedas laterales, de madera de eucalipto rojo, que quemaba leña y arrastraba barcazas de lana: entre 1860 y 1900 cientos de vapores unían las estancias del interior con los trenes de la costa. El Adelaide, de 1866, todavía navega en Echuca.",zarpe:"Zarpás con la caldera fría y el río bajando helado de la montaña.",llegada:"En Goolwa el vapor se detiene ante las barreras; el mar queda del otro lado.",
puertos:[["En Albury cargás fardos de lana de las estancias de merinos.","lana"],["En Echuca cargás leña para la caldera y madera de eucalipto rojo, y subís trigo.","lana, madera y trigo"],["En Swan Hill vendés la madera y cargás miel y bacalao del Murray recién pescado.","lana, trigo, miel y bacalao"],["En Mildura vendés el bacalao antes de que se eche a perder y cargás naranjas y pasas.","lana, trigo, miel, naranjas y pasas"],["En Renmark suben barriles de vino y sacos de almendras.","lana, trigo, miel, naranjas, pasas, vino y almendras"],["En Murray Bridge el tren se lleva la lana y el trigo; suben quesos de las lecherías.","miel, naranjas, pasas, vino, almendras y queso"],["En Goolwa todo se vende en el puerto del lago; volvés con sal y pescado de mar.","vendida"]]},
sanlorenzo:{nombre:"Una canoa de corteza de abedul",tipo:"canoa",desc:"Una canoa de corteza de abedul cosida con raíces de abeto y sellada con resina: tan liviana que se carga al hombro en los rápidos y tan grande que llevaba toneladas de pieles. Fue el bote de los pueblos del río y luego de los voyageurs del comercio de pieles.",zarpe:"Zarpás del lago con la canoa vacía y el agua clara como vidrio.",llegada:"En la boca del Saguenay la canoa se queda; el golfo es de las ballenas y los barcos grandes.",
puertos:[["En Kingston cargás trigo y manzanas de los huertos del lago.","trigo y manzanas"],["En Cornwall subís pieles de castor que bajaron por el Ottawa.","trigo, manzanas y pieles"],["En Montreal vendés el trigo y cargás jarabe de arce en latas.","manzanas, pieles y jarabe"],["En Trois-Rivières cargás rollos de papel y tablones de madera.","manzanas, pieles, jarabe, papel y madera"],["En Quebec vendés las pieles al puerto y subís sidra y queso.","manzanas, jarabe, papel, madera, sidra y queso"],["En Tadoussac todo se vende a los barcos del golfo; volvés con bacalao salado.","vendida"]]},
zambeze:{nombre:"Un mokoro",tipo:"canoa",desc:"Una canoa de un solo tronco, tallada en madera de mukwa, que en la llanura inundada se empuja con una pértiga y en el río hondo se rema: el bote de los lozi y de los pescadores de todo el Zambeze. En las cataratas y las presas hay que cargarla por tierra.",zarpe:"Zarpás de la llanura inundada con la pértiga; el río se abre en mil canales.",llegada:"En el delta el mokoro se queda entre los manglares; el Índico es de otros barcos.",
puertos:[["En Mongu cargás pescado seco y esteras de junco de la llanura.","pescado seco y esteras"],["En Katima Mulilo suben sacos de maíz y azúcar de caña.","pescado seco, esteras, maíz y azúcar"],["En Livingstone vendés el pescado antes de que se eche a perder; cargás tallas de madera y cobre que bajó en tren.","esteras, maíz, azúcar, tallas y cobre"],["En Kariba cargás kapenta, el pescadito seco del lago, y maní.","esteras, maíz, azúcar, tallas, cobre, kapenta y maní"],["En Tete vendés el cobre y las tallas; suben carbón y tabaco.","esteras, maíz, azúcar, kapenta, maní, carbón y tabaco"],["En Chinde todo se vende a los barcos del Índico; volvés con sal y telas.","vendida"]]},
tempisque:{nombre:"Un bongo guanacasteco",tipo:"canoa",desc:"Una canoa grande de un solo tronco, con remos y una vela cuando el viento ayuda: el bongo que bajaba el Tempisque cargado y cruzaba el golfo hasta Puntarenas.",zarpe:"Zarpás de la ciudad blanca con la bodega vacía y el río bajo.",llegada:"El bongo entra al golfo de Nicoya; enfrente, Puntarenas.",
puertos:[["Cargás cueros y sebo de las haciendas ganaderas; el bongo espera río abajo.","cueros"],
["Sumás quesos y rosquillas de maíz para el viaje.","cueros y queso"],
["Cargás arroz del llano; en la lluviosa, esta tierra es un lago.","cueros, queso y arroz"],
["Vendés el queso y cargás sacos de maíz y unas tablas de madera.","cueros, arroz, maíz y madera"],
["Todo se vende a las lanchas que cruzan a Puntarenas; volvés con sal.","vendida"]]},
reventazon:{nombre:"Una balsa de rafting",tipo:"balsa",desc:"Una balsa inflable de goma, con remos, casco y chaleco: el Reventazón es uno de los ríos de rafting más famosos de América y fue sede del mundial de 1998.",zarpe:"Zarpás del valle de Orosi con la bodega vacía y el agua fría.",llegada:"La balsa sale a la barra de Parismina; el Caribe rompe enfrente.",
puertos:[["Cargás café del valle de Orosi.","café"],
["Sumás tallas de madera de la Casa del Soñador.","café y tallas"],
["Cargás tapas de dulce del ingenio.","café, tallas y tapa de dulce"],
["Vendés las tallas y cargás queso Turrialba.","café, tapa de dulce y queso"],
["Sumás bananos de las fincas del llano.","café, tapa de dulce, queso y banano"],
["Todo se vende a las lanchas de los canales; volvés con pescado.","vendida"]]},
sarapiqui:{nombre:"Un bote de Sarapiquí",tipo:"canoa",desc:"Un bote largo y angosto, de madera, que hoy lleva motor fuera de borda y antes iba a remo y pértiga río abajo hasta el San Juan.",zarpe:"Zarpás de San Miguel con la bodega vacía y el agua rápida.",llegada:"El bote entra al San Juan; enfrente, Nicaragua.",
puertos:[["Cargás quesos de las lecherías de la montaña.","queso"],
["Sumás palmito de las fincas.","queso y palmito"],
["Sumás piñas doradas de los piñales.","queso, palmito y piña"],
["Vendés el queso y el palmito y cargás cacao de Sarapiquí.","piña y cacao"],
["Todo se vende a los botes del San Juan; volvés con pescado.","vendida"]]},
sanjuan:{nombre:"Un vapor del Tránsito",tipo:"vapor",desc:"Un vapor de rueda y poco calado, como los de la compañía de Vanderbilt que subían el río con pasajeros rumbo a California entre 1851 y 1857.",zarpe:"Zarpás de San Carlos con la bodega vacía y el lago a la espalda.",llegada:"El vapor sale al Caribe por la bahía de San Juan del Norte.",
puertos:[["Cargás queso y cuajada de las fincas del lago.","queso"],
["Sumás cacao de las fincas del río.","queso y cacao"],
["Cargás madera preciosa que baja en balsas.","queso, cacao y madera"],
["Vendés el queso y cargás bananos de Costa Rica.","cacao, madera y banano"],
["Sumás pescado seco de los canales.","cacao, madera, banano y pescado"],
["Todo se vende a los barcos del Caribe; volvés con sal y herramientas.","vendida"]]},

<script>
const MASCOTAS={
nilo:{nombre:"Hipo",especie:"el hipopótamo",emoji:"🦛",glifo:"hipo",hola:"¡Soy Hipo! Vivo aquí, en el lago. Subite, que el río es largo y yo conozco todos los bancos de arena.",mar:"El río se abre en abanico y se va al mar. Yo me quedo en el agua dulce. ¡Volvé pronto!",
paradas:["¿Olés el café? Aquí empieza todo. Agarrate, que la corriente ya nos lleva.","Los pantanos de aquí son mi lugar favorito. Cuidado con los mosquitos: a mí no me pican, pero a vos sí.","¡Mirá! Dos ríos se juntan y son uno. Como dos jarras en un solo balde.","¡Un obelisco en la barca! Si se hunde, no me mirés a mí.","Templos, templos y más templos. Los faraones sí que sabían construir.","¡Qué grande esta ciudad! Aquí me despido, que en la ciudad no dejan entrar hipopótamos."]},
amazonas:{nombre:"Boto",especie:"el delfín rosado",emoji:"🐬",glifo:"delfin",hola:"¡Soy Boto, el delfín rosado! De noche, dicen, me convierto en persona. De día te acompaño.",mar:"Hasta aquí llego. Cuando volvás, buscame donde el agua es dulce.",
paradas:["A esta ciudad no llega ninguna carretera. Todos llegan como nosotros: por el agua.","Tres países en una esquina. Yo cruzo las fronteras sin pasaporte.","¡Mirá las dos aguas que no se mezclan! Una oscura y otra color café con leche. Yo nado en las dos.","Aquí el agua es verde y hay playas de arena blanca. ¿Nadamos un rato?","Se huele el mar. Aquí el río es tan ancho que no se ve la otra orilla."]},
yangtse:{nombre:"Tun",especie:"la marsopa sin aleta",emoji:"🐋",glifo:"marsopa",hola:"Soy Tun, la marsopa que sonríe. Quedamos pocas en este río, así que cuidame.",mar:"El mar. Aquí me doy la vuelta, que el agua salada no me gusta.",
paradas:["¡Cuánta niebla y cuánta gente! Y huele a chile por todas partes.","Las gargantas dan un poco de miedo. Antes, cientos de hombres subían los barcos a pulso por aquí.","Un puente enorme, el primero que cruzó este río. Pasamos por debajo, ¿ves?","Nan es sur y jing es capital. ¿Y Pekín? Bei es norte. ¡Ya sabés tres palabras en chino!","¡Cuántas torres! Aquí el río se llama Huangpu, pero es la misma agua."]},
misisipi:{nombre:"Croac",especie:"la rana toro",emoji:"🐸",glifo:"rana",hola:"¡Croac! Soy Croac, la rana toro. Sí, canto muy fuerte. Ya te vas a acostumbrar.",mar:"El golfo. Agua salada, no gracias. ¡Croac!",
paradas:["¡La única catarata del río! Escuchá cómo suena. Los molinos la usaban para moler harina.","¿Ves ese arco enorme? Es la puerta del Oeste. Y aquí entra el Misuri, que es más largo que nosotros.","Aquí nació el rock. Yo también canto, pero nadie me da un disco.","El bastón rojo. Antes lo clavaban los cazadores para marcar su tierra. Ahora hay chimeneas.","¡Trompetas, desfiles y comida picante! Esta ciudad está más baja que el río. Raro, ¿no?"]},
danubio:{nombre:"Valsa",especie:"el cisne",emoji:"🦢",glifo:"cisne",hola:"Soy Valsa, el cisne. Sé bailar y sé el camino. Diez países, ¡y ninguno como mi río!",mar:"El mar Negro. Yo me quedo en el delta, con los pelícanos. ¡Volvé!",
paradas:["¡Mirá esa torre! Es una de las torres de iglesia más altas del mundo. Desde arriba se ve todo el río.","Un puente de piedra viejísimo; durante siglos fue el único. Pasamos por debajo con la cabeza baja.","Tres ríos de tres colores se juntan. Yo prefiero el azul, obviamente.","Aquí hacen una tarta con enrejado. Los cisnes no comemos tarta, pero vos podés.","¡Mi ciudad! Aquí escribieron un vals con mi nombre... bueno, con el nombre del río.","Un castillo blanco como yo. Y Viena está a solo 60 km: dos capitales casi vecinas.","Buda en la colina, Pest en el llano y yo en medio. ¿Ves el puente de las cadenas?","La ciudad blanca. Aquí me despido: más abajo el río se mete entre montañas."]},
rin:{nombre:"Bíber",especie:"el castor",emoji:"🦫",glifo:"castor",hola:"Soy Bíber, el castor. Construyo presas, pero prometo no tapar el río mientras viajás.",mar:"El mar del Norte, frío y gris. Yo me vuelvo a mi presa. ¡Chau!",
paradas:["El río dobla como un codo. Y aquí hay tres países en una esquina, pero un solo puerto suizo.","Esta ciudad cambió de país cinco veces. Yo siempre fui del río.","Aquí un señor llamado Gutenberg inventó la imprenta. Sin él no habría libros. Ni este juego.","¡Castillos por todos lados! Cuidado con la Lorelei, que canta y distrae a los capitanes.","Dos torres altísimas y olor a perfume. Aquí inventaron el agua de colonia.","Grúas, grúas y más grúas. Es el puerto de río más grande de Europa.","El puerto más grande del continente. Los barcos son tan grandes que parecen ciudades."]},
ganges:{nombre:"Gavi",especie:"el gavial",emoji:"🐊",glifo:"gavial",hola:"Soy Gavi, el gavial. Mi hocico es largo y finito para pescar. Tranquilo: no como personas.",mar:"Los manglares y los tigres. Yo me quedo aquí; vos no te bajés del barco.",
paradas:["Aquí el río sale de las montañas. Por la tarde sueltan lucecitas en el agua. ¡Mirá!","Uf, las fábricas de cuero ensucian el agua. Nadá con la boca cerrada.","Tres ríos se juntan aquí, aunque uno es invisible. Cada doce años viene muchísima gente.","Escaleras hasta el agua y gente rezando desde antes del amanecer. Es el lugar más antiguo del río.","Hace mucho, esta fue una de las ciudades más grandes del mundo. Ahora comemos arroz.","Un puente gigante y un mercado enorme. El río aquí se llama Hooghly."]},
volga:{nombre:"Belu",especie:"el esturión",emoji:"🐟",glifo:"esturion",hola:"Soy Belu, un esturión. Puedo vivir cien años y medir cuatro metros. Todavía soy chiquito.",mar:"El Caspio es un mar sin salida. Yo nací aquí, y aquí me quedo.",
paradas:["Aquí el río es tan angosto que casi salto a la otra orilla.","El escudo de la ciudad tiene un oso con un hacha. Yo prefiero uno con un pez.","¡La feria más grande de Rusia! Té, pieles, telas... y mucha gente gritando precios.","Una mezquita y una iglesia dentro del mismo castillo. Y el nombre de la ciudad quiere decir caldero.","El río hace una vuelta enorme alrededor de unas montañas. ¡Parece un anzuelo!","Una estatua gigante con una espada mira el río. Aquí hubo una batalla muy grande.","El río se deshace en cientos de brazos. Aquí viven mis primos, y crecen las sandías más ricas."]},
tigris:{nombre:"Rafi",especie:"la tortuga de caparazón blando",emoji:"🐢",glifo:"tortuga",hola:"Soy Rafi, la tortuga de caparazón blando. Vivo entre los dos ríos, donde inventaron la escritura.",mar:"El golfo. Yo me quedo en el agua dulce; los dátiles siguen en barco hasta la India.",
paradas:["Murallas negras y sandías más grandes que yo. ¡No las dejés caer!","Enfrente estaba Nínive, una ciudad con toros alados en las puertas.","Aquí nació Saladino. Ochocientos años después, otro señor famoso, pero mucho menos simpático.","¡Un minarete en espiral! Se sube caminando por afuera, como un caracol.","Una ciudad redonda con la biblioteca más grande del mundo. Hasta que vinieron los mongoles.","Palmeras de dátiles hasta donde alcanza la vista. Y de aquí zarpaba Simbad."]},
mekong:{nombre:"Buk",especie:"el bagre gigante",emoji:"🐠",glifo:"bagre",hola:"Soy Buk, el bagre gigante. Puedo pesar 300 kilos. Lo digo para que me respeten.",mar:"Nueve brazos, los nueve dragones, y el mar. Yo no salgo: soy de agua dulce y de arroz.",
paradas:["Elefantes, palmeras y té. Aquí el río todavía se llama Lancang.","Cada mañana los monjes hacen una fila naranja. En orden, como tus ciudades.","Una ciudad tranquila. Enfrente, al otro lado del agua, ya es Tailandia.","Cuatro brazos de río se juntan. Y hay un lago que se llena y se vacía como un pulmón.","Un mercado donde las tiendas son barcas. Se compra sin bajarse del bote."]},
niger:{nombre:"Mana",especie:"el manatí",emoji:"🦭",glifo:"manati",hola:"Soy Mana, el manatí. Soy lento, pero me conozco el bumerán entero.",mar:"El golfo de Guinea. El río nació a 240 km de aquí y dio la vuelta entera. ¡Qué viaje!",
paradas:["Río de cocodrilos, se llama. Yo nado lejos de ellos, y vos también.","Aquí el río se desparrama en lagos. Las barcas son taxis y la mezquita es de barro.","Sal del desierto, oro del río y libros en el medio. La ciudad del misterio.","¡Aquí el río gira! Hasta ahora íbamos hacia el desierto; ahora vamos al mar.","Cerca viven las últimas jirafas de esta parte de África. Saludá.","Entra otro río y el nuestro se pone gordo. Doble de agua, doble de manatíes.","Manglares, torres de petróleo y fuego de noche. Aquí termina mi camino."]},
parana:{nombre:"Lobi",especie:"el lobito de río",emoji:"🦦",glifo:"nutria",hola:"Soy Lobi, el lobito de río. Nado rápido y hablo mucho. Vamos.",mar:"El Atlántico. Yo me vuelvo río arriba, que el agua salada me pica.",
paradas:["¿Escuchás las cataratas? Son del río de al lado, pero el ruido llega hasta aquí.","Una misión de piedra roja. Hace mucho, aquí vivían guaraníes y curas juntos.","Aquí entra el río Paraguay y suena el chamamé. ¿Vos bailás?","Silos y silos de soya. Y aquí inventaron la bandera argentina.","El río es tan ancho que parece mar, y de color café con leche.","Un cerro chiquito y una playa larguísima. Fin del viaje. ¿Un helado?"]},
indo:{nombre:"Bulán",especie:"el delfín del Indo",emoji:"🐬",glifo:"delfin",hola:"Soy Bulán, el delfín ciego. Casi no veo, pero oigo todo. Vos mirá por los dos.",mar:"El mar Arábigo. Yo me quedo donde queda agua. Cuidala.",
paradas:["¡Qué alto! Aquí el aire es finito y las montañas son de colores.","Desde aquí salen las expediciones al K2, la segunda montaña más alta del mundo. Albaricoques para el camino.","Por este vado cruzaron todos: Alejandro, los mogoles... y ahora nosotros.","Una presa con 66 compuertas reparte el agua como una regadera. Cerca hay ruinas de hace 4 500 años.","Casas con torres de viento en el techo, para atrapar la brisa.","Una ciudad enorme junto al delta. Aquí el río ya casi no llega."]},
congo:{nombre:"Lola",especie:"la bonobo",emoji:"🐵",glifo:"bonobo",hola:"¡Soy Lola, la bonobo! Vivimos solo aquí, en la orilla izquierda del Congo. Somos primos de ustedes y todo lo arreglamos jugando.",mar:"El mar. Yo me devuelvo a mi selva, del lado de siempre. Vos contá el río.",
paradas:["Papiros, lagos y garzas. Aquí el río recién aprende a llevar barcos.","¡Un tren! La carga sube y baja. Nosotros preferimos las lianas.","¿Escuchás las cataratas? Los pescadores cuelgan trampas encima. Yo no me acerco.","Un pie en cada mitad del mundo. El río está tan ancho que no se ve la otra orilla.","¡Dos ciudades enormes, una a cada lado! Mi santuario está cerca de aquí. Cuidado con el tráfico.","Piedras, un puente altísimo y barcos de mar. De aquí para arriba no suben.","Un baobab viejísimo y olor a sal. Ya casi es el mar."]},
huanghe:{nombre:"Li",especie:"la carpa",emoji:"🐟",glifo:"carpa",hola:"¡Soy Li, la carpa! Dicen que si salto la Puerta del Dragón me vuelvo dragón. Todavía no, pero me sé el río entero.",mar:"El golfo de Bohai: agua salada y barro nuevo. Yo me devuelvo a saltar la puerta; vos contá el río.",
paradas:["Balsas de piel de oveja y un puente de hierro. Aquí el río todavía es casi azul.","Arroz en el desierto, gracias a canales viejísimos. Aquí el río se porta bien.","La gran vuelta. Humo de acero y ciervos en el nombre. Ahora vamos hacia el sur.","Trenes por todos lados. Debajo de la ciudad hay otra ciudad, de hace 3 500 años.","El río pasa por arriba de las casas. Mirá para arriba, que el agua está ahí.","Cientos de manantiales. Yo me bañaría en Baotu; el río pasa por el norte.","Tierra nueva cada año, hecha de barro. ¡Y el mar!"]},
orinoco:{nombre:"Tami",especie:"el caimán del Orinoco",emoji:"🐊",glifo:"cocodrilo",hola:"¡Soy Tami, el caimán del Orinoco! Aunque me digan caimán, soy un cocodrilo de verdad, de los más largos de América. Quedamos pocos. Vamos río abajo.",mar:"El delta. Yo me quedo en los caños, que los waraos me conocen. Vos contá el río.",
paradas:["Tres ríos de colores se juntan aquí. El Atabapo es negro como el té.","¡Raudales! El agua salta entre piedras enormes. Los barcos se bajan y van por la carretera.","Del otro lado ya es Colombia. Aquí llega el Meta con agua de los Llanos.","El río dobla hacia el sol de la mañana. En la orilla cuentan semillas que huelen a vainilla.","¡Qué angosto se pone el río! Un puente altísimo lo cruza de un salto.","Dos aguas juntas y sin mezclarse, y unas grúas que cargan hierro. Ya huele a mar."]},
murray:{nombre:"Pico",especie:"el ornitorrinco",emoji:"🦆",glifo:"ornitorrinco",hola:"¡Soy Pico, el ornitorrinco! Tengo pico de pato, cola de castor, pongo huevos y nado con los ojos cerrados. Vamos río abajo.",mar:"El lago y la boca. Yo me quedo en el agua dulce; vos contá el río.",
paradas:["El río baja frío de la montaña y aquí lo frena una presa. ¡Brrr!","¡Vapores de ruedas! Silban y echan humo. Yo me escondo debajo del muelle.","Cisnes negros por todos lados. De noche no dejan dormir a nadie.","Naranjas, uvas y sol. El río riega un desierto y lo pone verde.","Viñas hasta la orilla. Este ya es el último estado del viaje.","¡Un puente de hierro! Fue el primero sobre el río. El tren pasa arriba.","Un lago enorme y, al fondo, el mar. Las compuertas no dejan entrar la sal."]},
sanlorenzo:{nombre:"Bela",especie:"la beluga",emoji:"🐳",glifo:"beluga",hola:"¡Soy Bela, la beluga! Soy una ballena blanca y chiquita, y canto tanto que me dicen el canario del mar. Vamos río abajo.",mar:"El golfo. Yo me quedo en la boca del Saguenay, con mi familia. Vos contá el río.",
paradas:["El lago se vuelve río entre mil islas. ¡Contalas si podés!","Una escalera de agua para barcos enormes. Suben y bajan escalón por escalón.","¡Rápidos! Aquí las canoas saltaban. Ahora hay un canal y un puente larguísimo.","Tres brazos de río y olor a papel recién hecho.","El río se aprieta bajo un cabo alto. Arriba hay murallas.","¡Agua salada por fin! Aquí vive mi familia, en la boca del fiordo."]},
zambeze:{nombre:"Tembo",especie:"el elefante",emoji:"🐘",glifo:"elefante",hola:"¡Soy Tembo, el elefante! Cruzo el río nadando con la trompa de periscopio. Vamos río abajo.",mar:"El delta. Yo me quedo en la orilla, que el mar es salado. Vos contá el río.",
paradas:["Una llanura toda inundada. El rey se muda en barca, con tambores.","Aquí cuatro países se tocan. Yo cruzo sin pasaporte.","¡El humo que truena! Es una catarata tan grande que llueve para arriba.","Un lago que hicieron las personas. A muchos animales los sacaron en bote.","Un puente colgante y mucho calor. Yo me echo agua con la trompa.","Manglares y olor a sal. Ya llegamos al final."]},
tempisque:{nombre:"Lalo",especie:"el cocodrilo del Tempisque",emoji:"🐊",glifo:"cocodrilo",hola:"Soy Lalo, cocodrilo. Tomo el sol en el barro y no como capitanes. Palabra.",mar:"El golfo de Nicoya. Hasta aquí llego; el agua salada me pica la panza.",
paradas:["La ciudad blanca. Yo no entro: mucha gente y poca sombra.","Aquí el río todavía trae piedras. Cuidado con la panza del bongo.","Cuando llueve, este llano se vuelve un lago y yo nado hasta las casas.","Los bongos cargaban maíz aquí. A mí me gusta más el pescado.","Enfrente está Palo Verde: miles de patos y garzas. Mi comedor favorito."]},
reventazon:{nombre:"Nuria",especie:"la nutria de río",emoji:"🦦",glifo:"nutria",hola:"Soy Nuria, la nutria. Nado boca arriba y como cangrejos. Subite a la balsa.",mar:"El Caribe. Las olas son más grandes que yo; me quedo en la barra.",
paradas:["Aquí el agua baja helada de Tapantí. ¡Brrr! Igual me meto.","Una pared enorme guarda el agua. Del otro lado el río se calma.","Huele a caña dulce y a café. Yo prefiero un pez.","Las balsas de colores saltan las olas. ¡Yo voy adelante!","Otra pared gigante, la más grande. Ya casi estamos en el llano.","Tortugas en la playa y lanchas en el canal. Ya casi llegamos."]},
sarapiqui:{nombre:"Bruno",especie:"el mono congo",emoji:"🐒",glifo:"mono",hola:"Soy Bruno, el mono congo. Grito más fuerte que la lluvia, pero no muerdo. Vamos.",mar:"El río San Juan. Desde la orilla los despido con un grito.",
paradas:["Aquí el río viene bajando a los saltos. Yo me agarro fuerte de la rama.","Desde los árboles veo saltar las balsas. Yo prefiero mirar.","Este higuerón es mi casa. ¿Oíste ese grito? Era yo.","Aquí hay científicos con binoculares mirándome todo el día.","Enfrente ya es Nicaragua. Los monos de allá gritan igual que yo."]},
sanjuan:{nombre:"Tiburcio",especie:"el tiburón toro",emoji:"🦈",glifo:"tiburon",hola:"Soy Tiburcio, el tiburón toro. Subo del mar al lago como si nada; el agua dulce no me asusta.",mar:"El Caribe. Yo voy y vengo entre el mar y el lago; vos elegís.",
paradas:["Aquí termina mi lago y empieza el río. ¡Qué grande!","Los sábalos saltan y yo los persigo, pero son rápidos.","Un raudal con piedras y un castillo encima. Cuidado con la panza.","Entra un río nuevo, con agua café de Costa Rica.","El río se parte y casi toda el agua se va por el Colorado. Yo sigo derecho.","¡El mar! Sal en el agua y olas en la nariz. Aquí me quedo un rato."]},
tarcoles:{nombre:"Ara",especie:"la lapa roja",emoji:"🦜",glifo:"lapa",hola:"Soy Ara, la lapa roja. Grito, vuelo en pareja y me encantan los almendros de la costa. Vamos.",mar:"El golfo de Nicoya. Yo me quedo en los almendros de la playa; vos seguí.",
paradas:["Aquí el río es una quebrada entre casas y cafetales. Todavía huele a flores.","Mucho ruido de fábricas y carros. Yo paso rapidito por encima.","Dos ríos se juntan y el agua se pone ancha. Ahora sí es un río.","Frutas por todos lados. ¡Mangos! Yo tomo uno prestado.","Cocodrilos abajo y lapas arriba. Ese puente es mi mirador favorito."]},
terraba:{nombre:"Pinzas",especie:"el cangrejo del manglar",emoji:"🦀",glifo:"cangrejo",hola:"Soy Pinzas, cangrejo de manglar. Camino de lado, pero llego. Subite.",mar:"El Pacífico, y mi manglar. Aquí me quedo, entre las raíces.",
paradas:["Aquí el río salta entre piedras y el agua está fría. ¡Yo me agarro!","Huele a piña por todos lados. ¿Será que a los cangrejos nos gusta?","Dos ríos se juntan y ahora el agua es ancha y café.","Máscaras de colores en las casas. A mí me dan un poquito de susto.","Esferas de piedra en el suelo. Redondas, redondas. Yo no sé rodar.","¡Mi manglar! Raíces, barro y mareas. Llegamos."]}
};
</script>

<script>
const EVENTOS={
nilo:[
{tramo:3,icono:'animal:cocodrilo',titulo:"Cocodrilos del Sudd",reto:"imagen",texto:"En el pantano del Sudd viven cocodrilos del Nilo, los más grandes de África, y uno se cruzó delante de la falúa. Se aparta si le contás algo de una ciudad que ya conocés.",bien:"El cocodrilo se hunde despacio y deja pasar la falúa.",mal:"El cocodrilo bosteza y se queda un rato; esperamos a que se vaya."},
{tramo:4,icono:'ola',titulo:"Las seis cataratas",reto:"ruta",texto:"Entre Jartum y Asuán el río salta seis cataratas: piedras y rápidos que frenaban a los barcos y marcaban la frontera con Nubia. Para pasarlas hay que saber qué viene después.",bien:"Esquivás las piedras como un barquero nubio.",mal:"La falúa raspa una piedra y hay que remendarla en la orilla."},
{tramo:6,icono:'ola',titulo:"El nilómetro",reto:"frase",texto:"Durante miles de años el río crecía cada verano con las lluvias de Etiopía y dejaba limo en los campos. En la isla de Roda, en El Cairo, un nilómetro del año 861 medía la crecida: de esa marca dependían la cosecha y los impuestos. Desde la presa de Asuán (1970) la crecida ya no llega. Para leer la marca hay que recitar la frase entera.",bien:"Crecida buena: los campos se cubren de limo y la frase quedó entera.",mal:"La marca no se lee; repasá la frase y seguimos."}],
amazonas:[
{tramo:6,icono:'ola',titulo:"La pororoca",reto:"frase",texto:"Cerca de la boca del río, con la marea, una ola llamada pororoca remonta el Amazonas contra la corriente. Agarrate fuerte y recitá la ruta entera para no perder el rumbo.",bien:"Pasás la ola con la frase en la boca.",mal:"La ola da vuelta las hamacas; salís empapado, pero entero."},
{tramo:2,icono:'pez',titulo:"Pirañas",reto:"imagen",texto:"En las aguas quietas viven las pirañas, con dientes como navajas. No cazan gente: comen peces y lo que flota. Pero un banco rodea la canoa por curiosidad, y para que se vaya hay que contar algo de una ciudad que ya conocés.",bien:"Las pirañas se aburren y se van en bandada.",mal:"Una piraña muerde el remo, solo para probar; seguís con el remo mordido."},
{tramo:3,icono:'ola',titulo:"El encuentro de las aguas",reto:"ruta",texto:"Frente a Manaos el río Negro, oscuro como café, se junta con el Solimões, pardo y frío, y los dos corren lado a lado unos seis kilómetros sin mezclarse, por la diferencia de temperatura y velocidad. Para tomar el agua correcta hay que saber adónde sigue el río.",bien:"Del lado pardo, río abajo: el encuentro quedó atrás.",mal:"Te fuiste por el agua negra, que sube hacia otro lado; repasá la ruta y seguimos."}],
yangtse:[
{tramo:2,icono:'piedra',titulo:"Las Tres Gargantas",reto:"ruta",texto:"El río se mete entre paredes de roca en las Tres Gargantas. Hasta hace un siglo, cientos de sirgadores subían los juncos a pulso por aquí. Bajando, el timonel tiene que saber qué viene después.",bien:"El junco baja las gargantas derechito.",mal:"El junco da vueltas en un remolino; los sirgadores se ríen desde la orilla."},
{tramo:3,icono:'puente',titulo:"El primer puente",reto:"frase",texto:"Hasta 1957 ningún puente cruzaba el Yangtsé: los trenes pasaban en ferry. El puente de Wuhan fue el primero, con dos pisos, uno para el tren y otro para los carros. Al pasar debajo, el capitán pide la frase del río.",bien:"Pasás bajo el puente con la frase entera.",mal:"Te distraés mirando el puente y das una vuelta de más."},
{tramo:6,icono:'ola',titulo:"La isla que crece",reto:"mar",texto:"El Yangtsé arrastra tanto limo que en su boca la isla de Chongming creció de un banco de arena, en el siglo VII, a más de 1 200 km², la tercera isla de China; sigue creciendo cada año hacia el mar. Para salir sin encallar hay que saber a qué mar va el río.",bien:"Canal correcto: la isla queda a babor y el mar abre adelante.",mal:"Encallaste en el limo; repasá el mar y seguimos."}],
misisipi:[
{tramo:3,icono:'niebla',titulo:"Niebla en el río",reto:"ruta",texto:"Se cerró la niebla y no se ve la orilla. Los pilotos de vapor, como el joven Mark Twain, se sabían el río de memoria, banco por banco. Ahora te toca a vos.",bien:"Salís de la niebla justo frente al muelle.",mal:"El vapor encalla en un banco de arena y toca esperar a que suba el agua."},
{tramo:4,icono:'ola',titulo:"La gran crecida de 1927",reto:"frase",texto:"En 1927 el río se salió de madre y cubrió unos 70 000 km²: pueblos enteros bajo el agua y cientos de miles de personas sin casa. Con la orilla perdida, el piloto recita la ruta entera para no salirse del cauce.",bien:"Seguís el cauce con la frase en la boca.",mal:"El vapor se mete a un campo inundado y toca esperar a que baje el agua."},
{tramo:2,icono:'nudo',titulo:"La escalera de esclusas",reto:"imagen",texto:"Desde los años 1930, 29 esclusas y presas convierten el alto Misisipi en una escalera de agua de Mineápolis a San Luis, para que las barcazas naveguen todo el año. Justo antes de San Luis entra el Misuri, que es más largo que el propio Misisipi. Para pedir paso en la esclusa hay que reconocer una parada que ya viste.",bien:"Compuertas abiertas: un escalón menos hasta el golfo.",mal:"La esclusa se cerró antes de tiempo; repasá la imagen y seguimos."}],
danubio:[
{tramo:4,icono:'aduana',titulo:"El aduanero",reto:"pais",texto:"Pasando Passau el río entra en Austria. Un aduanero sube a la barcaza y pide los papeles: ¿adónde vas y en qué país queda?",bien:"Sella los papeles y te desea buen viaje.",mal:"Revisa la carga entera, lento, muy lento, antes de dejarte seguir."},
{tramo:9,icono:'piedra',titulo:"Las Puertas de Hierro",reto:"frase",texto:"Río abajo de Belgrado el Danubio se aprieta entre montañas en las Puertas de Hierro, un cañón temido por los barqueros hasta que las presas lo domaron. El capitán recita la ruta entera para no perder la cuenta.",bien:"Pasás el cañón con la frase entera.",mal:"Un remolino te da tres vueltas; salís mareado, pero a flote."},
{tramo:8,icono:'aduana',titulo:"El segundo aduanero",reto:"pais",texto:"El Danubio cruza diez países, más que ningún otro río. Pasando Budapest sale de Hungría, y otro aduanero sube a bordo: ¿en qué país queda la próxima parada?",bien:"Sella los papeles y te pide un pan de la barcaza.",mal:"Cuenta cada bulto de la bodega, despacio, antes de dejarte seguir."}],
rin:[
{tramo:4,icono:'ola',titulo:"La Lorelei",reto:"frase",texto:"En la garganta del Rin, sobre una roca alta, la leyenda pone a una mujer que canta y distrae a los capitanes hasta hacerlos chocar. Para no escucharla, cantá vos más fuerte: la frase del río.",bien:"Tu canción tapa la suya y la barcaza pasa la roca.",mal:"Te quedaste escuchando y la barcaza rozó la roca."},
{tramo:2,icono:'puente',titulo:"El río enderezado",reto:"imagen",texto:"Hasta 1817 el Rin daba mil vueltas por esta llanura; el ingeniero Tulla lo enderezó y lo acortó unos 80 km. Con tanta curva cortada, el barquero se confunde: contá algo de una ciudad que ya conocés para ubicarte.",bien:"Encontrás el cauce nuevo, derechito.",mal:"Te metés a un brazo viejo del río y hay que dar la vuelta."},
{tramo:6,icono:'barca:barcaza',titulo:"El puerto interior",reto:"pais",texto:"En Duisburgo, donde entra el Ruhr, está el puerto interior más grande de Europa: por él pasan cada año millones de toneladas de carbón, acero y contenedores en barcazas que suben hasta Basilea. En la aduana del puerto te preguntan de qué país es la ciudad.",bien:"Papeles en regla: la barcaza atraca en Duisburgo.",mal:"La aduana te devolvió; repasá el país y seguimos."}],
ganges:[
{tramo:2,icono:'niebla',titulo:"Niebla de invierno",reto:"mar",texto:"En invierno una niebla espesa cubre la llanura del Ganges durante días y las barcas no ven ni la proa. Solo sigue quien sabe adónde va el río.",bien:"Con el rumbo claro, remás derecho hasta que la niebla se abre.",mal:"Das vueltas en la niebla hasta que sale el sol."},
{tramo:3,icono:'vela',titulo:"La Kumbh Mela",reto:"frase",texto:"Cada doce años, en la Kumbh Mela de Prayagraj, millones de peregrinos se bañan en la confluencia del Ganges y el Yamuna: la reunión de gente más grande del planeta. Con tanta multitud, el barquero pide la frase del río para no perderse.",bien:"Pasás la multitud recitando la ruta.",mal:"Te quedás atrapado entre los botes hasta que baja la gente."},
{tramo:4,icono:'animal:delfin',titulo:"El delfín del Ganges",reto:"imagen",texto:"Entre Kanpur y Benarés todavía vive el delfín del Ganges, casi ciego, que caza con el sonido en el agua turbia; es el animal acuático nacional de la India desde 2009 y quedan unos pocos miles. Para verlo salir a respirar hay que reconocer una parada que ya viste.",bien:"¡Salió a respirar justo al lado de la barca!",mal:"Se hundió sin que lo vieras; repasá la imagen y seguimos."}],
volga:[
{tramo:3,icono:'hielo',titulo:"Viene el hielo",reto:"ruta",texto:"El Volga se congela cada invierno y la navegación se para por meses. Los burlaki apuran: hay que llegar antes de que el hielo cierre el río. ¿Sabés qué viene después?",bien:"La lodia llega con el primer hielo crujiendo detrás.",mal:"El hielo alcanza la lodia y toca esperar el deshielo."},
{tramo:4,icono:'nudo',titulo:"Los sirgadores",reto:"imagen",texto:"Hasta hace poco más de un siglo, cuadrillas de sirgadores arrastraban las barcazas río arriba con sogas, cantando para llevar el paso; un pintor, Repin, los hizo famosos. Una cuadrilla te pide una historia a cambio de un empujón: contá algo de una ciudad que ya conocés.",bien:"Los sirgadores te dan el empujón y siguen cantando.",mal:"Se ríen de tu historia y te dejan remar solo un rato."},
{tramo:8,icono:'ola',titulo:"El delta de los lotos",reto:"mar",texto:"El delta del Volga, el más grande de Europa, se abre en cientos de brazos entre campos de lotos, con pelícanos y flamencos; el mar al que sale está 28 m bajo el nivel del océano y no tiene salida. Para no perderte entre los brazos hay que saber a qué mar sale el río.",bien:"Brazo correcto: los lotos quedan atrás y se abre el mar.",mal:"Este brazo termina en un cañaveral; repasá el mar y seguimos."}],
tigris:[
{tramo:2,icono:'aduana',titulo:"La frontera",reto:"pais",texto:"El kelek cruza de Turquía a Irak. En el puesto de la frontera revisan los odres uno por uno y preguntan adónde vas y en qué país queda.",bien:"Sellan los papeles y el kelek sigue flotando.",mal:"Desinflan medio kelek para revisarlo y hay que volver a soplar los odres."},
{tramo:5,icono:'arena',titulo:"Tormenta de arena",reto:"ruta",texto:"Un viento del desierto levanta una pared de polvo que tapa el sol y la orilla; en Irak pasa varias veces al año. Para no perderse en la nube hay que saber qué viene después.",bien:"Salís de la nube justo frente al muelle.",mal:"La barca da vueltas en el polvo hasta que el viento se calma."},
{tramo:6,icono:'barca:canoa',titulo:"Los pantanos de Mesopotamia",reto:"imagen",texto:"Antes de Basora el Tigris se junta con el Éufrates entre los pantanos de Mesopotamia, donde los árabes de los pantanos viven en casas de caña y andan en canoas mashuf. Se secaron casi del todo en los años 1990 y desde 2003 vuelven a llenarse. Para que un pescador te guíe hay que reconocer una parada que ya viste.",bien:"El pescador te lleva por el canal entre las cañas.",mal:"Te perdiste en el cañaveral; repasá la imagen y seguimos."}],
mekong:[
{tramo:4,icono:'ola',titulo:"Los rápidos de Khone",reto:"ruta",texto:"Antes de Camboya el Mekong se despeña en las cataratas de Khone, las que frenaron a la expedición francesa de 1866. Hay que sacar la barca del agua y cargarla por tierra: ¿sabés qué sigue después?",bien:"Cargás la barca por la orilla y la volvés a botar río abajo.",mal:"La barca se te escapa en los rápidos y la rescatás río abajo, empapada."},
{tramo:5,icono:'barca:canoa',titulo:"El mercado flotante",reto:"imagen",texto:"En el delta se compra y se vende desde los botes: el mercado flotante de Cai Rang, cerca de Can Tho, abre al amanecer, y cada bote cuelga en un palo alto lo que vende. Para que te vendan algo, contá algo de una ciudad que ya conocés.",bien:"Te venden un racimo de rambutanes y te abren paso.",mal:"Los botes te cierran el paso hasta que termina el mercado."},
{tramo:2,icono:'animal:elefante',titulo:"El reino del millón de elefantes",reto:"imagen",texto:"Luang Prabang fue la capital de Lan Xang, «el reino del millón de elefantes», fundado en el siglo XIV; hoy en Laos quedan apenas unos cientos, y cada amanecer los monjes recorren la ciudad recibiendo arroz. Para que un elefante te deje pasar hay que reconocer una parada que ya viste.",bien:"El elefante se aparta y saluda con la trompa.",mal:"El elefante no se mueve; repasá la imagen y seguimos."}],
niger:[
{tramo:5,icono:'animal:hipo',titulo:"Hipopótamos",reto:"imagen",texto:"Por aquí el río tiene manadas de hipopótamos, y una entera cerró el paso. Se apartan despacio si les contás la historia de una ciudad que ya conocés.",bien:"La manada se abre y la pinaza pasa por el medio.",mal:"Los hipopótamos ni se mueven; toca rodearlos por el barro."},
{tramo:6,icono:'aduana',titulo:"El puesto de la frontera",reto:"pais",texto:"El río sale de Níger y entra en Nigeria: dos países con nombre de río. En el puesto revisan la pinaza y preguntan adónde vas y en qué país queda.",bien:"Sello, sonrisa y a seguir.",mal:"Te tienen una hora al sol contando sacos de cacahuate."},
{tramo:3,icono:'niebla',titulo:"El harmatán",reto:"ruta",texto:"De noviembre a marzo sopla el harmatán, un viento seco que trae el polvo del Sáhara y vuelve el cielo color de leche. Con la orilla borrada, hay que saber qué viene después.",bien:"Seguís el cauce con los ojos entrecerrados.",mal:"La piragua encalla en un banco de arena que no se veía."}],
parana:[
{tramo:4,icono:'animal:cocodrilo',titulo:"Un yacaré en el camalote",reto:"imagen",texto:"Con la crecida bajan islas flotantes de camalotes y a veces traen un yacaré dormido. El lanchón no puede rodearlas: contale bajito la historia de una ciudad que ya pasaste, para que no se despierte.",bien:"El yacaré ni abre un ojo y la isla se aparta.",mal:"El yacaré abre un ojo, bosteza, y hay que esperar a que la isla pase."},
{tramo:6,icono:'viento',titulo:"La sudestada",reto:"mar",texto:"Un viento del sureste empuja el agua del Río de la Plata contra la costa y el río sube y se mete en las calles de Buenos Aires. El práctico no zarpa hasta que le digás adónde va a dar este río.",bien:"Esperás a que amaine y salís con el río en calma.",mal:"La sudestada te deja pegado al muelle un día entero."},
{tramo:2,icono:'nudo',titulo:"La presa de Yacyretá",reto:"pais",texto:"Entre Argentina y Paraguay la presa de Yacyretá cierra el río desde 1994; cuando el embalse llegó a su nivel, en 2011, el agua cubrió la parte baja de Encarnación y la ciudad se mudó más arriba, con una costanera nueva. La esclusa deja pasar los barcos, pero antes preguntan de qué país es la ciudad.",bien:"Esclusa abierta: la barca baja al otro lado de la presa.",mal:"La esclusa no abre sin la respuesta; repasá el país y seguimos."}],
indo:[
{tramo:5,icono:'arena',titulo:"Bancos de arena",reto:"mar",texto:"En Sind el Indo cambia de cauce con cada crecida y deja bancos de arena donde ayer había agua. La barca encalló. Para salir hay que saber hacia dónde va el río.",bien:"Con la pértiga y el rumbo claro, la barca vuelve al agua honda.",mal:"Empujás la barca por la arena un buen rato hasta encontrar el canal."},
{tramo:4,icono:'lluvia',titulo:"El monzón de 2010",reto:"ruta",texto:"En 2010 las lluvias del monzón desbordaron el Indo y una quinta parte de Pakistán quedó bajo el agua. Con el río convertido en un mar, hay que saber qué viene después para no perderse.",bien:"Encontrás el cauce entre los campos inundados.",mal:"La barca se pierde en el agua ancha y das vueltas hasta ver un poblado."},
{tramo:3,icono:'espada',titulo:"El puente de barcas de Alejandro",reto:"frase",texto:"En 326 a. C. Alejandro Magno cruzó el Indo cerca de Attock por un puente de barcas para entrar a la India, justo donde el río sale de las montañas y recibe al Kabul. Aquí también se cruzaron los ejércitos de Babur y de los mogoles. Para pasar el puente hay que recitar la frase entera.",bien:"Puente cruzado: el ejército sigue río abajo.",mal:"Las barcas se soltaron; repasá la frase y seguimos."}],
congo:[
{tramo:3,icono:'ola',titulo:"Las cataratas Boyoma",reto:"ruta",texto:"Siete saltos en cien kilómetros y más agua que en ninguna otra catarata del mundo: ningún barco las baja. Desde 1906 un tren de 125 km las rodea, de Ubundu a Kisangani; hay que saber adónde sigue el río para no perder el tren.",bien:"Tren tomado: la carga llega abajo de las cataratas.",mal:"Perdiste el tren; la carga espera un día entre el ruido del agua."},
{tramo:6,icono:'viento',titulo:"Las cataratas Livingstone",reto:"frase",texto:"Entre Kinshasa y Matadi el río baja 270 m en 350 km de rápidos, treinta y dos saltos donde Stanley perdió a varios compañeros en 1877. El tren de 1898 los rodea; la barcaza se queda en el Pool.",bien:"La frase entera y el tren a Matadi.",mal:"Sin la frase te bajás en la estación equivocada; repasá y seguimos."},
{tramo:4,icono:'ola',titulo:"La línea del ecuador",reto:"imagen",texto:"Cerca de Mbandaka el río cruza la línea del ecuador: es el único gran río que la cruza dos veces, una hacia el norte y otra hacia el sur, y un monumento en la ciudad marca el punto. Para saber en qué mitad del mundo estás hay que reconocer una parada que ya viste.",bien:"Hemisferio sur otra vez, y la imagen bien puesta.",mal:"Cruzaste la línea sin darte cuenta; repasá la imagen y seguimos."}],
huanghe:[
{tramo:4,icono:'animal:carpa',titulo:"La Puerta del Dragón",reto:"ruta",texto:"Entre Hukou y Longmen el río se aprieta en una garganta y cae con un estruendo que se oye de lejos. La leyenda dice que la carpa que logre saltar la Puerta del Dragón se convierte en dragón. Li quiere saltar; vos tenés que saber qué parada sigue.",bien:"¡Saltó! Y vos sabías el camino.",mal:"Li se quedó abajo de la puerta; repasá la ruta y salta otra vez."},
{tramo:6,icono:'ola',titulo:"El río que se mudó",reto:"frase",texto:"En 1855 el Huang He rompió los diques en Tongwaxiang y se fue al norte: dejó de salir al mar Amarillo y desde entonces sale al golfo de Bohai, cientos de kilómetros más arriba. Un río que cambia de boca; la frase te dice adónde va ahora.",bien:"Con la frase, el río nuevo no te pierde.",mal:"Te quedaste en el cauce viejo, seco; repasá la frase y seguimos."},
{tramo:5,icono:'piedra',titulo:"El río colgado",reto:"imagen",texto:"En Kaifeng el Huang He corre por encima de la ciudad: el limo que deja levanta el lecho y los diques suben con él, hasta 10 m sobre las calles; por eso lo llaman «el río colgado». Bajo la ciudad de hoy hay seis ciudades más antiguas, enterradas por sus crecidas. Para mirar la muralla desde arriba hay que reconocer una parada que ya viste.",bien:"Desde el dique se ve la ciudad entera, abajo.",mal:"El dique es alto y te mareaste; repasá la imagen y seguimos."}],
orinoco:[
{tramo:2,icono:'ola',titulo:"Los raudales de Atures",reto:"ruta",texto:"Antes de Puerto Ayacucho el río se aprieta entre rocas negras y salta: son los raudales de Atures y, más arriba, los de Maipures, que Humboldt describió en 1800 como las grandes cataratas del Orinoco. Ningún barco los pasa: la carga va en camión unos 60 km. Para tomar el camión hay que saber adónde sigue el río.",bien:"Camión tomado: la curiara espera río abajo, ya sin raudales.",mal:"Te quedaste mirando el agua saltar; repasá la ruta y seguimos."},
{tramo:5,icono:'puente',titulo:"El puente de Angostura",reto:"imagen",texto:"En 1967 se tendió aquí el primer puente sobre el Orinoco: un puente colgante de 1,7 km entre Ciudad Bolívar y Soledad, en el punto donde el río se estrecha. Desde abajo la curiara parece un juguete. Para pasar por debajo tenés que reconocer una parada que ya viste.",bien:"Pasaste bajo el puente con la imagen bien puesta.",mal:"El puente pasó de largo; repasá la imagen y seguimos."},
{tramo:7,icono:'barca:canoa',titulo:"Los caños del delta",reto:"mar",texto:"El delta del Orinoco se abre en cientos de caños entre manglares y palmas de moriche. Ahí viven los waraos en casas sobre pilotes, y su nombre quiere decir «gente de la curiara». Para no perderte en los caños hay que saber a qué mar sale el río.",bien:"Caño correcto: el agua ya sabe a sal.",mal:"Caño equivocado, pero un warao te enseña el camino; repasá el mar y seguimos."}],
murray:[
{tramo:2,icono:'barca:vapor',titulo:"La carrera de los vapores",reto:"imagen",texto:"En 1853 dos vapores, el Mary Ann y el Lady Augusta, se lanzaron río arriba para ver cuál llegaba primero a Swan Hill; ganó el Mary Ann, y así empezó la época de los vapores del Murray. Para no perder la carrera hay que reconocer una parada que ya viste.",bien:"¡Adelante! Tu vapor pasa al otro con la rueda echando espuma.",mal:"El otro vapor se adelantó; repasá la imagen y seguimos."},
{tramo:4,icono:'nudo',titulo:"Las esclusas",reto:"ruta",texto:"Desde 1922 el río bajo tiene esclusas y presas que lo mantienen navegable en la seca: la de Mildura es la número 11. El vapor entra, se cierran las compuertas, el agua baja y la puerta de adelante se abre. Para pedir paso hay que saber adónde sigue el río.",bien:"Compuerta abierta: el vapor baja un escalón de agua.",mal:"La compuerta sigue cerrada; repasá la ruta y seguimos."},
{tramo:8,icono:'viento',titulo:"La boca que se cierra",reto:"mar",texto:"Entre el lago Alexandrina y el mar el río pasa por una boca de arena que el viento y las olas del sur van cerrando; en las sequías se tapa del todo, y unas dragas la mantienen abierta desde 2002. Para salir hay que saber a qué mar va el río.",bien:"Boca abierta: el vapor sale entre las dunas.",mal:"La arena ganó; repasá el mar y seguimos."}],
sanlorenzo:[
{tramo:2,icono:'aduana',titulo:"La escalera de agua",reto:"imagen",texto:"Entre Montreal y el lago Ontario la Vía Marítima sube los barcos 68 m con siete esclusas; dos de ellas, en Massena, son de Estados Unidos, y la frontera va por el medio del río. Para pasar la esclusa hay que reconocer una parada que ya viste.",bien:"Compuertas abiertas: la canoa sube el escalón entre barcos enormes.",mal:"El esclusero te hizo esperar; repasá la imagen y seguimos."},
{tramo:3,icono:'ola',titulo:"Los rápidos de Lachine",reto:"ruta",texto:"Antes de Montreal el río cae por los rápidos de Lachine, que pararon a Cartier en 1535 y a todos los barcos hasta el canal de 1825. Se llaman así por burla: La Salle, que vivía ahí, soñaba con encontrar por el río el camino a la China. Para rodearlos hay que saber adónde sigue el río.",bien:"Canoa al hombro y rápidos rodeados: la carga llegó seca.",mal:"La canoa dio una vuelta en el remolino; repasá la ruta y seguimos."},
{tramo:5,icono:'hielo',titulo:"El puente de hielo",reto:"frase",texto:"En invierno el río se congela frente a Quebec, y hasta hace un siglo casi cada año se formaba un puente de hielo hasta Lévis, por donde cruzaban trineos y hasta caballos. Hoy los rompehielos abren el canal. Con la canoa hay que esperar el deshielo y, mientras tanto, recitar la frase.",bien:"Frase entera y hielo roto: el río sigue.",mal:"El hielo aguanta un día más; repasá la frase y seguimos."}],
zambeze:[
{tramo:3,icono:'lluvia',titulo:"La lluvia de la catarata",reto:"ruta",texto:"Antes de Livingstone el río, de casi dos kilómetros de ancho, cae entero en una grieta: las cataratas Victoria. El rocío sube cientos de metros y cae como lluvia sobre la selva de la orilla, que por eso siempre está verde, y el estruendo se oye a kilómetros. Para cargar el mokoro por tierra hay que saber adónde sigue el río.",bien:"Mokoro al hombro: empapados, pero río abajo.",mal:"El rocío te dejó sin ver el camino; repasá la ruta y seguimos."},
{tramo:4,icono:'animal:hipo',titulo:"La Operación Noé",reto:"imagen",texto:"Cuando la presa de Kariba cerró el río en 1958, el agua subió durante años y los animales quedaron atrapados en islas cada vez más chicas. Guardaparques en botes rescataron a unos 6 000: antílopes, monos, serpientes y hasta rinocerontes atados a balsas. Para ayudar en el rescate hay que reconocer una parada que ya viste.",bien:"Un antílope más en la orilla, gracias a vos.",mal:"El bote salió sin vos; repasá la imagen y seguimos."},
{tramo:7,icono:'viento',titulo:"El ciclón del delta",reto:"mar",texto:"El delta del Zambeze mira al canal de Mozambique, por donde entran los ciclones del Índico entre enero y marzo: en 2019 el ciclón Idai inundó toda la región. Cuando el viento sopla del mar hay que saber a qué mar sale el río para buscar refugio del lado correcto.",bien:"Refugio a tiempo: el mokoro amarrado entre los manglares.",mal:"El viento te dio vueltas; repasá el mar y seguimos."}],
tempisque:[
{tramo:3,icono:'lluvia',titulo:"La llena",reto:"ruta",texto:"En setiembre y octubre los aguaceros desbordan el Tempisque y el llano de Filadelfia queda bajo el agua: no se ve dónde termina el río y dónde empieza el potrero. Para no perderse hay que saber qué viene después.",bien:"El bongo encuentra el cauce entre los árboles y sigue.",mal:"Se meten a un potrero inundado y dan vueltas hasta que baja el agua."},
{tramo:6,icono:'ola',titulo:"La marea del golfo",reto:"mar",texto:"Cerca de la boca el río sube y baja con la marea del golfo de Nicoya, y con la marea baja el bongo encalla en el barro entre los mangles. El bonguero pregunta adónde va a salir este río.",bien:"Salís con la marea alta, derechito al golfo.",mal:"El bongo se queda pegado en el barro hasta que la marea vuelve a subir."}],
reventazon:[
{tramo:4,icono:'ola',titulo:"Los rápidos",reto:"frase",texto:"Entre Juan Viñas y Turrialba el Reventazón salta rápidos de clase III y IV, cada uno con su nombre. El guía grita la ruta entera para que remés a tiempo.",bien:"Pasás los rápidos empapado y gritando de gusto.",mal:"La balsa se da vuelta y salís nadando, con casco y todo, hasta la orilla."},
{tramo:5,icono:'tren',titulo:"El tren del Atlántico",reto:"ruta",texto:"Junto al río, entre Turrialba y Siquirres, corría el ferrocarril al Atlántico. El maquinista te grita desde la vía: ¿sabés qué parada sigue después de la próxima?",bien:"El tren pita dos veces y te acompaña un rato por la orilla.",mal:"El tren se te adelanta y llegás a la parada cuando ya se fue."}],
sarapiqui:[
{tramo:2,icono:'lluvia',titulo:"El aguacero",reto:"imagen",texto:"En Sarapiquí caen más de 4 000 mm de lluvia al año y el río sube de golpe con un aguacero. Mientras escampa, bajo un chilamate, contá algo de una ciudad que ya conocés.",bien:"Escampa y el río, más alto, te lleva más rápido.",mal:"El aguacero dura toda la tarde; salís cuando ya oscurece."},
{tramo:5,icono:'espada',titulo:"Los vigías de 1856",reto:"mar",texto:"En 1856 los filibusteros de William Walker rondaban el San Juan y las tropas de Costa Rica vigilaban el Sarapiquí. Un vigía en la orilla pide la contraseña: adónde va a dar este río.",bien:"Te dejan pasar con un saludo militar.",mal:"Te hacen esperar en la orilla hasta que alguien te reconoce."}],
sanjuan:[
{tramo:3,icono:'castillo',titulo:"El raudal del Castillo",reto:"ruta",texto:"Frente al castillo el río salta el raudal del Diablo. Los vapores del Tránsito no podían pasarlo: los pasajeros bajaban, caminaban por la orilla y subían a otro vapor río abajo. El piloto te pregunta qué parada sigue después de la próxima.",bien:"Pasás el raudal con el castillo mirándote desde arriba.",mal:"El vapor se atraviesa en el raudal y hay que sacarlo a cables."},
{tramo:4,icono:'aduana',titulo:"La frontera",reto:"pais",texto:"Pasando El Castillo el río se vuelve frontera: la orilla derecha es Costa Rica y el agua es de Nicaragua. Un guardia sube al vapor y pregunta en qué país queda la próxima parada.",bien:"Sella el pasaporte y te desea buen viaje.",mal:"Revisa la bodega despacio, muy despacio, antes de dejarte seguir."}],
tarcoles:[
{tramo:3,icono:'animal:caballo',titulo:"El camino de mulas",reto:"ruta",texto:"Por aquí bajaba el café en carretas y mulas hacia Puntarenas, y cruzaba el río Grande en una balsa. El arriero te pregunta qué parada sigue después de la próxima.",bien:"El arriero te deja pasar delante de sus mulas.",mal:"Las mulas se te cruzan y esperás un buen rato en la orilla."},
{tramo:5,icono:'animal:cocodrilo',titulo:"Los cocodrilos del puente",reto:"imagen",texto:"Debajo del puente de la carretera toman el sol decenas de cocodrilos. Uno se cruza delante de la lancha y no tiene apuro. Mientras se aparta, contá algo de una ciudad que ya conocés.",bien:"El cocodrilo se hunde despacio y la lancha pasa.",mal:"El cocodrilo bosteza y se queda un rato; esperás a que se vaya."}],
terraba:[
{tramo:4,icono:'mascara',titulo:"Los diablitos",reto:"frase",texto:"En Boruca, cada fin de año, los diablitos con máscara pelean tres días contra el toro, que son los españoles, y al final ganan. Un diablito te cierra el paso y pide la frase del río.",bien:"El diablito baila y te deja pasar.",mal:"El diablito te persigue un rato por la orilla, riéndose."},
{tramo:5,icono:'piedra',titulo:"Las esferas",reto:"imagen",texto:"En Palmar la compañía bananera encontró esferas de piedra casi perfectas, algunas de más de dos metros y varias toneladas, hechas hace más de mil años. Nadie sabe para qué. Para pasar entre ellas, contá algo de una ciudad que ya conocés.",bien:"Pasás entre las esferas sin tocar ninguna.",mal:"Rozás una esfera y rueda un poquito; nadie lo vio."}]
};

function fantasma(r){const n=r.paradas.length;let monedas=10,bodega=[];

return monedas}

case 'balsa':return '<path class="casco" d="M-11 -2.5 Q-12 -2.5 -12 -1.5 L-12 1.5 Q-12 2.5 -11 2.5 L11 2.5 Q12 2.5 12 1.5 L12 -1.5 Q12 -2.5 11 -2.5 Z"/><path class="linea" d="M-7 -2.5 v5 M-2.5 -2.5 v5 M2 -2.5 v5 M6.5 -2.5 v5" stroke-width=".6"/><circle class="fig" cx="4" cy="-6.6" r="1.7"/><path class="palo" d="M4 -4.9 v2.4" stroke-width="1.2"/><path class="palo" d="M0.5 -9.4 L8 -1.2" stroke-width=".9"/><path class="casco" d="M7 -2.4 L9.4 -0.2 L7.6 0.6 Z"/>';

let animB=null;
function animarBarca(poly,t0,t1,px,tierra){const g=document.getElementById('barca'),m=document.getElementById('masc');if(!g)return;if(animB)cancelAnimationFrame(animB);
const poner=p=>{let ang=p.ang,sx=1;if(Math.cos(ang*Math.PI/180)<0){ang=ang-180;sx=-1}g.setAttribute('transform',`translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${ang.toFixed(1)}) scale(${sx} 1)`);if(m)m.setAttribute('transform',`rotate(${(-ang*sx).toFixed(1)}) scale(${px.toFixed(4)})`)}/* derecho y mirando hacia adelante: se anula el giro, no el espejo */;
if(poly.length<2){poner({x:poly[0][0],y:poly[0][1],ang:0});return}
const L=[0];for(let i=1;i<poly.length;i++)L[i]=L[i-1]+Math.hypot(poly[i][0]-poly[i-1][0],poly[i][1]-poly[i-1][1]);const tot=L[L.length-1]||1;
const pos=t=>{const s=t*tot;let i=1;while(i<L.length-1&&L[i]<s)i++;const a=poly[i-1],b=poly[i],u=(L[i]-L[i-1])?(s-L[i-1])/(L[i]-L[i-1]):0;return{x:a[0]+(b[0]-a[0])*u,y:a[1]+(b[1]-a[1])*u,ang:Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI,i}};
const estela=document.getElementById('estela'),capa=document.getElementById('capa');
const dibujarEstela=p=>{if(!estela)return;const pts=t1>=t0?poly.slice(0,p.i).concat([[p.x,p.y]]):[[p.x,p.y]].concat(poly.slice(p.i));estela.setAttribute('d','M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L'))};
const salpicar=p=>{if(!capa||!capa.insertAdjacentHTML)return;capa.insertAdjacentHTML('beforeend',`<g class="salpicon${tierra?' polvo':''}" transform="translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) scale(${px.toFixed(4)})"><g class="sal"><circle r="4"/><circle cx="-5" cy="-2" r="1.5"/><circle cx="5" cy="-2" r="1.5"/><circle cy="-5" r="1.2"/></g></g>`);setTimeout(()=>{const s=capa.querySelector('.salpicon');if(s)s.remove()},1000)};
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(t0===t1||reduce){poner(pos(t1));S.olas=false;return}
const T=performance.now(),dur=1400;
const step=now=>{let k=Math.min(1,(now-T)/dur);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;const p=pos(t0+(t1-t0)*k);poner(p);dibujarEstela(p);if(k<1)animB=requestAnimationFrame(step);else{animB=null;if(estela)estela.setAttribute('class','estela fin');salpicar(p);if(S.olas){S.olas=false;olear()}}};
animB=requestAnimationFrame(step)}
function olear(){const o=document.getElementById('olas');if(!o||!o.classList)return;o.classList.remove('va');void o.offsetWidth;o.classList.add('va')}
(function init(){cargarPerfiles();if(voz.soporte())window.speechSynthesis.getVoices();render(true)})();
window.addEventListener('resize',()=>{acomodarPie();if(S.foco)renderMapa(S.foco,true);const pf=document.getElementById('perfil');if(pf&&!pf.hidden&&S.pantalla==='rio')pf.innerHTML=perfilSVG(rioPor(S.rio))});
function plegarMapa(){const a=document.getElementById('arriba');a.classList.toggle('compacto');const b=document.querySelector('.plegar');b.textContent=a.classList.contains('compacto')?'▴':'▾';
if(S.foco)renderMapa(S.foco,!a.classList.contains('compacto'))/* al plegar, la caja se anima (el alto del CSS va más rápido y manda); al desplegar salta ya, y el mapa solo destapa */}
